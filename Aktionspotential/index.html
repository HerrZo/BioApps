e geringfügigen Ionenverschiebungen eines einzelnen APs werden kontinuierlich von der Na⁺/K⁺-ATPase ausgeglichen (Hinweis: Für ein einzelnes AP strömt nur ein winziger Bruchteil der Ionen, ca. 0,001 %!). Die Zelle ist voll erregbar.",naGate1:"closed",naGate2:"open",naOverall:"geschlossen",kGate:"closed",ionFlow:"Stationäres Gleichgewicht über K⁺-Leckkanäle und Na⁺/K⁺-Pumpe stabilisiert.",membranePolarity:"normal",schulbuchRef:"Buch S. 30 (M3) & S. 32"}],Df=[{name:"Kalium-Ionen",formula:"K⁺",intra:140,extra:5,equilibriumPotential:-88,permeabilityRest:"Sehr hoch (offene Leckkanäle)",color:"#8b5cf6",role:"Bestimmt maßgeblich das Ruhepotential; strömt bei Repolarisation aus der Zelle."},{name:"Natrium-Ionen",formula:"Na⁺",intra:10,extra:145,equilibriumPotential:66,permeabilityRest:"Sehr gering (minimaler Leckstrom)",color:"#ef4444",role:"Träger des Aufstrichs (Depolarisation); strömt schlagartig bei Schwellenüberschreitung ein."},{name:"Chlorid-Ionen",formula:"Cl⁻",intra:5,extra:120,equilibriumPotential:-84,permeabilityRest:"Gering bis mäßig",color:"#10b981",role:"Extrazelluläres Hauptanion; stabilisiert Membranpotential."},{name:"Organische Anionen",formula:"A⁻",intra:155,extra:5,equilibriumPotential:0,permeabilityRest:"Vollkommen impermeabel (0)",color:"#f59e0b",role:"Große intrazelluläre Protein- und Phosphat-Anionen; können die Membran nicht passieren, erzeugen negative Innenladung."}],Of=[{term:"Ruhepotential",category:"Grundlagen",definition:"Elektrische Potentialdifferenz (Spannung) von ca. -70 mV zwischen Zellinnerem (-) und Extrazellularraum (+) einer nicht erregten Nervenzelle.",details:"Kommt durch die selektive Permeabilität der Membran (hohe K⁺-Durchlässigkeit via Leckkanäle) und die ungleiche Ionenverteilung zustande. Es entspricht annähernd dem K⁺-Gleichgewichtspotential.",misconception:"Fehlvorstellung: Im Ruhezustand bewegen sich keine Ionen. Richtig: Es herrscht ein dynamisches Fliessgleichgewicht zwischen K⁺-Diffusionsausstrom und elektrostatischer Rückhaltekraft.",formula:"U_m \\approx -70\\text{ mV}"},{term:"Aktionspotential (AP)",category:"Phasen",definition:"Kurzzeitige, stereotype Abweichung des Membranpotentials vom Ruhewert bis in den positiven Bereich (+30 mV), ausgelöst durch überschwellige Depolarisation.",details:"Dauert 1–2 ms und dient der verlustfreien Signalübertragung über weite Strecken entlang des Axons.",misconception:"Fehlvorstellung: Ein stärkerer Reiz erzeugt ein höheres Aktionspotential. Richtig: APs gehorchen dem Alles-oder-Nichts-Prinzip und haben immer die gleiche Amplitude (~100 mV)."},{term:"Alles-oder-Nichts-Prinzip",category:"Grundlagen",definition:"Grundgesetz der neuronalen Erregung: Ein Reiz löst entweder ein vollständiges Aktionspotential maximaler Amplitude aus oder gar keines.",details:"Wird der Schwellenwert (-50 mV) erreicht, öffnet sich eine kritische Masse an Na⁺-Kanälen, was eine unaufhaltsame positive Rückkopplung startet. Reize oberhalb der Schwelle verändern die Amplitude des APs nicht.",misconception:"Unterschwellige Reize gehen nicht völlig verloren: Sie erzeugen lokale elektrotonische Potentiale, die aber passiv rasch abklingen."},{term:"Schwellenwert / Schwellenpotential",category:"Grundlagen",definition:"Das kritische Membranpotential (ca. -50 mV), ab dem der Na⁺-Einstrom den K⁺-Ausstrom übertrifft und ein AP unausweichlich zündet.",details:"Bei Erreichen des Schwellenwerts öffnen sich genügend spannungsgesteuerte Na⁺-Kanäle, sodass die Depolarisation sich selbst verstärkt."},{term:"Spannungsgesteuerter Natriumkanal",category:"Ionenkanäle",definition:"Transmembranprotein mit zwei funktionellen Toren (Aktivierungstor 1 und Inaktivierungstor 2), das die schnelle Depolarisation ermöglicht.",details:"Besitzt drei Konformationen: 1. Geschlossen (Ruhe: Tor 1 zu, Tor 2 offen), 2. Geöffnet (Depolarisation: Tor 1 offen, Tor 2 offen), 3. Inaktiviert (Refraktär: Tor 1 offen, Tor 2 durch Ball-and-Chain geschlossen).",misconception:'"Geschlossen" und "Inaktiviert" sind nicht dasselbe! Nur ein geschlossener Kanal kann durch Depolarisation geöffnet werden; ein inaktivierter Kanal ist absolut blockiert.'},{term:"Inaktivierungstor (Ball-and-Chain / Tor 2)",category:"Ionenkanäle",definition:"Ein zeitgesteuertes, zellinneres Peptidsegment, das ca. 1 ms nach Kanalöffnung wie ein Stöpsel in die Kanalpore schwingt.",details:"Schließt den Kanal unabhängig von der Membranspannung und ist die molekulare Ursache der absoluten Refraktärphase. Öffnet sich erst wieder, wenn die Membran repolarisiert ist.",formula:"t_{\\text{inaktiv}} \\approx 1\\text{ ms}"},{term:"Absolute Refraktärphase",category:"Phasen",definition:"Zeitspanne während des APs und der frühen Repolarisation (ca. 1–2 ms), in der kein noch so starker Reiz ein erneutes AP auslösen kann.",details:"Molekulare Ursache: Na⁺-Kanäle sind inaktiviert (Tor 2 geschlossen). Da keine Na⁺-Kanäle aktivierbar sind, ist die Membran unerrregbar. Begrenzt die maximale Impulsfrequenz auf ca. 500 Hz.",misconception:"Fehlvorstellung: Durch extreme Reizstromstärke kann man die absolute Refraktärphase überwinden. Richtig: Völlig unmöglich, da die physikalische Pore durch die Kugel verstopft ist."},{term:"Relative Refraktärphase",category:"Phasen",definition:"Zeitspanne nach der absoluten Refraktärphase (ca. 2–5 ms), in der ein AP auslösbar ist, jedoch nur durch überdurchschnittlich starke Reize und mit verminderter Amplitude.",details:"Ursache: Ein Teil der Na⁺-Kanäle hat den geschlossenen Zustand wiedererlangt, aber noch nicht alle; zudem sind K⁺-Kanäle noch teilweise offen (Hyperpolarisation erhöht den Abstand zur Schwelle).",misconception:"Fehlvorstellung: Nach 2 ms ist das Axon sofort wieder im Normalzustand. Richtig: Wegen der Nach-Hyperpolarisation ist die Schwelle vorübergehend erhöht."},{term:"Signalcodierung & Frequenzmodulation",category:"Erregungsleitung",definition:"Die Übersetzung kontinuierlicher Reizparameter (Stärke, Dauer) in digitale Folgen von Aktionspotentialen.",details:"Da die Amplitude von APs immer gleich ist, wird die Reizstärke über die Frequenz (Zahl der APs pro Sekunde) und die Reizdauer über die Länge der Salve codiert. Stärkerer Reiz = kürzere Erholungszeit in der relativen Refraktärphase = höhere AP-Frequenz.",formula:"f \\propto \\text{Reizst'arke}"},{term:"Natrium-Kalium-Pumpe (Na⁺/K⁺-ATPase)",category:"Ionenkanäle",definition:"Aktives, ATP-abhängiges Transportprotein in der Zellmembran, das pro Zyklus 3 Na⁺ nach außen und 2 K⁺ nach innen pumpt (Antiport).",details:"Verbraucht 50–70 % des gesamten Energiebedarfs einer Nervenzelle. Ist elektrogen (erzeugt einen winzigen Netto-Strom von +1 nach außen) und dient der langfristigen Erhaltung der Ionenkonzentrationsgradienten.",formula:"3\\text{ Na}^+_{\\text{innen}} + 2\\text{ K}^+_{\\text{auss en}} + \\text{ATP} \\rightarrow 3\\text{ Na}^+_{\\text{auss en}} + 2\\text{ K}^+_{\\text{innen}} + \\text{ADP} + \\text{P}_i"},{term:"Kalium-Gleichgewichtspotential",category:"Grundlagen",definition:"Die Membranspannung, bei der die chemische Diffusionskraft für K⁺ exakt gleich groß ist wie die elektrostatische Rückhaltekraft der negativen Innenladung.",details:"Wird durch die Nernst-Gleichung berechnet und liegt bei ca. -88 mV bis -90 mV. Da die Membran in Ruhe fast nur für K⁺ durchlässig ist, liegt das Ruhepotential (-70 mV) sehr nahe an diesem Wert.",formula:"E_K = \\frac{R \\cdot T}{z \\cdot F} \\cdot \\ln \\left(\\frac{[K^+]_{\\text{aussen}}}{[K^+]_{\\text{innen}}}\\right) \\approx -88\\text{ mV}"},{term:"Einbahnstraße der Erregungsleitung",category:"Erregungsleitung",definition:"Die biologische Tatsache, dass Aktionspotentiale im Axon physiologisch nur in eine Richtung (vom Axonhügel zur Synapse) wandern.",details:"Grund: Der soeben erregte Membranabschnitt hinter der Erregungswelle befindet sich in der absoluten Refraktärphase (Na⁺-Kanäle inaktiviert). Die lokalen Ausgleichsströme können diesen Bereich nicht erneut depolarisieren.",misconception:"Wird ein Axon künstlich in der Mitte gereizt, läuft
