<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style rel="stylesheet" crossorigin>@import"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap";
.dark body{background-color:#052e16!important;color:#dcfce7!important}
.dark .bg-white{background-color:#14532d;color:#dcfce7}
.dark .bg-gray-50,.dark .bg-gray-100{background-color:#166534;color:#dcfce7}
.dark .bg-green-50{background-color:#14532d}
.dark .bg-green-100{background-color:#166534}
.dark .from-green-50,.dark .via-emerald-50,.dark .to-teal-50,.dark .from-green-50\/80{--tw-gradient-from: #052e16;--tw-gradient-via: #14532d;--tw-gradient-to: #166534}
.dark .text-gray-600,.dark .text-gray-500{color:#86efac}
.dark .text-gray-700,.dark .text-gray-800,.dark .text-gray-900{color:#dcfce7}
.dark .text-green-800,.dark .text-green-700{color:#4ade80}
.dark .border-green-100,.dark .border-green-200{border-color:#166534}
.dark .border-gray-200{border-color:#15803d}
.dark header,.dark nav{background-color:#052e16;border-color:#166534}
.dark input,.dark select,.dark textarea{background-color:#14532d;color:#dcfce7;border-color:#15803d}
.dark input::placeholder{color:#86efac}
.dark .hover\:bg-green-50:hover{background-color:#14532d}
.dark .hover\:bg-green-100:hover{background-color:#166534}
.dark ::-webkit-scrollbar-track{background:#052e16!important}
.dark ::-webkit-scrollbar-thumb{background:#15803d!important}
[data-dark-toggle]{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;font-size:18px;background:#16653426;transition:background .2s;padding:0}
[data-dark-toggle]:hover{background:#1665344d}
.dark [data-dark-toggle]{background:#bbf7d026}
.dark [data-dark-toggle]:hover{background:#bbf7d040}
@keyframes fadeIn{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-in{animation:fadeIn .5s ease-out forwards}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-in-up{animation:fadeInUp .5s ease-out forwards}
@keyframes slideUp{0%{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.animate-slide-up{animation:slideUp .6s ease-out forwards}
@keyframes float{0%,to{transform:translateY(0)}50%{transform:translateY(-6px)}}
.animate-float{animation:float 3s ease-in-out infinite}
@keyframes pulse-ring{0%,to{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.8}}
.animate-pulse-ring{animation:pulse-ring 2s ease-in-out infinite}
body{font-family:Inter,system-ui,sans-serif}
.fade-in{animation:fadeIn .4s ease-out forwards}
.pulse{animation:pulse-ring 2s ease-in-out infinite}
@keyframes wave{0%{d:path("M0,20 Q25,5 50,20 Q75,35 100,20")}50%{d:path("M0,20 Q25,35 50,20 Q75,5 100,20")}to{d:path("M0,20 Q25,5 50,20 Q75,35 100,20")}}
@keyframes lensSquish{0%,to{rx:12;ry:8}50%{rx:7;ry:13}}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.svg-part{cursor:pointer;transition:filter .2s,opacity .2s}
.svg-part:hover{filter:brightness(1.25)}
.svg-part.active-part{filter:drop-shadow(0 0 6px #16a34a)}
.dark .card{background:#1a2e1a;border-color:#2d4a2d}
.dark .card-inner{background:#1f351f;border-color:#2d4a2d}
.dark body{background:#0f1f0f;color:#e2f0e2}
@keyframes scanLine{0%{transform:translate(-100%)}to{transform:translate(200%)}}
.scan-line{animation:scanLine 2s linear infinite}</style>
