<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinnesorgane – Bio Lern-App (8. Klasse)</title>
  <meta name="theme-color" content="#166534">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../shared/tailwind-config.js"></script>
  <link rel="stylesheet" href="../shared/dark-mode.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }

    @keyframes pulse-ring { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.8} }
    .pulse { animation: pulse-ring 2s ease-in-out infinite; }

    @keyframes wave {
      0%   { d: path("M0,20 Q25,5 50,20 Q75,35 100,20"); }
      50%  { d: path("M0,20 Q25,35 50,20 Q75,5 100,20"); }
      100% { d: path("M0,20 Q25,5 50,20 Q75,35 100,20"); }
    }

    @keyframes lensSquish {
      0%,100% { rx:12; ry:8; }
      50%      { rx:7;  ry:13; }
    }

    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    /* SVG interactive highlights */
    .svg-part { cursor:pointer; transition: filter .2s, opacity .2s; }
    .svg-part:hover { filter: brightness(1.25); }
    .svg-part.active-part { filter: drop-shadow(0 0 6px #16a34a); }

    /* Dark mode card overrides */
    .dark .card { background:#1a2e1a; border-color:#2d4a2d; }
    .dark .card-inner { background:#1f351f; border-color:#2d4a2d; }
    .dark body { background:#0f1f0f; color:#e2f0e2; }

    @keyframes scanLine {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .scan-line { animation: scanLine 2s linear infinite; }
  </style>
</head>
<body class="bg-green-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
<div id="root"></div>
<script src="../shared/dark-mode.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ─── SVG Icons ───────────────────────────────────────────────────────────────
const IconEye   = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
const IconEar   = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 8a6 6 0 0 1 12 0c0 7-7 11-7 11"/><path d="M10.5 13.5A2.5 2.5 0 0 0 13 11"/><path d="M6.5 11.5A5.5 5.5 0 0 1 17 8"/></svg>;
const IconNose  = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2c0 0-3 4-3 9 0 2 1 3 3 3s3-1 3-3c0-5-3-9-3-9z"/><path d="M9 14c-2 1-4 2-4 4h14c0-2-2-3-4-4"/></svg>;
const IconHand  = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8V7a2 2 0 1 1 4 0"/></svg>;
const IconBrain = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.84A2.5 2.5 0 0 1 9.5 2"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.84A2.5 2.5 0 0 0 14.5 2"/></svg>;
const IconCheck = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>;
const IconX     = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const IconStar  = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
const IconHome  = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const IconArrow = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>;

// ─── Storage helpers ──────────────────────────────────────────────────────────
const LS = {
  get: (k, def) => { try { const v=localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch{ return def; } },
  set: (k, v)   => { try { localStorage.setItem(k, JSON.stringify(v)); } catch{} },
};

// ═══════════════════════════════════════════════════════════════════════════════
// STATION 1 – DAS AUGE
// ═══════════════════════════════════════════════════════════════════════════════
const EyeParts = [
  { id:'hornhaut',  label:'Hornhaut',       color:'#86efac', desc:'Die transparente, gewölbte Außenschicht des Auges. Sie bricht das Licht als erste Struktur und liefert den größten Anteil der Brechkraft (~2/3).' },
  { id:'iris',      label:'Iris (Regenbogenhaut)', color:'#4ade80', desc:'Der farbige Ring des Auges. Enthält Muskeln, die die Pupillengröße regulieren – bei Helligkeit kleiner, bei Dunkelheit größer.' },
  { id:'pupille',   label:'Pupille',         color:'#052e16', desc:'Die Öffnung in der Mitte der Iris. Kein eigenes Gewebe – nur eine Lücke! Reguliert die einfallende Lichtmenge.' },
  { id:'linse',     label:'Linse',           color:'#d9f99d', desc:'Elastische, bikonvexe Linse hinter der Iris. Verfeinert die Brechung und ermöglicht Akkommodation (Nah-/Fernsehen) durch den Ziliarmuskel.' },
  { id:'glaskoerper',label:'Glaskörper',     color:'#bbf7d0', desc:'Gallertartige, transparente Masse, die den Augapfel ausfüllt. Hält die Form aufrecht und leitet Licht zur Netzhaut weiter.' },
  { id:'netzhaut',  label:'Netzhaut (Retina)', color:'#fde68a', desc:'Die lichtempfindliche Schicht innen am Augapfel. Enthält ~120 Mio. Stäbchen (Schwarz-Weiß) und ~6 Mio. Zapfen (Farbsehen).' },
  { id:'sehnerv',   label:'Sehnerv',         color:'#fca5a5', desc:'Bündel aus ~1,2 Mio. Nervenfasern. Leitet elektrische Impulse von der Netzhaut zum Sehzentrum im Gehirn (Okzipitallappen).' },
  { id:'gelb',      label:'Gelber Fleck (Fovea)', color:'#fbbf24', desc:'Stelle des schärfsten Sehens – dichte Ansammlung von Zapfen, keine Stäbchen. Hier trifft das Bild beim direkten Hinschauen auf.' },
  { id:'blind',     label:'Blinder Fleck',   color:'#d1d5db', desc:'Stelle ohne Fotorezeptoren – hier tritt der Sehnerv aus. Das Gehirn "ergänzt" fehlende Information. Kannst du ihn finden? (Blinder-Fleck-Test)' },
];

const EyeSVG = ({ activePart, setActivePart }) => (
  <svg viewBox="0 0 340 200" className="w-full max-w-md mx-auto" style={{maxHeight:220}}>
    {/* Sklera / Augapfel */}
    <ellipse cx="170" cy="100" rx="100" ry="90" fill="#f8fafc" stroke="#94a3b8" strokeWidth="2"/>
    {/* Glaskoerper */}
    <ellipse cx="170" cy="100" rx="88" ry="78" fill="#ecfdf5" className="svg-part" onClick={()=>setActivePart('glaskoerper')}
      style={{opacity: activePart==='glaskoerper'?1:0.7}}/>
    {/* Netzhaut (arc) */}
    <path d="M 80 100 A 90 90 0 0 0 260 100" fill="none" stroke="#fde68a" strokeWidth="10"
      className="svg-part" onClick={()=>setActivePart('netzhaut')}
      style={{opacity: activePart==='netzhaut'?1:0.8}}/>
    {/* Sehnerv */}
    <rect x="258" y="88" width="28" height="24" rx="6" fill="#fca5a5" className="svg-part" onClick={()=>setActivePart('sehnerv')}/>
    <text x="290" y="103" fontSize="9" fill="#374151">Sehnerv</text>
    {/* Blinder Fleck */}
    <circle cx="248" cy="100" r="9" fill="#d1d5db" stroke="#9ca3af" strokeWidth="1.5" className="svg-part" onClick={()=>setActivePart('blind')}/>
    <text x="240" y="122" fontSize="8" fill="#6b7280">Blind.</text>
    {/* Gelber Fleck */}
    <circle cx="200" cy="100" r="10" fill="#fbbf24" className="svg-part" onClick={()=>setActivePart('gelb')}/>
    <text x="193" y="122" fontSize="8" fill="#92400e">Fovea</text>
    {/* Hornhaut */}
    <ellipse cx="75" cy="100" rx="18" ry="30" fill="#86efac" stroke="#22c55e" strokeWidth="1.5" className="svg-part" onClick={()=>setActivePart('hornhaut')}/>
    <text x="52" y="145" fontSize="9" fill="#166534">Hornhaut</text>
    {/* Iris */}
    <circle cx="105" cy="100" r="26" fill="#4ade80" className="svg-part" onClick={()=>setActivePart('iris')}/>
    {/* Pupille */}
    <circle cx="105" cy="100" r="12" fill="#052e16" className="svg-part" onClick={()=>setActivePart('pupille')}/>
    {/* Linse */}
    <ellipse cx="128" cy="100" rx="16" ry="22" fill="#d9f99d" stroke="#86efac" strokeWidth="1.5" className="svg-part" onClick={()=>setActivePart('linse')}/>
    {/* Labels */}
    <text x="92" y="155" fontSize="9" fill="#15803d">Iris</text>
    <text x="100" y="70" fontSize="9" fill="#052e16">Pupille</text>
    <text x="120" y="68" fontSize="9" fill="#4d7c0f">Linse</text>
    <text x="155" y="60" fontSize="9" fill="#15803d">Glaskörper</text>
    {/* Active highlight ring */}
    {activePart && (() => {
      const p = EyeParts.find(p=>p.id===activePart);
      return p ? <circle cx="105" cy="100" r="4" fill={p.color} className="pulse" opacity="0.6"/> : null;
    })()}
  </svg>
);

const AkkommodationDemo = () => {
  const [mode, setMode] = useState('fern'); // 'nah' | 'fern'
  return (
    <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900">
      <h3 className="font-bold text-green-800 dark:text-green-300 mb-3">Akkommodation – Nah vs. Fern</h3>
      <div className="flex gap-3 mb-4">
        {['fern','nah'].map(m => (
          <button key={m} onClick={()=>setMode(m)}
            className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${mode===m?'bg-green-600 text-white shadow':'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 hover:bg-green-200'}`}>
            {m==='nah'?'Nahsehen':'Fernsehen'}
          </button>
        ))}
      </div>
      <svg viewBox="0 0 240 100" className="w-full max-w-xs mx-auto">
        {/* Licht-Strahlen */}
        {mode==='fern' ? <>
          <line x1="10" y1="40" x2="120" y2="50" stroke="#86efac" strokeWidth="1.5"/>
          <line x1="10" y1="50" x2="120" y2="50" stroke="#86efac" strokeWidth="1.5"/>
          <line x1="10" y1="60" x2="120" y2="50" stroke="#86efac" strokeWidth="1.5"/>
          <line x1="120" y1="50" x2="220" y2="50" stroke="#4ade80" strokeWidth="1.5"/>
        </> : <>
          <line x1="10" y1="20" x2="120" y2="50" stroke="#86efac" strokeWidth="1.5"/>
          <line x1="10" y1="50" x2="120" y2="50" stroke="#86efac" strokeWidth="1.5"/>
          <line x1="10" y1="80" x2="120" y2="50" stroke="#86efac" strokeWidth="1.5"/>
          <line x1="120" y1="50" x2="220" y2="50" stroke="#4ade80" strokeWidth="1.5"/>
        </>}
        {/* Linse */}
        <ellipse cx="120" cy="50" rx={mode==='nah'?8:14} ry={mode==='nah'?20:12}
          fill="#d9f99d" stroke="#16a34a" strokeWidth="2"
          style={{transition:'all 0.5s ease'}}/>
        {/* Retina */}
        <rect x="210" y="30" width="6" height="40" rx="3" fill="#fde68a"/>
        {/* Fokus-Punkt */}
        <circle cx="220" cy="50" r="4" fill="#16a34a"/>
        {/* Labels */}
        <text x="108" y="85" fontSize="9" fill="#15803d">{mode==='nah'?'dick (nah)':'flach (fern)'}</text>
        <text x="205" y="85" fontSize="9" fill="#15803d">Retina</text>
        {/* Objekt-Symbol */}
        <text x="2" y="38" fontSize="14">{mode==='nah'?'📱':'🏔️'}</text>
      </svg>
      <p className="text-xs text-gray-600 dark:text-gray-400 mt-2 text-center">
        {mode==='nah'
          ? 'Ziliarmuskel kontrahiert → Linse wird dicker (stärker brechend)'
          : 'Ziliarmuskel entspannt → Linse wird flacher (schwächer brechend)'}
      </p>
    </div>
  );
};

const StationAuge = () => {
  const [activePart, setActivePart] = useState(null);
  const info = activePart ? EyeParts.find(p=>p.id===activePart) : null;

  return (
    <div className="fade-in space-y-5 pb-8">
      <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900 shadow-sm">
        <h2 className="text-lg font-bold text-green-800 dark:text-green-300 mb-1">Aufbau des Auges</h2>
        <p className="text-sm text-gray-600 dark:text-gray-400 mb-3">Klicke auf einen Teil des Auges für eine Erklärung.</p>
        <EyeSVG activePart={activePart} setActivePart={setActivePart}/>
        <div className="mt-3 grid grid-cols-3 gap-1.5">
          {EyeParts.map(p => (
            <button key={p.id} onClick={()=>setActivePart(p.id)}
              className={`text-xs px-2 py-1 rounded-lg border transition-all font-medium ${activePart===p.id?'bg-green-600 text-white border-green-600':'bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800 text-green-800 dark:text-green-300 hover:bg-green-100'}`}>
              {p.label}
            </button>
          ))}
        </div>
        {info && (
          <div className="mt-3 p-3 rounded-lg text-sm fade-in" style={{background: info.color+'22', borderLeft:`4px solid ${info.color}`}}>
            <strong className="text-green-900 dark:text-green-200">{info.label}:</strong>{' '}
            <span className="text-gray-700 dark:text-gray-300">{info.desc}</span>
          </div>
        )}
      </div>

      <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900 shadow-sm">
        <h2 className="text-lg font-bold text-green-800 dark:text-green-300 mb-3">Stäbchen &amp; Zapfen</h2>
        <div className="grid grid-cols-2 gap-3">
          <div className="bg-gray-900 rounded-xl p-3 text-center">
            <div className="text-3xl mb-1">🌑</div>
            <div className="text-white font-bold">Stäbchen</div>
            <div className="text-gray-300 text-xs mt-1">~120 Mio. Stück</div>
            <div className="text-gray-400 text-xs mt-2">Schwarz-Weiß-Sehen, Dämmerung &amp; Nacht, sehr lichtempfindlich</div>
          </div>
          <div className="rounded-xl p-3 text-center" style={{background:'linear-gradient(135deg,#fca5a5,#86efac,#93c5fd)'}}>
            <div className="text-3xl mb-1">🔵🟢🔴</div>
            <div className="font-bold text-gray-900">Zapfen</div>
            <div className="text-gray-700 text-xs mt-1">~6 Mio. Stück</div>
            <div className="text-gray-800 text-xs mt-2">Farbsehen, benötigen helles Licht, 3 Typen: Rot, Grün, Blau</div>
          </div>
        </div>
        <div className="mt-3 p-3 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800">
          <p className="text-sm font-semibold text-green-800 dark:text-green-300">💡 Merkhilfe:</p>
          <p className="text-sm text-gray-700 dark:text-gray-300 mt-1">
            <strong>S</strong>täbchen → <strong>S</strong>chatten (Schwarz-Weiß) | <strong>Z</strong>apfen → buntes <strong>Z</strong>elt (Farbe)
          </p>
        </div>
      </div>

      <AkkommodationDemo/>

      <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900 shadow-sm">
        <h2 className="text-lg font-bold text-green-800 dark:text-green-300 mb-3">Kurz- und Weitsichtigkeit</h2>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {[
            { title:'Kurzsichtigkeit (Myopie)', icon:'🔴', desc:'Augapfel zu lang → Bild fällt vor die Netzhaut. Fernere Objekte unscharf. Korrektur: Zerstreuungslinse (konkav, Minus-Glas).' },
            { title:'Weitsichtigkeit (Hyperopie)', icon:'🔵', desc:'Augapfel zu kurz → Bild fällt hinter die Netzhaut. Nahe Objekte unscharf. Korrektur: Sammellinse (konvex, Plus-Glas).' },
          ].map(item => (
            <div key={item.title} className="p-3 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-100 dark:border-green-800">
              <div className="font-semibold text-green-800 dark:text-green-300 text-sm mb-1">{item.icon} {item.title}</div>
              <div className="text-xs text-gray-600 dark:text-gray-400">{item.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════════════════
// STATION 2 – DAS OHR
// ═══════════════════════════════════════════════════════════════════════════════
const EarParts = [
  { id:'ohrmuschel', label:'Ohrmuschel', color:'#a7f3d0', desc:'Sammelt Schallwellen und leitet sie in den Gehörgang. Die Form hilft, die Richtung von Geräuschen zu bestimmen.' },
  { id:'gehoergang', label:'Gehörgang', color:'#6ee7b7', desc:'Kanal (~3,5 cm lang), der den Schall zum Trommelfell leitet. Enthält Ohrenschmalz-Drüsen zum Schutz.' },
  { id:'trommelfell', label:'Trommelfell', color:'#fde68a', desc:'Dünne elastische Membran, die Schallwellen in mechanische Schwingungen umwandelt. Trennt Außen- und Mittelohr.' },
  { id:'hammer', label:'Hammer (Malleus)', color:'#fca5a5', desc:'Erstes der drei Gehörknöchelchen. Ist mit dem Trommelfell verwachsen und nimmt dessen Schwingungen auf.' },
  { id:'amboss', label:'Amboss (Incus)', color:'#fdba74', desc:'Mittleres Gehörknöchelchen. Verbindet Hammer und Steigbügel, verstärkt und überträgt die Schwingungen.' },
  { id:'steigbuegel', label:'Steigbügel (Stapes)', color:'#f9a8d4', desc:'Kleinstes Knochen des menschlichen Körpers (~3 mm)! Überträgt Schwingungen auf das ovale Fenster der Cochlea.' },
  { id:'cochlea', label:'Schnecke (Cochlea)', color:'#86efac', desc:'Spiralförmiges, flüssigkeitsgefülltes Organ. Enthält die Haarzellen, die mechanische Schwingungen in Nervenimpulse umwandeln.' },
  { id:'bogengang', label:'Bogengänge', color:'#a5b4fc', desc:'Drei senkrecht zueinander stehende Halbkreiskanäle – das Gleichgewichtsorgan! Melden Drehbewegungen des Kopfes.' },
  { id:'hoernerv', label:'Hörnerv', color:'#c4b5fd', desc:'Überträgt die Nervenimpulse der Cochlea zum Hörzentrum im Schläfenlappen des Gehirns.' },
];

const EarSVG = ({ activePart, setActivePart }) => (
  <svg viewBox="0 0 320 200" className="w-full max-w-sm mx-auto" style={{maxHeight:200}}>
    {/* Außenohr */}
    <path d="M10,80 Q30,40 60,50 Q80,55 80,100 Q80,140 60,150 Q40,158 30,145" fill="none" stroke="#a7f3d0" strokeWidth="8" strokeLinecap="round"
      className="svg-part" onClick={()=>setActivePart('ohrmuschel')}/>
    <text x="5" y="170" fontSize="9" fill="#065f46">Ohrmuschel</text>
    {/* Gehörgang */}
    <rect x="70" y="88" width="60" height="24" rx="8" fill="#6ee7b7" className="svg-part" onClick={()=>setActivePart('gehoergang')}/>
    <text x="72" y="122" fontSize="9" fill="#065f46">Gehörgang</text>
    {/* Trommelfell */}
    <ellipse cx="134" cy="100" rx="6" ry="18" fill="#fde68a" stroke="#ca8a04" strokeWidth="1.5" className="svg-part" onClick={()=>setActivePart('trommelfell')}/>
    <text x="122" y="128" fontSize="9" fill="#854d0e">Trommel-fell</text>
    {/* Mittelohr Knochen */}
    {/* Hammer */}
    <line x1="140" y1="92" x2="160" y2="88" stroke="#fca5a5" strokeWidth="5" strokeLinecap="round" className="svg-part" onClick={()=>setActivePart('hammer')}/>
    <circle cx="140" cy="92" r="5" fill="#fca5a5" className="svg-part" onClick={()=>setActivePart('hammer')}/>
    {/* Amboss */}
    <line x1="160" y1="88" x2="175" y2="96" stroke="#fdba74" strokeWidth="4" strokeLinecap="round" className="svg-part" onClick={()=>setActivePart('amboss')}/>
    {/* Steigbügel */}
    <path d="M175,96 Q188,88 188,100 Q188,112 175,108" fill="none" stroke="#f9a8d4" strokeWidth="4" strokeLinecap="round" className="svg-part" onClick={()=>setActivePart('steigbuegel')}/>
    <text x="138" y="75" fontSize="9" fill="#9f1239">Hammer</text>
    <text x="157" y="75" fontSize="9" fill="#9a3412">Amboss</text>

const QuizStation = ({ onScoreUpdate }) => {
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [answers, setAnswers] = useState([]);

  const q = questions[idx];

  const handleAnswer = (i) => {
    if (selected !== null) return;
    setSelected(i);
    const correct = i === q.correct;
    const newScore = correct ? score + 1 : score;
    if (correct) setScore(newScore);
    setAnswers(a => [...a, { q: q.q, selected: i, correct: q.correct, ok: correct }]);
  };

  const next = () => {
    if (idx + 1 >= questions.length) {
      // answers state may not yet include the last answer (async setState), so compute directly
      const s = answers.filter(a=>a.ok).length + (selected===q.correct?1:0);
      setDone(true);
      LS.set('sinnesorgane_quiz_score', { score: s, total: questions.length, date: new Date().toLocaleDateString('de-DE') });
      onScoreUpdate(s);
    } else {
      setIdx(i => i + 1);
      setSelected(null);
    }
  };

  const restart = () => {
    setIdx(0); setSelected(null); setScore(0); setDone(false); setAnswers([]);
  };

  if (done) {
    const finalScore = score;
    const pct = Math.round(finalScore/questions.length*100);
    return (
      <div className="fade-in space-y-5 pb-8 text-center">
        <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 border border-green-100 dark:border-green-900 shadow-sm">
          <div className="text-5xl mb-3">{pct>=80?'🏆':pct>=60?'👍':'📚'}</div>
          <h2 className="text-2xl font-bold text-green-800 dark:text-green-300">Quiz abgeschlossen!</h2>
          <div className="mt-4 text-5xl font-bold text-green-600">{finalScore}/{questions.length}</div>
          <div className="mt-2 text-gray-600 dark:text-gray-400">{pct}% richtig</div>
          <div className="mt-4 h-4 bg-green-100 dark:bg-green-900/30 rounded-full overflow-hidden">
            <div className="h-full bg-green-500 rounded-full transition-all duration-1000" style={{width:`${pct}%`}}/>
          </div>
          <div className="mt-3 text-sm text-gray-600 dark:text-gray-400">
            {pct>=80?'Ausgezeichnet! Du kennst die Sinnesorgane sehr gut.':pct>=60?'Gut gemacht! Schau dir die falschen Antworten nochmal an.':'Übe die Stationen nochmal – du schaffst das!'}
          </div>
          <button onClick={restart} className="mt-5 px-6 py-2.5 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 transition-colors">
            Quiz wiederholen
          </button>
        </div>
        <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900 shadow-sm text-left">
          <h3 className="font-bold text-green-800 dark:text-green-300 mb-3">Auswertung:</h3>
          {answers.map((a,i) => (
            <div key={i} className={`mb-2 p-2 rounded-lg text-xs ${a.ok?'bg-green-50 dark:bg-green-900/20 border border-green-200':'bg-red-50 dark:bg-red-900/20 border border-red-200'}`}>
              <div className="flex items-start gap-2">
                {a.ok ? <IconCheck c="w-4 h-4 text-green-600 flex-shrink-0 mt-0.5"/> : <IconX c="w-4 h-4 text-red-500 flex-shrink-0 mt-0.5"/>}
                <div>
                  <div className="font-medium text-gray-800 dark:text-gray-200">{questions[i].q}</div>
                  {!a.ok && <div className="text-red-600 dark:text-red-400 mt-1">Richtig: {questions[i].opts[questions[i].correct]}</div>}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="fade-in space-y-5 pb-8">
      <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900 shadow-sm">
        <div className="flex justify-between items-center mb-3">
          <span className="text-sm font-semibold text-green-700 dark:text-green-400">Frage {idx+1} von {questions.length}</span>
          <span className="text-sm text-gray-500 dark:text-gray-400">{score} Punkt{score!==1?'e':''}</span>
        </div>
        <div className="h-2 bg-green-100 dark:bg-green-900/30 rounded-full mb-4">
          <div className="h-full bg-green-500 rounded-full transition-all" style={{width:`${((idx)/questions.length)*100}%`}}/>
        </div>
        <h3 className="text-base font-bold text-gray-800 dark:text-gray-200 mb-4">{q.q}</h3>
        <div className="space-y-2">
          {q.opts.map((opt, i) => {
            let cls = 'w-full text-left p-3 rounded-xl border text-sm font-medium transition-all ';
            if (selected === null) {
              cls += 'border-gray-200 dark:border-gray-700 hover:border-green-400 hover:bg-green-50 dark:hover:bg-green-900/20 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200';
            } else if (i === q.correct) {
              cls += 'border-green-500 bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-300';
            } else if (i === selected) {
              cls += 'border-red-400 bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300';
            } else {
              cls += 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/20 text-gray-500 dark:text-gray-500 opacity-60';
            }
            return (
              <button key={i} onClick={()=>handleAnswer(i)} className={cls}>
                <span className="flex items-center gap-2">
                  <span className="w-6 h-6 rounded-full border-2 border-current flex items-center justify-center text-xs font-bold flex-shrink-0">
                    {selected!==null && i===q.correct ? <IconCheck c="w-3 h-3"/> : selected===i && i!==q.correct ? <IconX c="w-3 h-3"/> : 'ABCD'[i]}
                  </span>
                  {opt}
                </span>
              </button>
            );
          })}
        </div>
        {selected !== null && (
          <div className={`mt-3 p-3 rounded-lg text-sm fade-in ${selected===q.correct?'bg-green-50 dark:bg-green-900/20 border border-green-200 text-green-800 dark:text-green-300':'bg-red-50 dark:bg-red-900/20 border border-red-200 text-red-700 dark:text-red-300'}`}>
            <strong>{selected===q.correct?'✓ Richtig!':'✗ Leider falsch.'}</strong> {q.explain}
          </div>
        )}
        {selected !== null && (
          <button onClick={next} className="mt-4 w-full py-2.5 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 transition-colors fade-in">
            {idx+1>=questions.length ? 'Ergebnis anzeigen' : 'Nächste Frage →'}
          </button>
        )}
      </div>
    </div>
  );
};

          {visited.has(s.id) && (
            <span className="absolute top-2 right-2 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center">
              <IconCheck c="w-3 h-3 text-white"/>
            </span>
          )}
          <div className="text-3xl mb-2">{s.icon}</div>
          <div className={`font-bold text-sm ${s.accent}`}>{s.label}</div>
          <div className="text-xs text-gray-500 dark:text-gray-400 mt-1">{s.desc}</div>
        </button>
      ))}
    </div>

    <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-green-100 dark:border-green-900">
      <div className="text-sm font-semibold text-green-800 dark:text-green-300 mb-2">Fortschritt</div>
      <div className="flex gap-2">
        {stationMeta.slice(0,5).map(s => (
          <div key={s.id} className={`flex-1 h-2.5 rounded-full transition-all ${visited.has(s.id)?'bg-green-500':'bg-green-100 dark:bg-green-900/30'}`}/>
        ))}
      </div>
      <div className="text-xs text-gray-500 dark:text-gray-400 mt-1">{[...visited].filter(v=>v!=='quiz').length}/5 Stationen besucht</div>
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════════
const App = () => {
  const [activeTab, setActiveTab] = useState('overview');
  const [visited, setVisited] = useState(() => new Set(LS.get('sinnesorgane_visited', [])));
  const [quizScore, setQuizScore] = useState(() => {
    const s = LS.get('sinnesorgane_quiz_score', null);
    return s ? s.score : null;
  });

  const navigate = (id) => {
    setActiveTab(id);
    const nv = new Set(visited);
    nv.add(id);
    setVisited(nv);
    LS.set('sinnesorgane_visited', [...nv]);
  };

  const handleScoreUpdate = (s) => { setQuizScore(s); };

  const tabs = [
    { id:'overview', label:'Start', icon:'🏠' },
    { id:'auge',     label:'Auge',  icon:'👁️' },
    { id:'ohr',      label:'Ohr',   icon:'👂' },
    { id:'nasezunge',label:'Nase/Zunge', icon:'👃' },
    { id:'haut',     label:'Haut',  icon:'✋' },
    { id:'vergleich',label:'Vergleich', icon:'🧠' },
    { id:'quiz',     label:'Quiz',  icon:'🎯' },
  ];

  const renderContent = () => {
    switch(activeTab) {
      case 'overview':  return <Overview visited={visited} quizScore={quizScore} onNavigate={navigate}/>;
      case 'auge':      return <StationAuge/>;
      case 'ohr':       return <StationOhr/>;
      case 'nasezunge': return <StationNaseZunge/>;
      case 'haut':      return <StationHaut/>;
      case 'vergleich': return <StationVergleich/>;
      case 'quiz':      return <QuizStation onScoreUpdate={handleScoreUpdate}/>;
      default:          return <Overview visited={visited} quizScore={quizScore} onNavigate={navigate}/>;
    }
  };

  const current = stationMeta.find(s=>s.id===activeTab);

  return (
    <div className="min-h-screen bg-green-50 dark:bg-gray-900 flex flex-col">
      {/* Header */}
      <header className="bg-gradient-to-r from-green-800 to-green-700 text-white sticky top-0 z-50 shadow-lg">
        <div className="max-w-3xl mx-auto px-3 py-2.5 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <a href="../index.html" className="p-1.5 rounded-lg hover:bg-white/20 transition-colors" title="Zurück zur Startseite">
              <IconHome c="w-5 h-5 text-white"/>
            </a>
            <div>
              <h1 className="text-sm font-bold leading-tight">Sinnesorgane</h1>
              <p className="text-xs text-green-200">Bio 8. Klasse · Bayern</p>
            </div>
          </div>
          {/* Progress dots */}
          <div className="flex items-center gap-1.5 mr-2">
            {stationMeta.slice(0,5).map(s => (
              <div key={s.id} className={`w-2.5 h-2.5 rounded-full transition-all ${visited.has(s.id)?'bg-green-300':'bg-white/30'}`} title={s.label}/>
            ))}
          </div>
          <button onClick={()=>window.toggleDarkMode && window.toggleDarkMode()}
            data-dark-toggle aria-pressed="false" title="Dunkles Design"
            className="p-2 rounded-lg hover:bg-white/20 transition-colors">
            <span className="dark-mode-icon text-lg">🌙</span>
          </button>
        </div>
        {/* Tab Bar */}
        <div className="max-w-3xl mx-auto px-2 pb-2">
          <nav className="flex bg-black/20 rounded-xl p-1 overflow-x-auto no-scrollbar gap-0.5">
            {tabs.map(tab => (
              <button key={tab.id} onClick={()=>navigate(tab.id)}
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex-shrink-0
                  ${activeTab===tab.id?'bg-white text-green-700 shadow-md':'text-green-100 hover:bg-white/10'}`}>
                <span>{tab.icon}</span>
                <span className="hidden sm:inline">{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      </header>

      {/* Main */}
      <main className="flex-1 max-w-3xl mx-auto w-full px-3 pt-4">
        {activeTab !== 'overview' && (
          <div className="flex items-center gap-2 mb-4">
            <button onClick={()=>setActiveTab('overview')} className="text-xs text-green-600 dark:text-green-400 hover:underline flex items-center gap-1">
              ← Übersicht
            </button>
            {current && <span className="text-xs text-gray-400">/ {current.label}</span>}
          </div>
        )}
        {renderContent()}
      </main>

      <footer className="text-center py-4 text-xs text-gray-400 dark:text-gray-600">
        Sinnesorgane · Bio 8. Klasse · Gymnasium Bayern
      </footer>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
