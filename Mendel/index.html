<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Abi: Genetik Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/dark-mode.css">
    <link rel="stylesheet" href="../shared/animations.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../shared/tailwind-config.js"></script>

    <!-- React & ReactDOM (UMD for browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Styles für Punnett-Quadrate */
        .punnett-grid-mono { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border: 2px solid #166534; background-color: #166534; width: 100%; max-width: 400px; margin: 0 auto; }
        .punnett-grid-di { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; border: 2px solid #166534; background-color: #166534; width: 100%; max-width: 600px; min-width: 500px; margin: 0 auto; }

        .punnett-cell {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            font-weight: bold;
            min-height: 80px;
            text-align: center;
        }
        .punnett-header { background-color: #dcfce7; color: #166534; font-weight: 800; }
        .punnett-corner { background-color: #166534; color: white; }

        /* Phenotype Visuals */
        .pea-circle { width: 24px; height: 24px; border-radius: 50%; display: inline-block; border: 1px solid #666; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2); }
        .pea-yellow { background-color: #facc15; }
        .pea-green { background-color: #4ade80; }
        .pea-round { border-radius: 50%; }
        .pea-wrinkled { border-radius: 50%; border: 2px dashed #444; background-image: radial-gradient(circle, transparent 40%, #000 41%); background-size: 5px 5px; transform: scale(0.9); }

        .flower-red { background-color: #ef4444; }
        .flower-white { background-color: #f8fafc; border: 1px solid #ccc; }
        .flower-pink { background-color: #f9a8d4; }

        .blood-drop { color: #dc2626; font-weight: 800; font-size: 1.2rem; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }

        /* Pedigree SVG styles */
        .pedigree-shape { stroke: #1e3a1e; stroke-width: 2; }
        .pedigree-affected { fill: #166534; }
        .pedigree-unaffected { fill: #ffffff; }
        .pedigree-carrier { fill: url(#carrierPattern); }
        .pedigree-line { stroke: #1e3a1e; stroke-width: 2; fill: none; }

        /* Züchter mini punnett */
        .mini-punnett { display: grid; gap: 1px; background-color: #166534; border: 2px solid #166534; margin: 0 auto; width: fit-content; }
        .mini-cell { background: white; display: flex; align-items: center; justify-content: center; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; min-width: 48px; min-height: 40px; }
        .mini-header { background-color: #dcfce7; color: #166534; }
        .mini-corner { background-color: #166534; color: white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans selection:bg-green-200">
<nav class="sticky top-0 z-50 bg-white/90 dark:bg-green-950/90 backdrop-blur-md border-b border-green-100 dark:border-green-800 px-4 py-2 flex items-center justify-between">
  <a href="../index.html"
     class="flex items-center gap-2 text-green-800 hover:text-green-600 font-medium text-sm transition-colors group"
     aria-label="Zurück zur Startseite">
    <span class="group-hover:-translate-x-1 transition-transform inline-block">←</span>
    <span>Startseite</span>
  </a>
  <button
    data-dark-toggle
    onclick="toggleDarkMode()"
    aria-pressed="false"
    title="Dunkles Design"
    aria-label="Dark Mode umschalten">
    <span class="dark-mode-icon">🌙</span>
  </button>
</nav>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback } = React;
        const { createRoot } = ReactDOM;

        // --- 1. CONTENT DATA ---
        const definitions = [
            { term: "Phänotyp", def: "Das äußere Erscheinungsbild eines Organismus (sichtbare Merkmale)." },
            { term: "Genotyp", def: "Die genetische Zusammensetzung (Allelkombination, z.B. Aa)." },
            { term: "Homozygot", def: "Reinerbig; zwei identische Allele liegen vor (AA oder aa)." },
            { term: "Heterozygot", def: "Mischerbig; zwei unterschiedliche Allele liegen vor (Aa)." },
            { term: "Allel", def: "Zustandsform eines Gens. Diploidie Organismen haben 2 Allele pro Merkmal." },
            { term: "Dominant", def: "Allel, das sich im Phänotyp durchsetzt (Großbuchstabe)." },
            { term: "Rezessiv", def: "Allel, das im Phänotyp nur bei Homozygotie sichtbar wird (Kleinbuchstabe)." },
            { term: "Intermediär", def: "Mischform beider Allele im Phänotyp (z.B. Rot x Weiß = Rosa)." },
            { term: "Kodominanz", def: "Beide Allele setzen sich im Phänotyp nebeneinander voll durch (z.B. Blutgruppe AB)." },
            { term: "P-Generation", def: "Parentalgeneration (Eltern)." },
            { term: "F1-Generation", def: "1. Filialgeneration (Kinder). Bei reinerbigen Eltern uniform." },
            { term: "F2-Generation", def: "2. Filialgeneration (Enkel). Spaltet sich in bestimmten Verhältnissen auf." }
        ];

        const quizQuestions = [
            {
                id: 1,
                question: "Fallbeispiel Dackel: Zwei kurzbeinige Dackel (Mischlinge) bekommen Welpen. 8 sind kurzbeinig, 3 haben normale Beine. Welcher Erbgang liegt vor?",
                options: ["Intermediär", "Dominant-Rezessiv (Kurz dominiert)", "Dominant-Rezessiv (Lang dominiert)", "Kodominant"],
                correct: 1,
                explanation: "Da beide Eltern den gleichen Phänotyp haben, aber ein Kind einen anderen, müssen die Eltern heterozygot (Aa) sein. Das Merkmal der Eltern (Kurz) ist dominant."
            },
            {
                id: 2,
                question: "Blutgruppen: Mutter (B, homozygot) und Vater (A, heterozygot). Welche Blutgruppen können die Kinder haben?",
                options: ["Nur AB", "AB und B", "A, B und AB", "AB und 0"],
                correct: 1,
                explanation: "Mutter: BB, Vater: A0. Gameten Mutter: B. Gameten Vater: A, 0. Kombinationen: AB und B0. Phänotypen: AB und B."
            },
            {
                id: 3,
                question: "Mendel 3 (Unabhängigkeit): Wie viele Genotyp-Kombinationen entstehen theoretisch in der F2 bei einem dihybriden Erbgang (AaBb x AaBb)?",
                options: ["4", "9", "16", "3:1"],
                correct: 2,
                explanation: "Es entsteht ein 4x4 Kombinationsquadrat = 16 Felder. Das phänotypische Verhältnis ist 9:3:3:1."
            },
            {
                id: 4,
                question: "Wunderblume (Intermediär): Was passiert, wenn man Rosa (rw) mit Weiß (ww) kreuzt?",
                options: ["100% Rosa", "50% Rosa, 50% Weiß", "25% Rot, 50% Rosa, 25% Weiß", "100% Weiß"],
                correct: 1,
                explanation: "Gameten Rosa: r, w. Gameten Weiß: w. Kombinationen: rw (Rosa) und ww (Weiß) im Verhältnis 1:1."
            },
            {
                id: 5,
                question: "Rhesusfaktor: Kann ein Kind rhesus-positiv sein, wenn beide Eltern rhesus-negativ sind (dd)?",
                options: ["Ja, wenn es mutiert", "Ja, rezessiv", "Nein, niemals", "Ja, kodominant"],
                correct: 2,
                explanation: "Rhesus-negativ ist rezessiv (dd). Eltern geben nur 'd' weiter. Das Kind ist zwangsläufig dd (negativ)."
            }
        ];

        // --- 2. LOGIC HELPERS ---

        const getGametesMono = (genotype) => genotype.split('');

        const getGametesDi = (genotype) => {
            const trait1 = [genotype[0], genotype[1]];
            const trait2 = [genotype[2], genotype[3]];
            const gametes = [];
            trait1.forEach(t1 => {
                trait2.forEach(t2 => {
                    gametes.push(t1 + t2);
                });
            });
            return gametes;
        };

        const getPhenotype = (genotype, mode) => {
            if (mode === 'mono') {
                const hasDom = genotype.includes('A');
                return {
                    text: hasDom ? 'Gelb' : 'Grün',
                    colorClass: hasDom ? 'pea-yellow' : 'pea-green'
                };
            }
            if (mode === 'inter') {
                const rCount = (genotype.match(/R/g) || []).length;
                if (rCount === 2) return { text: 'Rot', colorClass: 'flower-red' };
                if (rCount === 1) return { text: 'Rosa', colorClass: 'flower-pink' };
                return { text: 'Weiß', colorClass: 'flower-white' };
            }
            if (mode === 'di') {
                const hasA = genotype.includes('A');
                const hasB = genotype.includes('B');
                const color = hasA ? 'Gelb' : 'Grün';
                const shape = hasB ? 'Glatt' : 'Runzlig';
                const cssColor = hasA ? 'pea-yellow' : 'pea-green';
                const cssShape = hasB ? 'pea-round' : 'pea-wrinkled';
                return { text: `${color}, ${shape}`, colorClass: `${cssColor} ${cssShape}` };
            }
            if (mode === 'blood') {
                const hasA = genotype.includes('A');
                const hasB = genotype.includes('B');
                if (hasA && hasB) return { text: 'AB', colorClass: 'blood-drop' };
                if (hasA) return { text: 'A', colorClass: 'blood-drop' };
                if (hasB) return { text: 'B', colorClass: 'blood-drop' };
                return { text: '0', colorClass: 'blood-drop' };
            }
            return { text: '?', colorClass: '' };
        };

        // Compute stats from grid
        const computeStats = (grid) => {
            const stats = {};
            let total = 0;
            grid.forEach(row => row.forEach(cell => {
                const key = cell.phenotype.text;
                stats[key] = (stats[key] || 0) + 1;
                total++;
            }));
            return { stats, total };
        };

        // --- 3. PIE CHART COMPONENT ---

        const phenotypeColors = {
            'Gelb': '#facc15',
            'Grün': '#4ade80',
            'Rot': '#ef4444',
            'Rosa': '#f9a8d4',
            'Weiß': '#f1f5f9',
            'Gelb, Glatt': '#facc15',
            'Gelb, Runzlig': '#fde68a',
            'Grün, Glatt': '#4ade80',
            'Grün, Runzlig': '#86efac',
            'A': '#3b82f6',
            'B': '#f97316',
            'AB': '#a855f7',
            '0': '#94a3b8',
        };

        const strokeColors = {
            'Weiß': '#cbd5e1',
        };

        const PieChart = ({ stats, total }) => {
            const size = 220;
            const cx = size / 2;
            const cy = size / 2;
            const r = 80;
            const innerR = 38;

            const entries = Object.entries(stats);
            if (entries.length === 0) return null;

            let cumulativeAngle = -Math.PI / 2;

            const slices = entries.map(([name, count]) => {
                const fraction = count / total;
                const angle = fraction * 2 * Math.PI;
                const startAngle = cumulativeAngle;
                const endAngle = cumulativeAngle + angle;
                cumulativeAngle = endAngle;

                const x1 = cx + r * Math.cos(startAngle);
                const y1 = cy + r * Math.sin(startAngle);
                const x2 = cx + r * Math.cos(endAngle);
                const y2 = cy + r * Math.sin(endAngle);
                const ix1 = cx + innerR * Math.cos(endAngle);
                const iy1 = cy + innerR * Math.sin(endAngle);
                const ix2 = cx + innerR * Math.cos(startAngle);
                const iy2 = cy + innerR * Math.sin(startAngle);

                const largeArc = angle > Math.PI ? 1 : 0;

                const midAngle = startAngle + angle / 2;
                const labelR = r + 22;
                const lx = cx + labelR * Math.cos(midAngle);
                const ly = cy + labelR * Math.sin(midAngle);

                const color = phenotypeColors[name] || '#a3a3a3';
                const stroke = strokeColors[name] || color;

                return { name, count, fraction, startAngle, endAngle, x1, y1, x2, y2, ix1, iy1, ix2, iy2, largeArc, lx, ly, color, stroke, midAngle };
            });

            return (
                <div className="flex flex-col items-center">
                    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                        <defs>
                            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                                <feDropShadow dx="0" dy="1" stdDeviation="2" floodOpacity="0.15"/>
                            </filter>
                        </defs>
                        {slices.map((s, i) => {
                            const path = entries.length === 1
                                ? `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`
                                : `M ${s.x1} ${s.y1} A ${r} ${r} 0 ${s.largeArc} 1 ${s.x2} ${s.y2} L ${s.ix1} ${s.iy1} A ${innerR} ${innerR} 0 ${s.largeArc} 0 ${s.ix2} ${s.iy2} Z`;
                            return (
                                <path
                                    key={i}
                                    d={path}
                                    fill={s.color}
                                    stroke={s.stroke}
                                    strokeWidth="2"
                                    filter="url(#shadow)"
                                />
                            );
                        })}
                        {slices.map((s, i) => {
                            const pct = (s.fraction * 100).toFixed(0);
                            if (s.fraction < 0.07) return null;
                            return (
                                <text
                                    key={i}
                                    x={s.lx}
                                    y={s.ly}
                                    textAnchor="middle"
                                    dominantBaseline="middle"
                                    fontSize="9"
                                    fontWeight="700"
                                    fill="#1e3a1e"
                                >
                                    {pct}%
                                </text>
                            );
                        })}
                        <circle cx={cx} cy={cy} r={innerR - 2} fill="white"/>
                        <text x={cx} y={cy - 6} textAnchor="middle" fontSize="9" fill="#666" fontWeight="600">Phänotypen</text>
                        <text x={cx} y={cy + 8} textAnchor="middle" fontSize="8" fill="#999">{total} gesamt</text>
                    </svg>
                    <div className="flex flex-wrap justify-center gap-2 mt-1 max-w-xs">
                        {slices.map((s, i) => (
                            <div key={i} className="flex items-center gap-1 text-xs">
                                <div style={{width:10, height:10, borderRadius:'50%', backgroundColor: s.color, border:`1px solid ${s.stroke}`, flexShrink:0}}></div>
                                <span className="text-gray-600">{s.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- 4. DIHYBRID EXPLANATION PANEL ---

        const DihybridExplanation = ({ visible, onToggle }) => {
            const gametes = ['AB', 'Ab', 'aB', 'ab'];
            const cells = [];
            gametes.forEach(g1 => {
                gametes.forEach(g2 => {
                    const raw = g1 + g2;
                    const as = (raw.match(/[Aa]/g)||[]).sort().join('');
                    const bs = (raw.match(/[Bb]/g)||[]).sort().join('');
                    const genotype = as + bs;
                    const hasA = genotype.includes('A');
                    const hasB = genotype.includes('B');
                    const cat = hasA && hasB ? '9' : hasA ? '3a' : hasB ? '3b' : '1';
                    cells.push({ genotype, cat });
                });
            });

            const catColors = {
                '9':  { bg: '#fef08a', label: 'Gelb+Glatt (A_B_)', desc: '9' },
                '3a': { bg: '#facc15', label: 'Gelb+Runzlig (A_bb)', desc: '3' },
                '3b': { bg: '#4ade80', label: 'Grün+Glatt (aaB_)', desc: '3' },
                '1':  { bg: '#86efac', label: 'Grün+Runzlig (aabb)', desc: '1' },
            };

            return (
                <div className="border border-green-200 rounded-lg overflow-hidden mt-4">
                    <button
                        onClick={onToggle}
                        className="w-full flex justify-between items-center px-4 py-3 bg-green-50 hover:bg-green-100 transition-colors text-left"
                    >
                        <span className="font-bold text-green-900 text-sm">Warum 9:3:3:1? – Visuelle Erklarung</span>
                        <span className="text-green-700 font-bold text-lg">{visible ? '▲' : '▼'}</span>
                    </button>
                    {visible && (
                        <div className="p-4 bg-white animate-fade-in">
                            <p className="text-sm text-gray-600 mb-3">Bei <strong>AaBb × AaBb</strong> entstehen 4 verschiedene Gametentypen pro Elternteil. Das ergibt ein 4×4 Quadrat mit 16 Feldern:</p>
                            <div className="overflow-x-auto">
                                <div style={{display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:2, backgroundColor:'#166534', border:'2px solid #166534', maxWidth:360, margin:'0 auto'}}>
                                    <div style={{background:'#166534', color:'white', padding:'4px 6px', fontSize:'0.7rem', fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center'}}>×</div>
                                    {gametes.map(g => (
                                        <div key={g} style={{background:'#dcfce7', color:'#166534', padding:'4px 6px', fontSize:'0.7rem', fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center'}}>{g}</div>
                                    ))}
                                    {gametes.map((g1, ri) => (
                                        <React.Fragment key={g1}>
                                            <div style={{background:'#dcfce7', color:'#166534', padding:'4px 6px', fontSize:'0.7rem', fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center'}}>{g1}</div>
                                            {cells.slice(ri*4, ri*4+4).map((cell, ci) => (
                                                <div key={ci} style={{background: catColors[cell.cat].bg, padding:'3px 4px', fontSize:'0.6rem', fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', minHeight:36, textAlign:'center', lineHeight:1.2}}>
                                                    {cell.genotype}
                                                </div>
                                            ))}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-4">
                                {Object.entries(catColors).map(([cat, info]) => {
                                    const count = cells.filter(c => c.cat === cat).length;
                                    return (
                                        <div key={cat} className="rounded p-2 text-center text-xs border" style={{backgroundColor: info.bg}}>
                                            <div className="font-bold text-lg text-gray-800">{count}</div>
                                            <div className="text-gray-700 leading-tight">{info.label}</div>
                                        </div>
                                    );
                                })}
                            </div>
                            <p className="text-xs text-gray-500 mt-3 text-center">
                                Phänotypverhältnis: <strong>9 : 3 : 3 : 1</strong> — weil jedes Merkmal unabhängig voneinander nach Mendel III vererbt wird.
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        // --- 5. SIMULATOR ---

        const Simulator = () => {
            const [mode, setMode] = useState('mono');
            const [p1, setP1] = useState('Aa');
            const [p2, setP2] = useState('Aa');
            const [p1Di, setP1Di] = useState('AaBb');
            const [p2Di, setP2Di] = useState('AaBb');
            const [p1Blood, setP1Blood] = useState('A0');
            const [p2Blood, setP2Blood] = useState('B0');
            const [showDiExplain, setShowDiExplain] = useState(false);

            const resultData = useMemo(() => {
                let gametes1 = [], gametes2 = [];
                if (mode === 'mono' || mode === 'inter') {
                    gametes1 = getGametesMono(p1);
                    gametes2 = getGametesMono(p2);
                } else if (mode === 'di') {
                    gametes1 = getGametesDi(p1Di);
                    gametes2 = getGametesDi(p2Di);
                } else if (mode === 'blood') {
                    gametes1 = getGametesMono(p1Blood);
                    gametes2 = getGametesMono(p2Blood);
                }

                const grid = [];
                gametes1.forEach(g1 => {
                    const row = [];
                    gametes2.forEach(g2 => {
                        let rawGenotype = g1 + g2;
                        let genotype = rawGenotype;
                        if (mode === 'di') {
                            const as = (rawGenotype.match(/[Aa]/g)||[]).sort().join('');
                            const bs = (rawGenotype.match(/[Bb]/g)||[]).sort().join('');
                            genotype = as + bs;
                        } else {
                            genotype = rawGenotype.split('').sort().join('');
                        }
                        const phenotype = getPhenotype(genotype, mode);
                        row.push({ genotype, phenotype });
                    });
                    grid.push(row);
                });

                const { stats, total } = computeStats(grid);
                return { gametes1, gametes2, grid, stats, total };
            }, [mode, p1, p2, p1Di, p2Di, p1Blood, p2Blood]);

            return (
                <div className="bg-white p-6 rounded-xl shadow-lg border border-green-100 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h2 className="text-xl font-bold text-green-900 flex items-center gap-2">
                            Kreuzungs-Simulator
                        </h2>
                        <div className="flex bg-gray-100 p-1 rounded-lg overflow-x-auto max-w-full">
                            {[
                                {id: 'mono', label: 'Monohybrid'},
                                {id: 'inter', label: 'Intermediär'},
                                {id: 'di', label: 'Dihybrid'},
                                {id: 'blood', label: 'Blut'}
                            ].map(m => (
                                <button
                                    key={m.id}
                                    onClick={() => setMode(m.id)}
                                    className={`px-3 py-1 text-sm rounded-md transition-all whitespace-nowrap ${mode===m.id ? 'bg-white shadow text-green-700 font-bold' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    {m.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Controls */}
                    <div className="bg-green-50 p-4 rounded-lg mb-6 flex flex-wrap justify-center gap-8 items-center border border-green-100">
                        <div className="text-center">
                            <label className="block text-xs font-bold text-green-800 mb-1">ELTERNTEIL 1</label>
                            {mode === 'mono' && (
                                <select value={p1} onChange={e=>setP1(e.target.value)} className="p-2 rounded border border-green-300 bg-white">
                                    <option value="AA">AA (Homozygot Dom)</option>
                                    <option value="Aa">Aa (Heterozygot)</option>
                                    <option value="aa">aa (Homozygot Rez)</option>
                                </select>
                            )}
                            {mode === 'inter' && (
                                <select value={p1} onChange={e=>setP1(e.target.value)} className="p-2 rounded border border-green-300 bg-white">
                                    <option value="RR">RR (Rot)</option>
                                    <option value="Rr">Rr (Rosa)</option>
                                    <option value="rr">rr (Weiß)</option>
                                </select>
                            )}
                            {mode === 'di' && (
                                <select value={p1Di} onChange={e=>setP1Di(e.target.value)} className="p-2 rounded border border-green-300 bg-white">
                                    <option value="AABB">AABB (Gelb/Glatt)</option>
                                    <option value="AaBb">AaBb (Mischerbig)</option>
                                    <option value="aabb">aabb (Grün/Runzlig)</option>
                                    <option value="Aabb">Aabb (Gelb/Runzlig)</option>
                                    <option value="aaBB">aaBB (Grün/Glatt)</option>
                                </select>
                            )}
                            {mode === 'blood' && (
                                <select value={p1Blood} onChange={e=>setP1Blood(e.target.value)} className="p-2 rounded border border-green-300 bg-white">
                                    <option value="AA">AA (Typ A)</option>

        // --- 6. TRAINER ---

            const next = () => {

                        } else {

                        const phenotype = getPhenotype(genotype, challenge.mode);
                        row.push({ genotype, phenotype });

                    grid.push(row);

                const { stats, total } = computeStats(grid);

                            <div className="flex items-center gap-3">
                                <span className="text-sm text-gray-500">
                                    Gelöst: <strong className="text-green-700">{solvedIds.size}</strong> / {zuchterChallenges.length}
                                </span>
                                <div className="flex gap-1">
                                    {zuchterChallenges.map((c, i) => (
                                        <button
                                            key={c.id}
                                            onClick={() => setCurrentIdx(i)}
                                            className={`w-8 h-8 rounded-full text-xs font-bold transition-all border-2 ${
                                                solvedIds.has(c.id)
                                                    ? 'bg-green-500 text-white border-green-500'
                                                    : currentIdx === i
                                                        ? 'bg-white text-green-700 border-green-500'
                                                        : 'bg-gray-100 text-gray-500 border-gray-200 hover:border-green-300'
                                            }`}
                                        >
                                            {i + 1}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Progress bar */}
                        <div className="w-full bg-gray-200 rounded-full h-2 mb-1">
                            <div
                                className="bg-green-500 h-2 rounded-full transition-all duration-500"
                                style={{width: `${(solvedIds.size / zuchterChallenges.length) * 100}%`}}
                            />
                        </div>
                        <p className="text-xs text-gray-400 text-right">{Math.round((solvedIds.size / zuchterChallenges.length) * 100)}% abgeschlossen</p>
                    </div>

                    <ZuchterChallenge
                        key={challenge.id}
                        challenge={challenge}
                        onSolve={handleSolve}
                        isSolved={solvedIds.has(challenge.id)}
                    />

                    <div className="flex justify-between mt-4">
                        <button
                            onClick={() => setCurrentIdx(i => Math.max(0, i - 1))}
                            disabled={currentIdx === 0}
                            className="px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium text-gray-600 hover:bg-gray-50 disabled:opacity-40"
                        >
                            Zurück
                        </button>
                        <button
                            onClick={() => setCurrentIdx(i => Math.min(zuchterChallenges.length - 1, i + 1))}
                            disabled={currentIdx === zuchterChallenges.length - 1}
                            className="px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-bold hover:bg-green-700 shadow disabled:opacity-40"
                        >
                            Nächste Aufgabe
                        </button>
                    </div>

                    {solvedIds.size === zuchterChallenges.length && (
                        <div className="mt-6 bg-green-50 border-2 border-green-400 rounded-xl p-6 text-center animate-fade-in">
                            <div className="text-4xl mb-2">🏆</div>
                            <h3 className="text-xl font-bold text-green-800">Alle Aufgaben gelöst!</h3>
                            <p className="text-green-600 mt-1">Du bist ein echter Genetik-Züchter-Experte!</p>
                        </div>
                    )}
                </div>
            );
        };

        // --- 8. STAMMBAUM-ANALYSE ---

        // Pedigree 1: Autosomal dominant
        // Generation I: affected father (square filled) x unaffected mother (circle empty)
        // Generation II: 2 affected, 2 unaffected children
        // Generation III: from affected child 1: 1 affected, 1 unaffected; from affected child 2: 1 affected

        const PedigreeAutosomalDominant = () => {
            const W = 340, H = 220;
            // Gen I: positions
            const gen1y = 40;
            const gen2y = 120;
            const gen3y = 200;
            const r = 16;

            // Gen I
            const fa = { x: 100, y: gen1y, sex: 'M', affected: true };
            const mo = { x: 200, y: gen1y, sex: 'F', affected: false };

            // Gen II children (4)
            const c1 = { x: 50,  y: gen2y, sex: 'F', affected: true };
            const c2 = { x: 120, y: gen2y, sex: 'M', affected: true };
            const c3 = { x: 190, y: gen2y, sex: 'F', affected: false };
            const c4 = { x: 260, y: gen2y, sex: 'M', affected: false };

            // Gen III (from c1 and c2)
            const g1 = { x: 50,  y: gen3y, sex: 'M', affected: true };
            const g2 = { x: 120, y: gen3y, sex: 'F', affected: false };
            const g3 = { x: 190, y: gen3y, sex: 'M', affected: true };

            const Shape = ({node}) => {
                const fill = node.affected ? '#166534' : 'white';
                const stroke = '#1e3a1e';
                if (node.sex === 'M') {
                    return <rect x={node.x - r} y={node.y - r} width={r*2} height={r*2} fill={fill} stroke={stroke} strokeWidth={2}/>;
                }
                return <circle cx={node.x} cy={node.y} r={r} fill={fill} stroke={stroke} strokeWidth={2}/>;
            };

            return (
                <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="mx-auto block">
                    {/* Gen I couple line */}
                    <line x1={fa.x + r} y1={fa.y} x2={mo.x - r} y2={mo.y} stroke="#1e3a1e" strokeWidth={2}/>
                    {/* Drop to Gen II */}
                    <line x1={150} y1={gen1y} x2={150} y2={gen1y + 20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={50} y1={gen1y+20} x2={260} y2={gen1y+20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={50} y1={gen1y+20} x2={50} y2={gen2y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={120} y1={gen1y+20} x2={120} y2={gen2y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={190} y1={gen1y+20} x2={190} y2={gen2y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={260} y1={gen1y+20} x2={260} y2={gen2y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    {/* Gen II to Gen III for c1 */}
                    <line x1={50} y1={gen2y + r} x2={50} y2={gen2y + r + 20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={50} y1={gen2y+r+20} x2={50} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    {/* Gen II to Gen III for c2 */}
                    <line x1={120} y1={gen2y + r} x2={120} y2={gen2y+r+20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={120} y1={gen2y+r+20} x2={190} y2={gen2y+r+20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={155} y1={gen2y+r+20} x2={155} y2={gen3y-r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={190} y1={gen2y+r+20} x2={190} y2={gen3y-r} stroke="#1e3a1e" strokeWidth={2}/>

                    <Shape node={fa}/><Shape node={mo}/>
                    <Shape node={c1}/><Shape node={c2}/><Shape node={c3}/><Shape node={c4}/>
                    <Shape node={g1}/><Shape node={g2}/><Shape node={g3}/>

                    {/* Labels */}
                    <text x={W/2} y={gen1y} textAnchor="middle" fontSize={9} fill="#888" dominantBaseline="middle" x={10} textAnchor="start">I</text>
                    <text x={10} y={gen2y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">II</text>
                    <text x={10} y={gen3y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">III</text>
                </svg>
            );
        };

        const PedigreeAutosomalRezessiv = () => {
            const W = 340, H = 220;
            const gen1y = 40, gen2y = 120, gen3y = 200;
            const r = 16;

            // Gen I: both carriers (unaffected)
            // Gen II: 2 affected (show carriers too for realism)
            // Gen III: from affected parents: unaffected children

            // Simple version: Gen I unaffected carriers; Gen II: 1 affected, 3 unaffected; Gen III from unaffected couple: 1 affected
            const fa1 = { x: 100, y: gen1y, sex: 'M', affected: false, carrier: true };
            const mo1 = { x: 200, y: gen1y, sex: 'F', affected: false, carrier: true };

            const c1 = { x: 50,  y: gen2y, sex: 'M', affected: true };
            const c2 = { x: 120, y: gen2y, sex: 'F', affected: false, carrier: true };
            const c3 = { x: 190, y: gen2y, sex: 'M', affected: false };
            const c4 = { x: 260, y: gen2y, sex: 'F', affected: false };

            // c3 marries unrelated carrier female
            const sp = { x: 240, y: gen3y - 50, sex: 'F', affected: false, carrier: true };
            const g1 = { x: 190, y: gen3y, sex: 'M', affected: false };
            const g2 = { x: 260, y: gen3y, sex: 'F', affected: true };

            const Shape = ({node}) => {
                const fill = node.affected ? '#166534' : 'white';
                const stroke = '#1e3a1e';
                if (node.sex === 'M') {
                    return (
                        <g>
                            <rect x={node.x - r} y={node.y - r} width={r*2} height={r*2} fill={fill} stroke={stroke} strokeWidth={2}/>
                            {node.carrier && <line x1={node.x} y1={node.y - r} x2={node.x} y2={node.y + r} stroke={stroke} strokeWidth={1.5}/>}
                        </g>
                    );
                }
                return (
                    <g>
                        <circle cx={node.x} cy={node.y} r={r} fill={fill} stroke={stroke} strokeWidth={2}/>
                        {node.carrier && <circle cx={node.x} cy={node.y} r={r * 0.5} fill={stroke} opacity={0.5}/>}
                    </g>
                );
            };

            return (
                <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="mx-auto block">
                    {/* Gen I */}
                    <line x1={fa1.x + r} y1={gen1y} x2={mo1.x - r} y2={gen1y} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={150} y1={gen1y} x2={150} y2={gen1y + 20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={50} y1={gen1y+20} x2={260} y2={gen1y+20} stroke="#1e3a1e" strokeWidth={2}/>
                    {[50,120,190,260].map(x => (
                        <line key={x} x1={x} y1={gen1y+20} x2={x} y2={gen2y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    ))}

                    {/* Gen III from c3 */}
                    <line x1={c3.x + r} y1={c3.y} x2={sp.x - r} y2={sp.y} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={(c3.x + sp.x)/2} y1={(c3.y + sp.y)/2} x2={225} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={190} y1={gen3y - r} x2={260} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2} style={{display:'none'}}/>
                    <line x1={225} y1={gen3y - r} x2={225} y2={gen3y - r + 5} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={190} y1={gen3y - r + 5} x2={260} y2={gen3y - r + 5} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={190} y1={gen3y - r + 5} x2={190} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={260} y1={gen3y - r + 5} x2={260} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2}/>

                    <Shape node={fa1}/><Shape node={mo1}/>
                    <Shape node={c1}/><Shape node={c2}/><Shape node={c3}/><Shape node={c4}/>
                    <Shape node={sp}/><Shape node={g1}/><Shape node={g2}/>

                    <text x={10} y={gen1y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">I</text>
                    <text x={10} y={gen2y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">II</text>
                    <text x={10} y={gen3y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">III</text>
                </svg>
            );
        };

        const PedigreeXChromosomal = () => {
            const W = 340, H = 220;
            const gen1y = 40, gen2y = 120, gen3y = 200;
            const r = 16;

            // Gen I: unaffected carrier mother, unaffected father
            // Gen II: affected son, unaffected daughter (carrier), unaffected son, unaffected daughter
            // Gen III: from carrier daughter: affected grandson, unaffected granddaughter

            const fa1 = { x: 100, y: gen1y, sex: 'M', affected: false };
            const mo1 = { x: 200, y: gen1y, sex: 'F', affected: false, carrier: true };

            const c1 = { x: 50,  y: gen2y, sex: 'M', affected: true };
            const c2 = { x: 130, y: gen2y, sex: 'F', affected: false, carrier: true };
            const c3 = { x: 210, y: gen2y, sex: 'M', affected: false };
            const c4 = { x: 280, y: gen2y, sex: 'F', affected: false };

            const g1 = { x: 110, y: gen3y, sex: 'M', affected: true };
            const g2 = { x: 180, y: gen3y, sex: 'F', affected: false };

            const Shape = ({node}) => {
                const fill = node.affected ? '#166534' : 'white';
                const stroke = '#1e3a1e';
                if (node.sex === 'M') {
                    return <rect x={node.x - r} y={node.y - r} width={r*2} height={r*2} fill={fill} stroke={stroke} strokeWidth={2}/>;
                }
                return (
                    <g>
                        <circle cx={node.x} cy={node.y} r={r} fill={fill} stroke={stroke} strokeWidth={2}/>
                        {node.carrier && <circle cx={node.x} cy={node.y} r={r * 0.45} fill={stroke} opacity={0.45}/>}
                    </g>
                );
            };

            return (
                <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="mx-auto block">
                    <line x1={fa1.x + r} y1={gen1y} x2={mo1.x - r} y2={gen1y} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={150} y1={gen1y} x2={150} y2={gen1y+20} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={50} y1={gen1y+20} x2={280} y2={gen1y+20} stroke="#1e3a1e" strokeWidth={2}/>
                    {[50,130,210,280].map(x => (
                        <line key={x} x1={x} y1={gen1y+20} x2={x} y2={gen2y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    ))}

                    {/* Gen III from c2 */}
                    <line x1={c2.x} y1={c2.y + r} x2={c2.x} y2={c2.y + r + 15} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={g1.x} y1={c2.y+r+15} x2={g2.x} y2={c2.y+r+15} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={g1.x} y1={c2.y+r+15} x2={g1.x} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2}/>
                    <line x1={g2.x} y1={c2.y+r+15} x2={g2.x} y2={gen3y - r} stroke="#1e3a1e" strokeWidth={2}/>

                    <Shape node={fa1}/><Shape node={mo1}/>
                    <Shape node={c1}/><Shape node={c2}/><Shape node={c3}/><Shape node={c4}/>
                    <Shape node={g1}/><Shape node={g2}/>

                    <text x={10} y={gen1y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">I</text>
                    <text x={10} y={gen2y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">II</text>
                    <text x={10} y={gen3y} textAnchor="start" fontSize={9} fill="#888" dominantBaseline="middle">III</text>
                </svg>
            );
        };

        const stammbaumCases = [
            {
                id: 1,
                title: 'Stammbaum 1',
                description: 'Ein betroffener Vater hat teils betroffene Kinder. Die Erkrankung erscheint in jeder Generation.',
                PedigreeComponent: PedigreeAutosomalDominant,
                options: ['autosomal dominant', 'autosomal rezessiv', 'X-chromosomal rezessiv'],
                correct: 0,
                explanation: 'Autosomal dominant: Mindestens ein Elternteil ist immer betroffen. Das Merkmal springt nicht über eine Generation. Söhne und Töchter sind gleich häufig betroffen. 50% der Kinder eines betroffenen heterozygoten Elternteils erkranken.'
            },
            {
                id: 2,
                title: 'Stammbaum 2',
                description: 'Gesunde Eltern (aber Träger) haben ein betroffenes Kind. In Generation I ist niemand betroffen – das Merkmal "überspringt" eine Generation.',
                PedigreeComponent: PedigreeAutosomalRezessiv,
                options: ['autosomal dominant', 'autosomal rezessiv', 'X-chromosomal rezessiv'],
                correct: 1,
                explanation: 'Autosomal rezessiv: Beide Eltern sind gesunde Träger (Aa × Aa). Das Merkmal taucht scheinbar aus dem Nichts auf und überspringt Generationen. Söhne und Töchter sind gleich häufig betroffen (kein Geschlechtsunterschied).'
            },
            {
                id: 3,
                title: 'Stammbaum 3',
                description: 'Nur Söhne sind betroffen. Die Mütter sind gesund, geben das Merkmal aber weiter (Konduktorinnen).',
                PedigreeComponent: PedigreeXChromosomal,
                options: ['autosomal dominant', 'autosomal rezessiv', 'X-chromosomal rezessiv'],
                correct: 2,
                explanation: 'X-chromosomal rezessiv: Ausschließlich Söhne sind betroffen, Töchter können Überträgerinnen (Konduktorinnen) sein. Die Mütter der betroffenen Söhne sind selbst nicht erkrankt. Väter geben ihr X-Chromosom nur an Töchter weiter.'
            },
        ];

        const Stammbaum = () => {
            const [answers, setAnswers] = useState({});
            const [feedback, setFeedback] = useState({});

            const handleAnswer = (caseId, optionIdx) => {
                if (feedback[caseId] !== undefined) return;
                setAnswers(a => ({...a, [caseId]: optionIdx}));
            };

            const checkAnswer = (caseId) => {
                const c = stammbaumCases.find(s => s.id === caseId);
                const isCorrect = answers[caseId] === c.correct;
                setFeedback(f => ({...f, [caseId]: isCorrect ? 'correct' : 'wrong'}));
            };

            const solvedCount = Object.values(feedback).filter(v => v === 'correct').length;

            return (
                <div className="animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-lg border border-green-100 mb-6 flex items-center justify-between">
                        <h2 className="text-xl font-bold text-green-900">Stammbaum-Analyse</h2>
                        <div className="flex items-center gap-2">
                            <span className="text-sm text-gray-500">Richtig:</span>
                            <span className="font-bold text-green-700 text-lg">{solvedCount} / {stammbaumCases.length}</span>
                        </div>
                    </div>

                    {/* Legend */}
                    <div className="bg-green-50 border border-green-200 rounded-xl p-3 mb-6 flex flex-wrap gap-4 justify-center">
                        {[
                            { shape: 'square', filled: false, label: 'Mann (nicht betroffen)' },
                            { shape: 'square', filled: true, label: 'Mann (betroffen)' },
                            { shape: 'circle', filled: false, label: 'Frau (nicht betroffen)' },
                            { shape: 'circle', filled: true, label: 'Frau (betroffen)' },
                            { shape: 'circle', carrier: true, label: 'Frau (Trägerin)' },
                        ].map((item, i) => (
                            <div key={i} className="flex items-center gap-2 text-xs text-gray-700">
                                <svg width={20} height={20}>
                                    {item.shape === 'square'
                                        ? <rect x={2} y={2} width={16} height={16} fill={item.filled ? '#166534' : 'white'} stroke="#1e3a1e" strokeWidth={2}/>
                                        : <>
                                            <circle cx={10} cy={10} r={8} fill={item.filled ? '#166534' : 'white'} stroke="#1e3a1e" strokeWidth={2}/>
                                            {item.carrier && <circle cx={10} cy={10} r={4} fill="#1e3a1e" opacity={0.45}/>}
                                        </>
                                    }
                                </svg>
                                <span>{item.label}</span>
                            </div>
                        ))}
                    </div>

                    <div className="space-y-8">
                        {stammbaumCases.map((sc) => {
                            const Pedigree = sc.PedigreeComponent;
                            const userAnswer = answers[sc.id];
                            const fb = feedback[sc.id];
                            return (
                                <div key={sc.id} className={`bg-white rounded-xl border-2 p-5 shadow-sm transition-all ${fb === 'correct' ? 'border-green-400' : fb === 'wrong' ? 'border-red-300' : 'border-gray-200'}`}>
                                    <h3 className="font-bold text-green-900 mb-1">{sc.title}</h3>
                                    <p className="text-sm text-gray-600 mb-4">{sc.description}</p>

                                    <div className="bg-gray-50 rounded-lg p-3 mb-4 border">
                                        <Pedigree />
                                    </div>

                                    <p className="font-semibold text-sm text-gray-700 mb-2">Welcher Erbgang liegt vor?</p>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                                        {sc.options.map((opt, idx) => {
                                            let style = "p-3 rounded-lg border-2 text-sm font-medium transition-all text-left cursor-pointer ";
                                            if (fb !== undefined) {
                                                if (idx === sc.correct) style += "bg-green-50 border-green-500 text-green-800";
                                                else if (idx === userAnswer && fb === 'wrong') style += "bg-red-50 border-red-400 text-red-800";
                                                else style += "bg-gray-50 border-gray-100 text-gray-400 opacity-50 cursor-default";
                                            } else {
                                                style += userAnswer === idx
                                                    ? "bg-green-50 border-green-400 text-green-800"
                                                    : "bg-white border-gray-200 hover:border-green-300 hover:bg-green-50 text-gray-700";
                                            }
                                            return (
                                                <button
                                                    key={idx}
                                                    className={style}
                                                    onClick={() => handleAnswer(sc.id, idx)}
                                                    disabled={fb !== undefined}
                                                >
                                                    {opt}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <button
                                        onClick={() => checkAnswer(sc.id)}
                                        disabled={userAnswer === undefined || fb !== undefined}
                                        className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                                            userAnswer === undefined || fb !== undefined
                                                ? 'bg-gray-100 text-gray-400 cursor-default'
                                                : 'bg-green-600 text-white hover:bg-green-700 shadow-md'
                                        }`}
                                    >
                                        Überprüfen
                                    </button>

                                    {fb !== undefined && (
                                        <div className={`mt-3 p-3 rounded-lg border animate-fade-in ${fb === 'correct' ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-200'}`}>
                                            <p className={`font-bold text-sm mb-1 ${fb === 'correct' ? 'text-green-800' : 'text-red-800'}`}>
                                                {fb === 'correct' ? 'Richtig!' : `Nicht ganz – Richtig wäre: ${sc.options[sc.correct]}`}
                                            </p>
                                            <p className="text-xs text-gray-700 leading-relaxed">{sc.explanation}</p>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- 9. GLOSSARY ---

        const Glossary = () => (
            <div className="space-y-4 animate-fade-in">
                <h2 className="text-2xl font-bold text-green-800 mb-4 border-b pb-2">Fachbegriffe</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {definitions.map((item, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-lg shadow-sm border-l-4 border-green-600 hover:shadow-md transition-shadow">
                            <h3 className="font-bold text-lg text-green-800 flex items-center">
                                <span className="bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-2 uppercase">Def</span>
                                {item.term}
                            </h3>
                            <p className="text-gray-600 mt-2 text-sm leading-relaxed">{item.def}</p>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- 10. APP ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('lernen');

            const tabs = [
                {id: 'lernen',     label: 'Glossar'},
                {id: 'simulation', label: 'Simulator'},
                {id: 'training',   label: 'Training'},
                {id: 'zuchter',    label: 'Züchter'},
                {id: 'stammbaum',  label: 'Stammbaum'},
            ];

            return (
                <div className="p-4 max-w-5xl mx-auto pb-20">
                    <header className="mb-8 text-center pt-8">
                        <div className="inline-block bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full mb-3 tracking-widest">Johannes-Scharrer-Gymnasium</div>
                        <h1 className="text-3xl md:text-5xl font-extrabold text-slate-800 tracking-tight mb-2">
                            BIO<span className="text-green-600">GENETIK</span> MASTER
                        </h1>
                        <p className="text-gray-500 font-medium">Klassische Genetik, Mendel & Erbgänge</p>
                    </header>

                    <nav className="flex flex-wrap justify-center gap-2 md:gap-3 mb-10">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 md:px-6 py-3 rounded-xl font-bold text-sm md:text-base transition-all duration-300 ${
                                    activeTab === tab.id
                                    ? 'bg-green-600 text-white shadow-xl shadow-green-200 ring-2 ring-green-600 ring-offset-2'
                                    : 'bg-white text-gray-500 hover:bg-gray-50 border border-gray-200'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="min-h-[400px]">
                        {activeTab === 'lernen'     && <Glossary />}
                        {activeTab === 'simulation' && <Simulator />}
                        {activeTab === 'training'   && <Trainer />}
                        {activeTab === 'zuchter'    && <Zuchter />}
                        {activeTab === 'stammbaum'  && <Stammbaum />}
                    </main>

                    <footer className="mt-20 text-center border-t border-gray-200 pt-8 text-gray-400 text-sm">
                        <p className="mb-2 font-bold">Zollfrank</p>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
