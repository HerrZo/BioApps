<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hormone - Bio Lern-App</title>
    <meta name="theme-color" content="#166534">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-infinite; }
        * { box-sizing: border-box; }
    </style>
</head>
<body class="bg-green-50 text-gray-900 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconHome = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const IconCheck = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconFlask = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>;
        const IconPuzzle = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19.439 15.435a4.5 4.5 0 0 0-3.328-5.385l-.556-.118a1.5 1.5 0 0 1-.848-2.458"/></svg>;
        const IconUser = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconBrain = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44"/></svg>;

        const Station1 = ({ onComplete }) => {
            const [step, setStep] = useState(0);

            const experiments = [
                { title: "Berthold (1849)", desc: "Hähne wurden kastriert. Ohne Hoden bildeten sich sekundäre Geschlechtsmerkmale zurück. Hoden wurden an anderer Stelle eingepflanzt - der Hahn entwickelte sich normal!", conclusion: "Die Steuerung erfolgt über Stoffe im Blut (Hormone), nicht über Nerven." },
                { title: "Von Mering & Minkowski (1889)", desc: "Bei Hunden wurde die Bauchspeicheldrüse entfernt. Der Urin enthielt plötzlich Zucker - Fliegen sammelten sich am Urin.", conclusion: "Die Bauchspeicheldrüse gibt einen Stoff ins Blut ab (Insulin), der den Blutzucker regelt." }
            ];

            return (
                <div className="animate-fade-in space-y-6">
                    <h2 className="text-xl md:text-2xl font-bold text-green-800 border-b pb-2">Station 1: Entdeckung der Hormone</h2>
                    
                    <div className="grid md:grid-cols-2 gap-4">
                        {experiments.map((exp, idx) => (
                            <div 
                                key={idx}
                                onClick={() => { setStep(idx); if (idx === 1) onComplete(); }}
                                className={`cursor-pointer p-4 md:p-6 rounded-xl border-2 transition-all ${step === idx ? 'border-green-500 bg-green-50 shadow-md' : 'border-gray-200 hover:border-green-300'}`}
                            >
                                <h3 className="font-bold text-base md:text-lg mb-2">{exp.title}</h3>
                                <p className="text-xs md:text-sm text-gray-600 mb-3">{exp.desc}</p>
                                {step === idx && (
                                    <div className="bg-green-100 p-3 rounded-lg text-xs md:text-sm text-green-800 font-medium animate-fade-in">
                                        💡 {exp.conclusion}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Station2 = ({ onComplete }) => {
            const [filledSlots, setFilledSlots] = useState([]);
            const [activeReceptors] = useState(['square', 'circle', 'triangle']);
            const [message, setMessage] = useState("Ordne die Hormone den passenden Rezeptoren zu.");
            const [completed, setCompleted] = useState(0);

            const handleHormoneClick = (type) => {
                if (filledSlots.includes(type)) {
                    setMessage("Dieser Rezeptor ist bereits besetzt!");
                    return;
                }
                if (activeReceptors.includes(type)) {
                    const newFilled = [...filledSlots, type];
                    setFilledSlots(newFilled);
                    setMessage("Passt! Das Hormon hat angedockt.");
                    if (newFilled.length === activeReceptors.length) {
                        setCompleted(c => c + 1);
                        if (completed >= 2) onComplete();
                        setMessage("Perfekt! Alle Rezeptoren besetzt.");
                    }
                } else {
                    setMessage("Diese Zelle hat keinen passenden Rezeptor!");
                }
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <h2 className="text-xl md:text-2xl font-bold text-green-800 border-b pb-2">Station 2: Schlüssel-Schloss-Prinzip</h2>
                    <p className="text-sm md:text-base text-gray-600">Nicht jede Zelle ist gleich! Finde heraus, welche Hormone diese Zelle benötigt.</p>

                    <div className="flex flex-col md:flex-row items-center justify-around gap-6 bg-gradient-to-br from-red-50 to-white p-6 rounded-xl border border-red-100 shadow-inner min-h-[250px]">
                        <div className="flex flex-col gap-3">
                            <div className="text-center text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Blutbahn</div>
                            {['square', 'circle', 'triangle'].map((type, idx) => (
                                <button 
                                    key={type}
                                    onClick={() => handleHormoneClick(type)}
                                    className={`w-14 h-14 rounded-lg shadow-lg hover:scale-110 transition-transform flex items-center justify-center animate-float ${type === 'square' ? 'bg-green-500' : type === 'circle' ? 'bg-blue-500 rounded-full' : 'bg-yellow-500'}`}
                                    style={{animationDelay: `${idx}s`}}
                                >
                                    <span className="text-white font-bold text-xs">{type[0].toUpperCase()}</span>
                                </button>
                            ))}
                        </div>

                        <div className="relative w-48 h-48 md:w-56 md:h-56 bg-gray-200 border-4 border-gray-400 rounded-full flex items-center justify-center shadow-2xl">
                            <span className="text-gray-500 font-bold text-sm">Zielzelle</span>
                            {activeReceptors.map((type, idx) => (
                                <div 
                                    key={type}
                                    className={`absolute w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold transition-all ${filledSlots.includes(type) ? 'bg-green-500 text-white scale-110' : 'bg-white border-gray-400'}`}
                                    style={{
                                        top: idx === 0 ? '-10px' : idx === 1 ? '50%' : 'auto',
                                        bottom: idx === 2 ? '-10px' : 'auto',
                                        left: idx === 1 ? '-10px' : idx === 0 || idx === 2 ? '50%' : 'auto',
                                        right: idx === 1 ? 'auto' : 'auto',
                                        transform: 'translate(-50%, -50%)'
                                    }}
                                >
                                    {type[0].toUpperCase()}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`p-4 rounded-lg text-center font-medium transition-colors ${message.includes('Perfekt') ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}`}>
                        {message}
                    </div>
                </div>
            );
        };

        const Station3 = ({ onComplete }) => {
            const [placements, setPlacements] = useState({});
            const [selectedId, setSelectedId] = useState(null);
            const [activeInfo, setActiveInfo] = useState(null);

            const glands = [
                { id: 'hypo', name: 'Hypothalamus', short: 'Steuerzentrale', desc: 'Oberste Befehlszentrale im Gehirn. Verbindet Nerven- mit Hormonsystem.', hormone: 'Releasing-Hormone', cx: 150, cy: 72 },
                { id: 'hypophyse', name: 'Hypophyse', short: 'Hirnanhangsdrüse', desc: '"Chef-Drüse" - steuert andere Hormondrüsen.', hormone: 'Wachstumshormon', cx: 150, cy: 95 },
                { id: 'schild', name: 'Schilddrüse', short: 'Stoffwechsel', desc: 'Produziert Thyroxin für den Energiestoffwechsel.', hormone: 'Thyroxin', cx: 150, cy: 155 },
                { id: 'neben', name: 'Nebennieren', short: 'Stress & Alarm', desc: 'Schütten bei Stress Adrenalin aus.', hormone: 'Adrenalin', cx: 150, cy: 265 },
                { id: 'bauch', name: 'Bauchspeicheldrüse', short: 'Blutzucker', desc: 'Reguliert den Blutzuckerspiegel.', hormone: 'Insulin', cx: 165, cy: 300 },
                { id: 'sex', name: 'Keimdrüsen', short: 'Sexualität', desc: 'Produzieren Geschlechtshormone.', hormone: 'Testosteron/Östrogen', cx: 150, cy: 375 },
            ];

            const allPlaced = glands.every(g => placements[g.id]);

            useEffect(() => { if (allPlaced) onComplete(); }, [allPlaced]);

            const handleGlandClick = (id) => {
                if (!placements[id]) {
                    setSelectedId(id);
                    setActiveInfo(null);
                } else {
                    setActiveInfo(glands.find(g => g.id === id));
                }
            };

            const handleBodyClick = (targetId) => {
                if (selectedId && selectedId === targetId) {
                    setPlacements(prev => ({...prev, [selectedId]: true}));
                    setActiveInfo(glands.find(g => g.id === selectedId));
                    setSelectedId(null);
                }
            };

            const BodySVG = () => (
                <svg viewBox="0 0 300 500" className="w-full h-full">
                    <defs>
                        <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#e8d5c4" />
                            <stop offset="100%" stopColor="#dbc4b0" />
                        </linearGradient>
                        <linearGradient id="organBg" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#fce4ec" stopOpacity="0.5" />
                            <stop offset="100%" stopColor="#f8bbd0" stopOpacity="0.3" />
                        </linearGradient>
                    </defs>

                    {/* Head */}
                    <ellipse cx="150" cy="55" rx="35" ry="42" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1.5" />
                    {/* Ears */}
                    <ellipse cx="114" cy="55" rx="6" ry="10" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />
                    <ellipse cx="186" cy="55" rx="6" ry="10" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />

                    {/* Neck */}
                    <rect x="137" y="93" width="26" height="30" rx="4" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />

                    {/* Torso */}
                    <path d="M105,125 Q100,125 95,135 L80,185 L78,240 L82,320 Q85,340 100,350 L115,360 L135,365 L150,367 L165,365 L185,360 L200,350 Q215,340 218,320 L222,240 L220,185 L205,135 Q200,125 195,125 Z"
                        fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1.5" />

                    {/* Internal organ area (translucent) */}
                    <path d="M115,140 Q110,145 108,160 L105,220 L108,290 Q110,320 125,340 L150,350 L175,340 Q190,320 192,290 L195,220 L192,160 Q190,145 185,140 Z"
                        fill="url(#organBg)" stroke="#e0a0b0" strokeWidth="0.5" strokeDasharray="3,3" />

                    {/* Shoulders */}
                    <path d="M105,125 Q80,128 60,145 L50,160" fill="none" stroke="#c9a88c" strokeWidth="8" strokeLinecap="round" />
                    <path d="M195,125 Q220,128 240,145 L250,160" fill="none" stroke="#c9a88c" strokeWidth="8" strokeLinecap="round" />

                    {/* Left arm */}
                    <path d="M50,160 L42,220 L38,280 L40,310 Q42,325 48,330 L55,332 Q60,330 58,320 L52,280 L50,240"
                        fill="none" stroke="url(#skinGrad)" strokeWidth="22" strokeLinecap="round" strokeLinejoin="round" />
                    <ellipse cx="51" cy="332" rx="12" ry="8" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />

                    {/* Right arm */}
                    <path d="M250,160 L258,220 L262,280 L260,310 Q258,325 252,330 L245,332 Q240,330 242,320 L248,280 L250,240"
                        fill="none" stroke="url(#skinGrad)" strokeWidth="22" strokeLinecap="round" strokeLinejoin="round" />
                    <ellipse cx="249" cy="332" rx="12" ry="8" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />

                    {/* Left leg */}
                    <path d="M125,360 L118,400 L112,440 L110,470 L108,490"
                        fill="none" stroke="url(#skinGrad)" strokeWidth="28" strokeLinecap="round" />
                    <ellipse cx="108" cy="493" rx="16" ry="7" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />

                    {/* Right leg */}
                    <path d="M175,360 L182,400 L188,440 L190,470 L192,490"
                        fill="none" stroke="url(#skinGrad)" strokeWidth="28" strokeLinecap="round" />
                    <ellipse cx="192" cy="493" rx="16" ry="7" fill="url(#skinGrad)" stroke="#c9a88c" strokeWidth="1" />

                    {/* Brain outline in head */}
                    <path d="M130,40 Q125,30 135,25 Q145,18 155,22 Q165,18 170,28 Q178,35 172,45 Q175,52 168,56 Q160,62 150,60 Q140,62 133,56 Q126,50 130,40 Z"
                        fill="#f8d7e0" fillOpacity="0.5" stroke="#d4a0b0" strokeWidth="0.8" />

                    {/* Thyroid butterfly shape */}
                    <path d="M140,150 Q135,145 132,150 Q130,158 140,158 Z" fill="#b2dfdb" fillOpacity="0.4" stroke="#80cbc4" strokeWidth="0.5" />
                    <path d="M160,150 Q165,145 168,150 Q170,158 160,158 Z" fill="#b2dfdb" fillOpacity="0.4" stroke="#80cbc4" strokeWidth="0.5" />
                    <rect x="146" y="152" width="8" height="4" rx="2" fill="#b2dfdb" fillOpacity="0.3" />

                    {/* Kidneys / Adrenal glands hint */}
                    <ellipse cx="128" cy="268" rx="12" ry="18" fill="#ffccbc" fillOpacity="0.3" stroke="#ffab91" strokeWidth="0.5" />
                    <ellipse cx="172" cy="268" rx="12" ry="18" fill="#ffccbc" fillOpacity="0.3" stroke="#ffab91" strokeWidth="0.5" />

                    {/* Pancreas hint */}
                    <path d="M135,295 Q145,290 165,295 Q175,298 178,305 Q175,310 165,308 Q145,305 135,300 Z"
                        fill="#fff9c4" fillOpacity="0.3" stroke="#fff176" strokeWidth="0.5" />

                    {/* Gland click targets */}
                    {glands.map(g => {
                        const placed = placements[g.id];
                        const selected = selectedId === g.id;
                        return (
                            <g key={g.id} onClick={() => handleBodyClick(g.id)} style={{cursor: 'pointer'}}>
                                {selected && !placed && (
                                    <circle cx={g.cx} cy={g.cy} r="14" fill="none" stroke="#3b82f6" strokeWidth="2" opacity="0.6">
                                        <animate attributeName="r" values="10;16;10" dur="1.2s" repeatCount="indefinite" />
                                        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite" />
                                    </circle>
                                )}
                                <circle
                                    cx={g.cx} cy={g.cy} r="10"
                                    fill={placed ? "#22c55e" : selected ? "#60a5fa" : "#e5e7eb"}
                                    stroke={placed ? "#16a34a" : selected ? "#3b82f6" : "#d1d5db"}
                                    strokeWidth="2"
                                    opacity={placed || selected ? 1 : 0.4}
                                />
                                {placed && (
                                    <polyline points={`${g.cx-4},${g.cy} ${g.cx-1},${g.cy+3} ${g.cx+5},${g.cy-4}`} fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                                )}
                                {placed && (
                                    <text x={g.cx + 16} y={g.cy + 4} fill="#166534" fontSize="10" fontWeight="bold" fontFamily="sans-serif">{g.name}</text>
                                )}
                            </g>
                        );
                    })}
                </svg>
            );

            return (
                <div className="animate-fade-in space-y-6">
                    <h2 className="text-xl md:text-2xl font-bold text-green-800 border-b pb-2">Station 3: Die Hormondrüsen</h2>

                    <div className="flex flex-col md:flex-row gap-6">
                        <div className="flex-1 space-y-3">
                            <p className="text-xs md:text-sm text-gray-600 mb-3">Klicke auf einen Begriff, dann auf den passenden Punkt am Körper.</p>
                            <div className="grid grid-cols-2 gap-2">
                                {glands.map(g => (
                                    <button
                                        key={g.id}
                                        onClick={() => handleGlandClick(g.id)}
                                        className={`p-2 md:p-3 text-xs md:text-sm rounded-lg border-2 text-left transition-all ${
                                            placements[g.id]
                                                ? 'bg-green-100 border-green-400 text-green-800'
                                                : selectedId === g.id
                                                    ? 'bg-blue-100 border-blue-500 ring-2 ring-blue-200 shadow-md'
                                                    : 'bg-white border-gray-200 hover:bg-gray-50 hover:border-gray-300'
                                        }`}
                                    >
                                        <div className="font-bold text-xs md:text-sm">{g.name}</div>
                                        <div className="text-xs text-gray-500">{g.short}</div>
                                    </button>
                                ))}
                            </div>

                            {allPlaced && (
                                <div className="bg-green-100 border border-green-300 rounded-lg p-3 text-center text-green-800 font-bold text-sm animate-fade-in">
                                    Alle Drüsen korrekt platziert!
                                </div>
                            )}
                        </div>

                        <div className="w-56 h-[380px] md:w-64 md:h-[420px] mx-auto flex-shrink-0 bg-gradient-to-b from-blue-50 to-green-50 rounded-2xl border border-gray-200 shadow-inner p-2">
                            <BodySVG />
                        </div>
                    </div>

                    <div className="min-h-[120px]">
                        {activeInfo ? (
                            <div className="bg-green-50 border-l-4 border-green-500 p-3 md:p-4 rounded-r shadow-sm animate-fade-in">
                                <div className="flex justify-between items-start">
                                    <h3 className="font-bold text-base md:text-lg text-green-900">{activeInfo.name}</h3>
                                    <span className="text-xs bg-green-200 text-green-800 px-2 py-1 rounded-full">{activeInfo.hormone}</span>
                                </div>
                                <p className="text-gray-700 mt-2 text-xs md:text-sm">{activeInfo.desc}</p>
                            </div>
                        ) : selectedId ? (
                            <div className="bg-blue-50 border border-blue-200 p-4 rounded text-center text-blue-700 text-xs md:text-sm animate-fade-in">
                                Klicke jetzt auf die richtige Stelle am Körper für <strong>{glands.find(g => g.id === selectedId)?.name}</strong>.
                            </div>
                        ) : (
                            <div className="bg-gray-50 border border-gray-100 p-6 rounded text-center text-gray-400 text-xs md:text-sm">
                                Wähle eine Drüse aus der Liste und ordne sie dem Körper zu.
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Station4 = ({ onComplete }) => {
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const questions = [
                { q: "Wie gelangen Hormone zur Zielzelle?", options: ["Über Nervenbahnen", "Durch die Blutbahn", "Über Lymphflüssigkeit"], correct: 1 },
                { q: "Welches Hormon ist für Stress verantwortlich?", options: ["Insulin", "Östrogen", "Adrenalin"], correct: 2 },
                { q: "Welches Hormon senkt den Blutzucker?", options: ["Insulin", "Testosteron", "Thyroxin"], correct: 0 },
                { q: "Welche Hormone steuern die Pubertät?", options: ["Wachstumshormone", "Sexualhormone", "Stresshormone"], correct: 1 }
            ];

            const handleAnswer = (optIndex) => {
                if (feedback) return;
                const isCorrect = optIndex === questions[qIndex].correct;
                if (isCorrect) setScore(s => s + 1);
                setFeedback(isCorrect ? 'Richtig!' : 'Leider falsch.');

                setTimeout(() => {
                    setFeedback(null);
                    if (qIndex < questions.length - 1) {
                        setQIndex(q => q + 1);
                    } else {
                        setShowResult(true);
                        onComplete();
                    }
                }, 1500);
            };

            if (showResult) {
                return (
                    <div className="animate-fade-in text-center space-y-6 pt-10">
                        <div className="inline-block p-6 rounded-full bg-green-100 text-green-600 mb-4">
                            <IconCheck className="w-12 h-12 md:w-16 md:h-16" />
                        </div>
                        <h2 className="text-2xl md:text-3xl font-bold text-green-800">Quiz beendet!</h2>
                        <p className="text-lg md:text-xl">Du hast {score} von {questions.length} Fragen richtig.</p>
                    </div>
                );
            }

            return (
                <div className="animate-fade-in space-y-6 max-w-lg mx-auto">
                    <div className="flex justify-between items-center text-xs md:text-sm text-gray-500 border-b pb-2">
                        <span>Frage {qIndex + 1} von {questions.length}</span>
                        <span>Score: {score}</span>
                    </div>

                    <h2 className="text-lg md:text-xl font-bold text-gray-800 min-h-[60px] flex items-center justify-center text-center">
                        {questions[qIndex].q}
                    </h2>

                    <div className="space-y-3">
                        {questions[qIndex].options.map((opt, idx) => (
                            <button
                                key={idx}
                                onClick={() => handleAnswer(idx)}
                                disabled={feedback !== null}
                                className={`w-full p-3 md:p-4 rounded-xl border-2 text-left font-medium transition-all text-sm md:text-base ${
                                    feedback && idx === questions[qIndex].correct 
                                    ? 'bg-green-100 border-green-500 text-green-800'
                                    : feedback && idx !== questions[qIndex].correct 
                                    ? 'opacity-50'
                                    : 'bg-white border-gray-200 hover:border-green-300 hover:bg-green-50'
                                }`}
                            >
                                {opt}
                            </button>
                        ))}
                    </div>
                    
                    {feedback && (
                        <div className={`text-center font-bold text-lg ${feedback === 'Richtig!' ? 'text-green-600' : 'text-red-500'}`}>
                            {feedback}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentStation, setCurrentStation] = useState('dashboard');
            const [progress, setProgress] = useState({ station1: false, station2: false, station3: false, station4: false });

            const markComplete = (station) => {
                setProgress(prev => ({...prev, [station]: true}));
            };

            const stations = [
                { id: 'station1', title: 'Entdeckung', icon: <IconFlask className="w-6 h-6 md:w-8 md:h-8" />, desc: 'Berthold & Minkowski' },
                { id: 'station2', title: 'Schlüssel & Schloss', icon: <IconPuzzle className="w-6 h-6 md:w-8 md:h-8" />, desc: 'Wie Hormone andocken' },
                { id: 'station3', title: 'Hormondrüsen', icon: <IconUser className="w-6 h-6 md:w-8 md:h-8" />, desc: 'Anatomie des Körpers' },
                { id: 'station4', title: 'Quiz', icon: <IconBrain className="w-6 h-6 md:w-8 md:h-8" />, desc: 'Teste dein Wissen' }
            ];

            const renderContent = () => {
                switch(currentStation) {
                    case 'station1': return <Station1 onComplete={() => markComplete('station1')} />;
                    case 'station2': return <Station2 onComplete={() => markComplete('station2')} />;
                    case 'station3': return <Station3 onComplete={() => markComplete('station3')} />;
                    case 'station4': return <Station4 onComplete={() => markComplete('station4')} />;
                    default: return (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 animate-fade-in">
                            {stations.map(s => (
                                <button 
                                    key={s.id}
                                    onClick={() => setCurrentStation(s.id)}
                                    className="flex flex-col items-center p-4 md:p-6 bg-white border-2 border-green-50 rounded-2xl shadow-sm hover:shadow-md hover:border-green-200 transition-all group relative"
                                >
                                    <div className="bg-green-100 text-green-700 p-3 md:p-4 rounded-full mb-3 md:mb-4 group-hover:scale-110 transition-transform">
                                        {s.icon}
                                    </div>
                                    <h3 className="text-sm md:text-xl font-bold text-gray-800">{s.title}</h3>
                                    <p className="text-xs md:text-sm text-gray-500 mt-1 md:mt-2">{s.desc}</p>
                                    {progress[s.id] && (
                                        <div className="absolute top-2 md:top-4 right-2 md:right-4 bg-green-500 text-white p-1 rounded-full shadow-lg">
                                            <IconCheck className="w-3 h-3 md:w-4 md:h-4" />
                                        </div>
                                    )}
                                </button>
                            ))}
                        </div>
                    );
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-3 md:p-4 min-h-screen flex flex-col">
                    <header className="flex justify-between items-center mb-4 md:mb-6 bg-white p-3 md:p-4 rounded-xl shadow-sm border border-green-100 sticky top-2 z-50">
                        <div className="flex items-center gap-2 md:gap-3 cursor-pointer" onClick={() => setCurrentStation('dashboard')}>
                            <div className="bg-green-100 p-2 rounded-lg text-green-700">
                                <IconHome className="w-5 h-5 md:w-6 md:h-6" />
                            </div>
                            <div>
                                <h1 className="text-lg md:text-2xl font-bold text-green-800 leading-tight">Hormone</h1>
                                <p className="text-xs text-green-600 hidden md:block">Interaktives Lernmodul</p>
                            </div>
                        </div>
                        {currentStation !== 'dashboard' && (
                            <button onClick={() => setCurrentStation('dashboard')} className="text-xs md:text-sm bg-green-100 text-green-700 px-3 py-1.5 rounded-lg font-medium hover:bg-green-200 transition">
                                Zur Übersicht
                            </button>
                        )}
                    </header>

                    <main className="flex-grow bg-white rounded-2xl shadow-xl p-4 md:p-8 border border-green-50 relative overflow-hidden min-h-[400px]">
                        {renderContent()}
                    </main>

                    <footer className="text-center text-xs text-gray-400 mt-4 md:mt-6 pb-4">
                        Johannes-Scharrer-Gymnasium • Zollfrank • &copy; {new Date().getFullYear()}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
