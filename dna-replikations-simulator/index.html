<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA-Replikations-Simulator</title>
    <meta name="theme-color" content="#166534">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #34495E; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
        .dna-strand-path { transition: all 0.5s ease; }
        .btn-hover:hover { transform: scale(1.05); }
        
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #166534; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #d1d5db; border-radius: 2px; }
        
        * { box-sizing: border-box; }
    </style>
</head>
<body class="bg-[#ECF0F1] min-h-screen flex flex-col">

    <header class="bg-[#166534] text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex flex-col">
                    <h1 class="text-base md:text-xl font-bold leading-tight">DNA-Replikations-Simulator</h1>
                    <span class="text-xs text-green-200 font-normal hidden md:inline">Biologie Gymnasium Q11/12</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2 md:gap-3">
                <a href="../index.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-2 md:px-3 py-1.5 md:py-2 rounded-md transition-colors text-xs md:text-sm font-medium text-white">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span class="hidden sm:inline">Sammlung</span>
                </a>

                <button onclick="toggleGlossary(true)" class="flex items-center gap-2 bg-[#15803d] hover:bg-[#16a34a] px-3 md:px-4 py-1.5 md:py-2 rounded-md transition-colors text-xs md:text-sm font-semibold shadow-md">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span class="hidden sm:inline">Glossar</span>
                </button>
            </div>
        </div>
    </header>

    <main id="app-content" class="max-w-6xl mx-auto px-4 py-6 md:py-8 flex-grow w-full">
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs md:text-sm text-gray-500">
        <p>Johannes-Scharrer-Gymnasium • Zollfrank • &copy; <span id="year"></span></p>
    </footer>

    <div id="glossary-backdrop" onclick="toggleGlossary(false)" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>
    <div id="glossary-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="flex items-center justify-between p-4 border-b bg-[#166534] text-white">
            <h2 class="text-xl font-bold">Glossar</h2>
            <button onclick="toggleGlossary(false)" class="p-1 hover:bg-white/10 rounded-full transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="glossary-content" class="p-4 overflow-y-auto h-[calc(100%-64px)] bg-gray-50 space-y-4">
        </div>
    </div>

    <script>
        const COLORS = {
            primary: '#166534', secondary: '#15803d', secondaryHover: '#16a34a',
            strand1: '#9B59B6', strand2: '#E67E22', newStrand1: '#D7BDE2', newStrand2: '#F5CBA7',
            helicase: '#F39C12', primase: '#E74C3C', polymerase: '#27AE60', ligase: '#3498DB',
            primer: '#C0392B', background: '#ECF0F1', text: '#34495E', success: '#2ECC71', error: '#E74C3C',
        };

        const GLOSSARY = [
            { term: 'Antiparallel', definition: "Die beiden DNA-Stränge verlaufen in entgegengesetzter Richtung: 5'→3' und 3'→5'." },
            { term: 'DNA-Ligase', definition: "Enzym, das DNA-Stränge verknüpft, indem es Phosphodiesterbindungen bildet." },
            { term: 'DNA-Polymerase', definition: "Zentrales Enzym, das neue DNA-Stränge synthetisiert (5'→3'). Benötigt einen Primer." },
            { term: 'Folgestrang', definition: "Der DNA-Strang, der diskontinuierlich in Okazaki-Fragmenten synthetisiert wird." },
            { term: 'Helikase', definition: "Enzym, das die DNA-Doppelhelix entwindet und die Stränge trennt." },
            { term: 'Leitstrang', definition: "Der DNA-Strang, der kontinuierlich in Richtung der Replikationsgabel synthetisiert wird." },
            { term: 'Okazaki-Fragmente', definition: "Kurze DNA-Abschnitte am Folgestrang, die später verknüpft werden." },
            { term: 'Primase', definition: "Enzym, das kurze RNA-Primer als Startpunkt synthetisiert." },
            { term: 'Primer', definition: "Kurze RNA-Sequenz, Startpunkt für die DNA-Polymerase." },
            { term: 'Semikonservativ', definition: "Replikationsmechanismus: Jede Tochter-DNA besteht aus einem alten und einem neuen Strang." },
        ];

        const QUIZ_QUESTIONS = [
            { id: 1, question: "Was bewies das Meselson-Stahl-Experiment?", options: [{id:'A', text:"Die DNA ist eine Doppelhelix"}, {id:'B', text:"Die Replikation verläuft semikonservativ"}, {id:'C', text:"DNA-Polymerase benötigt einen Primer"}, {id:'D', text:"Okazaki-Fragmente existieren"}], correctAnswer: 'B', feedbackCorrect: "✅ Korrekt! Das Experiment zeigte, dass nach der ersten Replikation alle DNA-Moleküle hybrid waren.", feedbackWrong: "❌ Nicht ganz. Es ging um den Beweis, dass jeder alte Strang als Matrize dient." },
            { id: 2, question: "Welche Funktion hat die Helikase?", options: [{id:'A', text:"Verknüpft Okazaki-Fragmente"}, {id:'B', text:"Synthetisiert RNA-Primer"}, {id:'C', text:"Trennt die DNA-Stränge"}, {id:'D', text:"Fügt Nukleotide hinzu"}], correctAnswer: 'C', feedbackCorrect: "✅ Richtig! Die Helikase öffnet die Doppelhelix.", feedbackWrong: "❌ Die Helikase ist der 'Reißverschluss-Öffner'." },
            { id: 3, question: "In welcher Richtung synthetisiert die DNA-Polymerase?", options: [{id:'A', text:"3'→5'"}, {id:'B', text:"5'→3'"}, {id:'C', text:"Beide Richtungen"}, {id:'D', text:"Variabel"}], correctAnswer: 'B', feedbackCorrect: "✅ Korrekt! Immer von 5' nach 3'.", feedbackWrong: "❌ Die Chemie erlaubt nur das Anfügen an das 3'-OH Ende." },
            { id: 4, question: "Warum ist ein RNA-Primer notwendig?", options: [{id:'A', text:"RNA ist stabiler"}, {id:'B', text:"Polymerase kann nicht eigenständig beginnen"}, {id:'C', text:"Verhindert Fehler"}, {id:'D', text:"Markiert das Ende"}], correctAnswer: 'B', feedbackCorrect: "✅ Genau! Die Polymerase braucht ein freies 3'-Ende.", feedbackWrong: "❌ Die Polymerase kann nicht 'aus dem Nichts' starten." },
            { id: 5, question: "Warum wird der Leitstrang kontinuierlich synthetisiert?", options: [{id:'A', text:"Er ist kürzer"}, {id:'B', text:"Syntheserichtung stimmt mit Gabelbewegung überein"}, {id:'C', text:"Braucht keine Primer"}, {id:'D', text:"Er ist wichtiger"}], correctAnswer: 'B', feedbackCorrect: "✅ Richtig! Die Polymerase läuft hinter der Helikase her.", feedbackWrong: "❌ Es liegt an der Richtung." },
        ];

        const MS_STEPS = [
            { title: "Schritt 1: Ausgangssituation", desc: "E. coli-Bakterien werden in ¹⁵N-Medium kultiviert. Die gesamte DNA ist schwer.", label: "Gen 0: 100% ¹⁵N", comp: {heavy:100, hybrid:0, light:0} },
            { title: "Schritt 2: Transfer", desc: "Die Bakterien werden in ¹⁴N-Medium überführt.", label: "Transfer in ¹⁴N", comp: {heavy:100, hybrid:0, light:0} },
            { title: "Schritt 3: Generation 1", desc: "Nach einer Replikation besteht jedes DNA-Molekül aus einem alten und einem neuen Strang.", label: "Gen 1: 100% Hybrid", comp: {heavy:0, hybrid:100, light:0} },
            { title: "Schritt 4: Generation 2", desc: "Es entstehen zur Hälfte Hybrid-Moleküle und zur Hälfte leichte Moleküle.", label: "Gen 2: 50% Hybrid, 50% Leicht", comp: {heavy:0, hybrid:50, light:50} },
            { title: "Schritt 5: Interpretation", desc: "Das Ergebnis beweist: Die DNA-Replikation ist semikonservativ.", label: "Beweis: Semikonservativ", comp: {heavy:0, hybrid:50, light:50} }
        ];

        const SIM_STEPS = [
            { id: 0, text: "Ausgangssituation: Die DNA liegt als geschlossene Doppelhelix vor." },
            { id: 1, text: "Die Helikase (gelb) bindet und öffnet die Wasserstoffbrücken." },
            { id: 2, text: "Einzelstränge liegen frei als Matrizen vor." },
            { id: 3, text: "Leitstrang: Die Primase (rot) synthetisiert einen RNA-Primer." },
            { id: 4, text: "Leitstrang: DNA-Polymerase (grün) verlängert den Primer kontinuierlich." },
            { id: 5, text: "Folgestrang: Primase synthetisiert einen Primer." },
            { id: 6, text: "Folgestrang: DNA-Polymerase synthetisiert das erste Okazaki-Fragment." },
            { id: 7, text: "Folgestrang: Weitere Primer und Okazaki-Fragmente werden gebildet." },
            { id: 8, text: "Aufräumen: Enzyme entfernen die RNA-Primer." },
            { id: 9, text: "Die DNA-Ligase (blau) verknüpft die Fragmente." },
            { id: 10, text: "Abschluss: Zwei identische DNA-Doppelstränge sind entstanden." },
        ];

        const state = {
            view: 'HOME',
            msStep: 0,
            simStep: 0,
            simPlaying: false,
            simSpeed: 1,
            simConfig: { helicase: true, primase: true, polymerase: true, ligase: true, labels: true },
            compActive: false,
            quiz: { index: 0, selected: null, answered: false, score: 0, finished: false }
        };

        let simInterval = null;

        const ICONS = {
            flask: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${COLORS.secondary}" stroke-width="2"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>`,
            dna: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${COLORS.secondary}" stroke-width="2"><path d="M2 12h20"/><path d="M20 12v6"/><path d="M4 18v-6"/><path d="M20 12c0-3.31-2.69-6-6-6"/><path d="M4 12c0 3.31 2.69 6 6 6"/><path d="M14 6c-3.31 0-6 2.69-6 6"/><path d="M10 18c3.31 0 6-2.69 6-6"/></svg>`,
            compare: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${COLORS.secondary}" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/></svg>`,
            quiz: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${COLORS.secondary}" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>`,
            play: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            pause: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
            arrowLeft: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,
            arrowRight: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`,
            rotate: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="green" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            x: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`
        };

        function renderGlossaryContent() {
            const container = document.getElementById('glossary-content');
            container.innerHTML = GLOSSARY.map(item => `
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4" style="border-left-color: ${COLORS.secondary}">
                    <h3 class="font-bold text-[#166534] text-lg mb-1">${item.term}</h3>
                    <p class="text-gray-700 leading-relaxed text-sm">${item.definition}</p>
                </div>
            `).join('');
        }

        function renderHome() {
            return `
                <div class="text-center mb-8 md:mb-10 max-w-2xl mx-auto animate-fade-in">
                    <h2 class="text-2xl md:text-3xl font-bold text-[#166534] mb-4">Willkommen!</h2>
                    <p class="text-base md:text-lg text-gray-600 leading-relaxed">
                        Entdecke, wie die genetische Information verdoppelt wird.
                    </p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 max-w-4xl mx-auto animate-fade-in-up">
                    ${renderMenuCard('Meselson-Stahl', 'Der historische Beweis für die semikonservative Replikation.', ICONS.flask, 'MESELSON')}
                    ${renderMenuCard('Simulator', 'Interaktive Simulation des Replikationsprozesses.', ICONS.dna, 'SIMULATOR')}
                    ${renderMenuCard('Leit- vs. Folgestrang', 'Der direkte Vergleich.', ICONS.compare, 'COMPARISON')}
                    ${renderMenuCard('Abschluss-Quiz', 'Teste dein Wissen.', ICONS.quiz, 'QUIZ')}
                </div>
            `;
        }

        function renderMenuCard(title, desc, icon, targetView) {
            return `
            <button onclick="changeView('${targetView}')" class="bg-white p-6 md:p-8 rounded-xl shadow-md hover:shadow-xl hover:scale-105 transition-all duration-300 text-left border-l-4 group w-full" style="border-left-color: ${COLORS.secondary}">
                <div class="flex justify-between items-start mb-4">
                    ${icon}
                </div>
                <h3 class="text-lg md:text-xl font-bold text-[#166534] mb-2">${title}</h3>
                <p class="text-gray-600 text-sm md:text-base">${desc}</p>
            </button>`;
        }

        function renderMeselsonStahl() {
            const s = MS_STEPS[state.msStep];
            const tubeGradient = `<defs><linearGradient id="hybridGradient"><stop offset="0%" stopColor="${COLORS.strand1}" /><stop offset="100%" stopColor="${COLORS.strand2}" /></linearGradient></defs>`;
            const tubePath = `<path d="M10,10 L10,130 Q10,145 30,145 Q50,145 50,130 L50,10" fill="white" stroke="#aaa" stroke-width="2" />`;
            
            let bands = '';
            if (s.comp.light > 0) bands += `<rect x="12" y="30" width="36" height="8" fill="${COLORS.strand2}" opacity="0.9" rx="2" />`;
            if (s.comp.hybrid > 0) bands += `<rect x="12" y="70" width="36" height="8" fill="url(#hybridGradient)" opacity="0.9" rx="2" />`;
            if (s.comp.heavy > 0) bands += `<rect x="12" y="110" width="36" height="8" fill="${COLORS.strand1}" opacity="0.9" rx="2" />`;

            return `
            <div class="flex flex-col gap-6 max-w-4xl mx-auto animate-fade-in">
                <div class="bg-white p-4 md:p-6 rounded-lg shadow-md border-t-4" style="border-color: ${COLORS.secondary}">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl md:text-2xl font-bold text-[#166534]">Meselson-Stahl-Experiment</h2>
                        <span class="text-xs md:text-sm font-medium bg-gray-100 px-3 py-1 rounded-full">Schritt ${state.msStep + 1} / 5</span>
                    </div>

                    <div class="flex flex-col md:flex-row gap-6 md:gap-8 items-center justify-center min-h-[250px] md:min-h-[300px] bg-gray-50 rounded-lg p-6 md:p-8">
                        <div class="flex flex-col items-center gap-4">
                            <div class="font-bold text-[#166534] mb-2">Zentrifuge</div>
                            <svg viewBox="0 0 60 150" class="w-20 h-40 md:w-24 md:h-48 drop-shadow-lg">${tubeGradient}${tubePath}${bands}</svg>
                        </div>
                    </div>

                    <div class="mt-6">
                        <h3 class="text-lg md:text-xl font-bold mb-2">${s.title}</h3>
                        <p class="text-gray-700 leading-relaxed text-sm md:text-base">${s.desc}</p>
                        <div class="mt-2 font-semibold text-[#15803d]">${s.label}</div>
                    </div>

                    <div class="flex justify-between mt-6 md:mt-8 pt-4 border-t">
                        <button onclick="updateMsStep('reset')" class="flex items-center gap-2 px-4 py-2 text-gray-600 hover:text-[#166534] transition-colors text-sm">${ICONS.rotate} Reset</button>
                        <div class="flex gap-3 md:gap-4">
                            <button onclick="updateMsStep('prev')" class="flex items-center gap-2 px-4 md:px-6 py-2 rounded-md transition-colors text-sm ${state.msStep === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-[#166534] hover:bg-gray-300'}" ${state.msStep === 0 ? 'disabled' : ''}>${ICONS.arrowLeft} Zurück</button>
                            <button onclick="updateMsStep('next')" class="flex items-center gap-2 px-4 md:px-6 py-2 rounded-md text-white transition-colors text-sm ${state.msStep === MS_STEPS.length - 1 ? 'bg-gray-300 cursor-not-allowed' : 'bg-[#166534] hover:bg-[#15803d]'}" ${state.msStep === MS_STEPS.length - 1 ? 'disabled' : ''}>Weiter ${ICONS.arrowRight}</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderSimulator() {
            const step = state.simStep;
            const forkX = step === 0 ? 50 : 100 + (step * 50);
            const clampedForkX = Math.min(forkX, 600);
            const startY = 200, openTopY = 100, openBotY = 300;
            
            const topStrandPath = `M 0,${openTopY} L ${clampedForkX - 50},${openTopY} C ${clampedForkX},${openTopY} ${clampedForkX},${startY} ${clampedForkX},${startY}`;
            const botStrandPath = `M 0,${openBotY} L ${clampedForkX - 50},${openBotY} C ${clampedForkX},${openBotY} ${clampedForkX},${startY} ${clampedForkX},${startY}`;
            const closedPath = step < 10 ? `<path d="M ${clampedForkX},${startY} L 800,${startY}" fill="none" stroke="#7f8c8d" stroke-width="16" stroke-opacity="0.3" />` : '';

            return `
            <div class="flex flex-col gap-4 animate-fade-in">
                <div class="bg-white p-3 md:p-4 rounded-lg shadow border-b-2 border-gray-100 flex flex-wrap justify-between items-center gap-3">
                    <div class="flex items-center gap-2 bg-gray-100 rounded-lg p-1">
                        <button onclick="updateSimStep('reset')" class="p-2 hover:bg-white rounded shadow-sm">${ICONS.rotate}</button>
                        <button onclick="updateSimStep('prev')" class="p-2 hover:bg-white rounded shadow-sm">${ICONS.arrowLeft}</button>
                        <div class="px-3 font-mono font-bold w-12 text-center">${step}</div>
                        <button onclick="updateSimStep('next')" class="p-2 hover:bg-white rounded shadow-sm">${ICONS.arrowRight}</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleSimPlay()" class="flex items-center gap-2 px-3 md:px-4 py-2 rounded-md font-bold text-white transition-colors text-sm ${state.simPlaying ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-[#15803d] hover:bg-[#16a34a]'}">
                            ${state.simPlaying ? ICONS.pause + ' Pause' : ICONS.play + ' Auto'}
                        </button>
                    </div>
                </div>

                <div class="relative bg-white rounded-lg shadow-inner overflow-hidden border border-gray-200 h-[300px] md:h-[400px]">
                    <svg viewBox="0 0 800 400" class="w-full h-full">
                        <g class="dna-strand-path">
                            <path d="${topStrandPath}" fill="none" stroke="${COLORS.strand1}" stroke-width="8" stroke-linecap="round" />
                            <path d="${botStrandPath}" fill="none" stroke="${COLORS.strand2}" stroke-width="8" stroke-linecap="round" />
                            ${closedPath}
                        </g>
                    </svg>
                    <div class="absolute top-2 right-2 bg-white/90 p-2 rounded text-xs border border-gray-200">
                        <div class="font-bold mb-1">Legende</div>
                        <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-[#F39C12]"></div> Helikase</div>
                        <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-[#E74C3C]"></div> Primase</div>
                        <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-[#27AE60]"></div> Polymerase</div>
                    </div>
                </div>

                <div class="bg-blue-50 border-l-4 border-blue-500 p-3 md:p-4 rounded-r-lg">
                    <h3 class="font-bold text-[#166534] mb-1 text-sm md:text-base">Schritt ${step}:</h3>
                    <p class="text-gray-700 text-sm md:text-base">${SIM_STEPS[step]?.text}</p>
                </div>
            </div>`;
        }

        function renderComparison() {
            const active = state.compActive;
            return `
            <div class="space-y-6 animate-fade-in">
                <div class="bg-white p-4 md:p-6 rounded-lg shadow-md">
                    <h2 class="text-xl md:text-2xl font-bold text-[#166534] mb-4">Leitstrang vs. Folgestrang</h2>
                    <p class="mb-6 text-gray-600 text-sm md:text-base">Warum ist die Replikation so kompliziert? DNA-Stränge sind <strong>antiparallel</strong> und die DNA-Polymerase funktioniert nur in <strong>5'→3'</strong> Richtung.</p>
                    
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="border rounded-xl overflow-hidden">
                            <div class="bg-green-50 p-3 md:p-4 border-b border-green-100"><h3 class="text-lg font-bold text-green-800">Leitstrang</h3><p class="text-xs md:text-sm text-green-700">Kontinuierliche Synthese</p></div>
                            <div class="p-4 h-32 md:h-40 bg-gray-50 flex items-center justify-center">
                                <svg viewBox="0 0 300 100" class="w-full h-full">
                                    <path d="M 0,80 L 300,80" stroke="${COLORS.strand2}" stroke-width="4" />
                                    <path d="M 0,60 L ${active ? 250 : 100},60" stroke="${COLORS.newStrand2}" stroke-width="4" style="transition: all 2s linear" />
                                </svg>
                            </div>
                        </div>
                        <div class="border rounded-xl overflow-hidden">
                            <div class="bg-red-50 p-3 md:p-4 border-b border-red-100"><h3 class="text-lg font-bold text-red-800">Folgestrang</h3><p class="text-xs md:text-sm text-red-700">Diskontinuierliche Synthese</p></div>
                            <div class="p-4 h-32 md:h-40 bg-gray-50 flex items-center justify-center">
                                <svg viewBox="0 0 300 100" class="w-full h-full">
                                    <path d="M 0,20 L 300,20" stroke="${COLORS.strand1}" stroke-width="4" />
                                    <line x1="50" y1="40" x2="100" y2="40" stroke="${COLORS.newStrand1}" stroke-width="4" />
                                    <line x1="150" y1="40" x2="200" y2="40" stroke="${COLORS.newStrand1}" stroke-width="4" opacity="${active ? 1 : 0.3}" />
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-center">
                        <button onclick="toggleCompActive()" class="flex items-center gap-2 bg-[#166534] text-white px-6 py-3 rounded-full hover:bg-[#15803d] transition-transform active:scale-95 text-sm md:text-base">
                            ${ICONS.rotate} ${active ? "Reset" : "Animation starten"}
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function renderQuiz() {
            if (state.quiz.finished) {
                const score = state.quiz.score;
                return `
                <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-lg text-center animate-fade-in">
                    <h2 class="text-2xl md:text-3xl font-bold text-[#166534] mb-6">Quiz Ergebnis</h2>
                    <div class="text-5xl md:text-6xl font-bold mb-4" style="color: ${score > 3 ? COLORS.success : COLORS.helicase}">${score} / ${QUIZ_QUESTIONS.length}</div>
                    <p class="text-lg md:text-xl mb-8">${score === 5 ? "🎉 Perfekt!" : score >= 3 ? "👍 Gut gemacht!" : "📚 Übung macht den Meister."}</p>
                    <button onclick="resetQuiz()" class="bg-[#166534] text-white px-8 py-3 rounded-lg hover:bg-[#15803d] transition-colors">${ICONS.rotate} Quiz wiederholen</button>
                </div>`;
            }

            const q = QUIZ_QUESTIONS[state.quiz.index];
            const progress = ((state.quiz.index + 1) / QUIZ_QUESTIONS.length) * 100;

            return `
            <div class="max-w-3xl mx-auto animate-fade-in">
                <div class="mb-6 flex justify-between items-center text-gray-500 text-sm">
                    <span>Frage ${state.quiz.index + 1} von ${QUIZ_QUESTIONS.length}</span>
                    <span>Score: ${state.quiz.score}</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8"><div class="bg-[#15803d] h-2.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div></div>
                
                <div class="bg-white p-4 md:p-8 rounded-lg shadow-md mb-6">
                    <h3 class="text-lg md:text-2xl font-bold text-[#166534] mb-6">${q.question}</h3>
                    <div class="space-y-3">
                        ${q.options.map(opt => {
                            let cls = "w-full text-left p-3 md:p-4 rounded-lg border-2 transition-all text-sm md:text-base ";
                            if (state.quiz.answered) {
                                if (opt.id === q.correctAnswer) cls += "border-green-500 bg-green-50 text-green-800";
                                else if (state.quiz.selected === opt.id) cls += "border-red-500 bg-red-50 text-red-800";
                                else cls += "border-gray-100 opacity-50";
                            } else {
                                cls += "border-gray-200 hover:border-[#15803d] hover:bg-gray-50";
                            }
                            return `<button onclick="handleQuizAnswer('${opt.id}')" ${state.quiz.answered ? 'disabled' : ''} class="${cls}"><span class="font-bold mr-2">${opt.id})</span> ${opt.text}</button>`;
                        }).join('')}
                    </div>
                </div>

                ${state.quiz.answered ? `
                <div class="p-4 rounded-lg mb-6 ${state.quiz.selected === q.correctAnswer ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'} animate-fade-in-up">
                    <div class="font-bold mb-1">${state.quiz.selected === q.correctAnswer ? "Richtig!" : "Falsch!"}</div>
                    <p class="text-sm">${state.quiz.selected === q.correctAnswer ? q.feedbackCorrect : q.feedbackWrong}</p>
                </div>` : ''}

                <div class="flex justify-end">
                    <button onclick="nextQuizQuestion()" ${!state.quiz.answered ? 'disabled' : ''} class="px-6 md:px-8 py-3 rounded-lg font-bold transition-colors text-sm md:text-base ${state.quiz.answered ? 'bg-[#166534] text-white hover:bg-[#15803d]' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}">
                        ${state.quiz.index === QUIZ_QUESTIONS.length - 1 ? "Ergebnis anzeigen" : "Nächste Frage"}
                    </button>
                </div>
            </div>`;
        }

        function changeView(newView) {
            state.view = newView;
            if (newView !== 'SIMULATOR' && state.simPlaying) toggleSimPlay();
            render();
        }

        function toggleGlossary(show) {
            const backdrop = document.getElementById('glossary-backdrop');
            const sidebar = document.getElementById('glossary-sidebar');
            if (show) {
                backdrop.classList.remove('hidden');
                setTimeout(() => sidebar.classList.remove('translate-x-full'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            }
        }

        function updateMsStep(action) {
            if (action === 'next') state.msStep = Math.min(MS_STEPS.length - 1, state.msStep + 1);
            if (action === 'prev') state.msStep = Math.max(0, state.msStep - 1);
            if (action === 'reset') state.msStep = 0;
            render();
        }

        function updateSimStep(action) {
            if (action === 'next') state.simStep = Math.min(10, state.simStep + 1);
            if (action === 'prev') state.simStep = Math.max(0, state.simStep - 1);
            if (action === 'reset') state.simStep = 0;
            if (state.simStep === 10) state.simPlaying = false;
            render();
        }

        function toggleSimPlay() {
            if (state.simPlaying) {
                clearInterval(simInterval);
                state.simPlaying = false;
            } else {
                state.simPlaying = true;
                if (state.simStep >= 10) state.simStep = 0;
                simInterval = setInterval(() => {
                    if (state.simStep < 10) {
                        state.simStep++;
                        render();
                    } else {
                        toggleSimPlay();
                    }
                }, 3000 / state.simSpeed);
            }
            render();
        }

        function toggleCompActive() {
            state.compActive = !state.compActive;
            render();
        }

        function handleQuizAnswer(id) {
            if (state.quiz.answered) return;
            state.quiz.selected = id;
            state.quiz.answered = true;
            if (id === QUIZ_QUESTIONS[state.quiz.index].correctAnswer) {
                state.quiz.score++;
            }
            render();
        }

        function nextQuizQuestion() {
            if (state.quiz.index < QUIZ_QUESTIONS.length - 1) {
                state.quiz.index++;
                state.quiz.selected = null;
                state.quiz.answered = false;
            } else {
                state.quiz.finished = true;
            }
            render();
        }

        function resetQuiz() {
            state.quiz = { index: 0, selected: null, answered: false, score: 0, finished: false };
            render();
        }

        function render() {
            const root = document.getElementById('app-content');
            
            if (state.view === 'HOME') {
                root.innerHTML = renderHome();
            } else {
                let backButton = `<button onclick="changeView('HOME')" class="mb-4 flex items-center gap-2 text-[#166534] hover:text-[#15803d] transition-colors text-sm font-medium">${ICONS.arrowLeft} Zurück zur Übersicht</button>`;
                
                if (state.view === 'MESELSON') root.innerHTML = backButton + renderMeselsonStahl();
                else if (state.view === 'SIMULATOR') root.innerHTML = backButton + renderSimulator();
                else if (state.view === 'COMPARISON') root.innerHTML = backButton + renderComparison();
                else if (state.view === 'QUIZ') root.innerHTML = backButton + renderQuiz();
            }
        }

        document.getElementById('year').textContent = new Date().getFullYear();
        renderGlossaryContent();
        render();
    </script>
</body>
</html>
