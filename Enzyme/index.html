46."}],structures:[{id:"primary",title:"Primärstruktur",subtitle:"Aminosäuresequenz",desc:"Die lineare Abfolge der Aminosäuren, verbunden durch Peptidbindungen. Sie bestimmt alle weiteren Strukturebenen.",color:"#16a34a"},{id:"secondary",title:"Sekundärstruktur",subtitle:"α-Helix & β-Faltblatt",desc:"Regelmäßige, lokale Faltungsmuster durch Wasserstoffbrücken zwischen benachbarten Aminosäuren.",color:"#0ea5e9"},{id:"tertiary",title:"Tertiärstruktur",subtitle:"3D-Faltung",desc:"Die vollständige dreidimensionale Raumstruktur eines Proteins, stabilisiert durch verschiedene Wechselwirkungen (Disulfidbrücken, hydrophobe WW, Ionenbindungen).",color:"#8b5cf6"},{id:"quaternary",title:"Quartärstruktur",subtitle:"Untereinheiten",desc:"Zusammenlagerung mehrerer Polypeptidketten (Untereinheiten) zu einem funktionellen Proteinkomplex, z.B. Hämoglobin aus 4 Untereinheiten.",color:"#f59e0b"}],mechanismSteps:[{id:"step1",title:"Substrat nähert sich",desc:"Das Substrat bewegt sich zum aktiven Zentrum des Enzyms und wird durch seine komplementäre Form angezogen."},{id:"step2",title:"Enzym-Substrat-Komplex",desc:"Das Substrat bindet an das aktive Zentrum – es entsteht der Enzym-Substrat-Komplex (nach dem Schlüssel-Schloss-Prinzip)."},{id:"step3",title:"Katalyse / Umsetzung",desc:"Das Enzym senkt die Aktivierungsenergie und wandelt das Substrat in die Produkte um."},{id:"step4",title:"Produkte werden freigesetzt",desc:"Die Produkte lösen sich vom Enzym ab. Das aktive Zentrum ist wieder frei für ein neues Substrat."}],quizQuestions:[{q:'Was bedeutet der Begriff "Enzym"?',options:["Im Sauerteig/Hefe","Schneller Stoff","Verdauungshelfer","Zellbaustein"],correct:0,explanation:"Der Begriff kommt aus dem Griechischen: en = in, zyme = Sauerteig/Hefe."},{q:"Was beschreibt die Substratspezifität?",options:["Enzyme können alle Substrate umsetzen","Jedes Enzym setzt nur bestimmte Substrate um","Substrate wählen ihr Enzym aus","Enzyme verändern ihre Form beliebig"],correct:1,explanation:"Wie ein S
