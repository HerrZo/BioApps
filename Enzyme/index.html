kelkraft – ähnlich einer Mühle."},{year:"1783",text:"Magensaft reicht aus, um Fleisch zu verflüssigen",detail:"Experiment mit Magensaft von Greifvögeln zeigt: Eine chemische Komponente ist beteiligt."},{year:"1831",text:'Mundspeichel „verzuckert" Stärke',detail:"Speichel kann Stärke in Zucker umwandeln – ein Hinweis auf chemische Katalysatoren im Körper."},{year:"1835",text:"Zuckerspaltung ist eine chemische Reaktion",detail:"Es handelt sich nicht um eine bloße Stofftrennung, sondern um eine echte chemische Umwandlung."},{year:"1837",text:"Hefe ist ein Mikroorganismus",detail:"Hefe besteht aus winzigen, mit dem bloßen Auge nicht sichtbaren Lebewesen."},{year:"1862",text:"Fermentation funktioniert auch nach Tod der Mikroorganismen",detail:"Pasteur zeigt: Die Gärung hängt mit Mikroorganismen zusammen, aber die Substanz bleibt auch nach deren Tod aktiv."},{year:"1878",text:'Begriff „Enzym" wird eingeführt',detail:'Kühne prägt den Begriff aus dem Griechischen: en = in, zyme = Sauerteig/Hefe → „im Sauerteig".'},{year:"1890",text:"Fischer: Schlüssel-Schloss-Prinzip",detail:"Emil Fischer beschreibt: Enzym und Substrat passen wie Schlüssel und Schloss zusammen → Substratspezifität."},{year:"1897",text:"Buchner: Gärung ohne lebende Zellen",detail:"Eduard Buchner zeigt: Alkoholische Gärung funktioniert auch mit zellfreiem Hefeextrakt → Enzyme sind die Ursache!"},{year:"1908",text:"Röhm isoliert erstmals Enzyme",detail:"Erste industrielle Isolation von Enzymen – Beginn der Enzymtechnologie."},{year:"~1900er",text:"Streit: Sind Enzyme Proteine?",detail:"Große Debatte: Sind Enzyme selbst Proteine, oder transportieren Proteine nur die eigentlichen Wirkstoffe?"},{year:"1926",text:"Sumner: Urease ist ein Protein",detail:"James Sumner kristallisiert das Enzym Urease und weist nach, dass es ein Protein ist – Nobelpreis!"},{year:"1930",text:"Northrop & Stanley bestätigen: Enzyme = Proteine",detail:"Sie beweisen am Beispiel Pepsin endgültig: Enzyme bestehen aus Proteinen. Nobelpreis 1946."}],structures:[{id:"primary",title:"Primärstruktur",subtitle:"Aminosäuresequenz",desc:"Die lineare Abfolge der Aminosäuren, verbunden durch Peptidbindungen. Sie bestimmt alle weiteren Strukturebenen.",color:"#16a34a"},{id:"secondary",title:"Sekundärstruktur",subtitle:"α-Helix & β-Faltblatt",desc:"Regelmäßige, lokale Faltungsmuster durch Wasserstoffbrücken zwischen benachbarten Aminosäuren.",color:"#0ea5e9"},{id:"tertiary",title:"Tertiärstruktur",subtitle:"3D-Faltung",desc:"Die vollständige dreidimensionale Raumstruktur eines Proteins, stabilisiert durch verschiedene Wechselwirkungen (Disulfidbrücken, hydrophobe WW, Ionenbindungen).",color:"#8b5cf6"},{id:"quaternary",title:"Quartärstruktur",subtitle:"Untereinheiten",desc:"Zusammenlagerung mehrerer Polypeptidketten (Untereinheiten) zu einem funktionellen Proteinkomplex, z.B. Hämoglobin aus 4 Untereinheiten.",color:"#f59e0b"}],mechanismSteps:[{id:"step1",title:"Substrat nähert sich",desc:"Das Substrat bewegt sich zum aktiven Zentrum des Enzyms und wird durch seine komplementäre Form angezogen."},{id:"step2",title:"Enzym-Substrat-Komplex",desc:"Das Substrat bindet an das aktive Zentrum – es entsteht der Enzym-Substrat-Komplex (nach dem Schlüssel-Schloss-Prinzip)."},{id:"step3",title:"Katalyse / Umsetzung",desc:"Das Enzym senkt die Aktivierungsenergie und wandelt das Substrat in die Produkte um."},{id:"step4",title:"Produkte werden freigesetzt",desc:"Die Produkte lösen sich vom Enzym ab. Das aktive Zentrum ist wieder frei für ein neues Substrat."}],quizQuestions:[{q:'Was bedeutet der Begriff "Enzym"?',options:["Im Sauerteig/Hefe","Schneller Stoff","Verdauungshelfer","Zellbaustein"],correct:0,explanation:"Der Begriff kommt aus dem Griechischen: en = in, zyme = Sauerteig/Hefe."},{q:"Was beschreibt die Substratspezifität?",options:["Enzyme können alle Substrate umsetzen","Jedes Enzym setzt nur bestimmte Substrate um","Substrate wählen ihr Enzym aus","Enzyme verändern ihre Form beliebig"],correct:1,explanation:"Wie ein S
