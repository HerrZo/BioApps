<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzyme – Biologie Lern-App</title>
  <meta name=”description” content=”Interaktive Lern-App über Enzyme: Geschichte, Aufbau, Wirkweise, Energetik und Einflussfaktoren.”>
  <meta name="theme-color" content="#166534">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>/* ═══════════════════════════════════════════════════════════════
   ENZYME LERN-APP – Style System
   Design: Scientific / Organic  ·  Palette: Bio-Grün + Amber
   ═══════════════════════════════════════════════════════════════ */

/* ── Google Fonts ─────────────────────────────────────────────── */

/* ── CSS Custom Properties ────────────────────────────────────── */
:root {
  /* Primary – Bio-Grün */
  --clr-primary-50:  #f0fdf4;
  --clr-primary-100: #dcfce7;
  --clr-primary-200: #bbf7d0;
  --clr-primary-300: #6ee7a0;
  --clr-primary-400: #34d369;
  --clr-primary-500: #16a34a;
  --clr-primary-600: #15803d;
  --clr-primary-700: #166534;
  --clr-primary-800: #14532d;
  --clr-primary-900: #052e16;

  /* Accent – Amber/Gold (Enzyme-gelb) */
  --clr-accent-50:  #fffbeb;
  --clr-accent-100: #fef3c7;
  --clr-accent-200: #fde68a;
  --clr-accent-300: #fcd34d;
  --clr-accent-400: #fbbf24;
  --clr-accent-500: #f59e0b;
  --clr-accent-600: #d97706;

  /* Neutrals */
  --clr-slate-50:  #f8fafc;
  --clr-slate-100: #f1f5f9;
  --clr-slate-200: #e2e8f0;
  --clr-slate-300: #cbd5e1;
  --clr-slate-400: #94a3b8;
  --clr-slate-500: #64748b;
  --clr-slate-600: #475569;
  --clr-slate-700: #334155;
  --clr-slate-800: #1e293b;
  --clr-slate-900: #0f172a;

  /* Semantic */
  --clr-success: #22c55e;
  --clr-error:   #ef4444;
  --clr-info:    #3b82f6;
  --clr-warning: #f59e0b;
  --clr-substrate: #8b5cf6;
  --clr-product:   #06b6d4;

  /* Typography */
  --font-display: 'Outfit', sans-serif;
  --font-body:    'DM Sans', sans-serif;

  /* Spacing */
  --sp-xs: 0.25rem;
  --sp-sm: 0.5rem;
  --sp-md: 1rem;
  --sp-lg: 1.5rem;
  --sp-xl: 2rem;
  --sp-2xl: 3rem;
  --sp-3xl: 4rem;

  /* Radii */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
  --shadow-glow: 0 0 20px rgba(22,163,74,0.15);

  /* Transitions */
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* Layout */
  --sidebar-width: 280px;
  --header-height: 64px;

  /* Theme */
  --bg-app: #f0fdf4;
  --bg-card: #ffffff;
  --bg-glass: rgba(255,255,255,0.7);
  --text-primary: var(--clr-slate-800);
  --text-secondary: var(--clr-slate-500);
  --border-color: var(--clr-slate-200);
}

/* Dark Mode */
.dark {
  --bg-app: #0c1a12;
  --bg-card: #162416;
  --bg-glass: rgba(22,37,22,0.8);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --border-color: #2d4a35;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 30px rgba(34,197,94,0.2);
}

/* ── Reset & Base ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: var(--font-body);
  background: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.4s var(--ease-out), color 0.4s var(--ease-out);
}

/* Background Mesh */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(34,197,94,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(245,158,11,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── Typography ───────────────────────────────────────────────── */
h1, h2, h3, h4, h5 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; }
h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); }
h2 { font-size: clamp(1.2rem, 2.5vw, 1.6rem); }
h3 { font-size: clamp(1rem, 2vw, 1.2rem); }

p, li { line-height: 1.7; }

/* ── Layout ───────────────────────────────────────────────────── */
.app-container {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ── Sidebar ──────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border-color);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.35s var(--ease-out);
  overflow-y: auto;
}

.sidebar-header {
  padding: var(--sp-lg);
  border-bottom: 1px solid var(--border-color);
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  text-decoration: none;
  color: var(--text-primary);
}

.sidebar-logo svg {
  width: 32px;
  height: 32px;
  color: var(--clr-primary-500);
}

.sidebar-logo span {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.1rem;
  background: linear-gradient(135deg, var(--clr-primary-600), var(--clr-accent-500));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-nav {
  flex: 1;
  padding: var(--sp-md);
  display: flex;
  flex-direction: column;
  gap: var(--sp-xs);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--radius-md);
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.25s var(--ease-out);
  text-align: left;
  width: 100%;
  position: relative;
}

.nav-item:hover {
  background: var(--clr-primary-50);
  color: var(--clr-primary-700);
}

.dark .nav-item:hover {
  background: rgba(34,197,94,0.1);
  color: var(--clr-primary-300);
}

.nav-item.active {
  background: var(--clr-primary-500);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(22,163,74,0.3);
}

.nav-item .nav-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
}

.nav-item .nav-check {
  margin-left: auto;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--clr-success);
  color: #fff;
  font-size: 0.65rem;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s var(--ease-spring);
}

.nav-item.completed .nav-check {
  opacity: 1;
  transform: scale(1);
}

/* Sidebar Footer */
.sidebar-footer {
  padding: var(--sp-md) var(--sp-lg);
  border-top: 1px solid var(--border-color);
}

.theme-toggle {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-family: var(--font-body);
  width: 100%;
  transition: all 0.25s var(--ease-out);
}

.theme-toggle:hover {
  border-color: var(--clr-primary-400);
  color: var(--clr-primary-600);
}

/* Mobile sidebar toggle */
.mobile-menu-btn {
  display: none;
  position: fixed;
  top: var(--sp-md);
  left: var(--sp-md);
  z-index: 200;
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-color);
  cursor: pointer;
  color: var(--text-primary);
  font-size: 1.2rem;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--ease-out);
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
}

/* ── Main Content ─────────────────────────────────────────────── */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  position: relative;
}

/* Header Bar */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-xl);
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-color);
}

.top-bar-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-primary);
}

.top-bar-right {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
}

/* Progress Bar */
.progress-container {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}

.progress-bar-wrapper {
  width: 140px;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--clr-slate-200);
  overflow: hidden;
}

.dark .progress-bar-wrapper {
  background: var(--clr-slate-700);
}

.progress-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: linear-gradient(90deg, var(--clr-primary-500), var(--clr-accent-400));
  transition: width 0.6s var(--ease-out);
}

.progress-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--clr-primary-600);
}

/* Score Badge */
.score-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--clr-accent-100), var(--clr-accent-200));
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--clr-accent-600);
}

.dark .score-badge {
  background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(251,191,36,0.15));
  color: var(--clr-accent-300);
}

/* ── Content Area ─────────────────────────────────────────────── */
.content-area {
  max-width: 900px;
  margin: 0 auto;
  padding: var(--sp-xl) var(--sp-xl) var(--sp-3xl);
}

/* ── Card Component ───────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--sp-xl);
  box-shadow: var(--shadow-sm);
  transition: all 0.3s var(--ease-out);
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card-glass {
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* ── Section Headers ──────────────────────────────────────────── */
.section-header {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  margin-bottom: var(--sp-xl);
}

.section-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  background: linear-gradient(135deg, var(--clr-primary-100), var(--clr-primary-200));
  color: var(--clr-primary-700);
  flex-shrink: 0;
}

.dark .section-icon {
  background: linear-gradient(135deg, rgba(22,163,74,0.2), rgba(34,197,94,0.15));
  color: var(--clr-primary-300);
}

.section-title {
  color: var(--text-primary);
}

.section-subtitle {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ── Timeline ─────────────────────────────────────────────────── */
.timeline {
  position: relative;
  padding-left: 32px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 12px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--clr-primary-300), var(--clr-accent-300), var(--clr-primary-300));
  border-radius: 2px;
}

.timeline-item {
  position: relative;
  padding: var(--sp-md) 0;
  padding-left: var(--sp-lg);
  opacity: 0;
  transform: translateX(-15px);
  transition: all 0.5s var(--ease-out);
  cursor: pointer;
}

.timeline-item.visible {
  opacity: 1;
  transform: translateX(0);
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -26px;
  top: 22px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 3px solid var(--clr-primary-400);
  transition: all 0.3s var(--ease-out);
  z-index: 2;
}

.timeline-item:hover::before,
.timeline-item.active::before {
  background: var(--clr-primary-500);
  border-color: var(--clr-primary-500);
  box-shadow: 0 0 12px rgba(22,163,74,0.4);
  transform: scale(1.3);
}

.timeline-year {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1rem;
  color: var(--clr-primary-600);
  margin-bottom: 4px;
}

.dark .timeline-year {
  color: var(--clr-primary-300);
}

.timeline-text {
  font-size: 0.875rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

.timeline-item.active .timeline-text {
  color: var(--text-primary);
}

.timeline-detail {
  margin-top: var(--sp-sm);
  padding: var(--sp-md);
  background: var(--clr-primary-50);
  border: 1px solid var(--clr-primary-200);
  border-radius: var(--radius-md);
  font-size: 0.8rem;
  color: var(--clr-primary-800);
  animation: slideDown 0.3s var(--ease-out);
}

.dark .timeline-detail {
  background: rgba(34,197,94,0.08);
  border-color: rgba(34,197,94,0.2);
  color: var(--clr-primary-200);
}

/* ── Protein Structure Visualization ──────────────────────────── */
.structure-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--sp-md);
}

.structure-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--sp-lg);
  text-align: center;
  cursor: pointer;
  transition: all 0.35s var(--ease-out);
  position: relative;
  overflow: hidden;
}

.structure-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity 0.3s;
}

.structure-card:hover, .structure-card.active {
  transform: translateY(-4px);
  border-color: var(--clr-primary-400);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}

.structure-card.active::before {
  opacity: 1;
  background: linear-gradient(135deg, rgba(34,197,94,0.05), rgba(245,158,11,0.05));
}

.structure-card .structure-svg {
  width: 80px;
  height: 80px;
  margin: 0 auto var(--sp-sm);
}

.structure-card h4 {
  font-size: 0.9rem;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.structure-card p {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

/* ── Enzyme Mechanism Animation ───────────────────────────────── */
.enzyme-animation-container {
  position: relative;
  width: 100%;
  height: 280px;
  background: linear-gradient(135deg, var(--clr-slate-50), var(--clr-primary-50));
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  overflow: hidden;
}

.dark .enzyme-animation-container {
  background: linear-gradient(135deg, rgba(15,23,42,0.5), rgba(20,83,45,0.2));
}

.enzyme-step-controls {
  display: flex;
  gap: var(--sp-sm);
  flex-wrap: wrap;
}

.step-btn {
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--radius-full);
  border: 2px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
}

.step-btn:hover {
  border-color: var(--clr-primary-400);
  color: var(--clr-primary-600);
}

.step-btn.active {
  background: var(--clr-primary-500);
  border-color: var(--clr-primary-500);
  color: #fff;
}

/* ── Energy Diagram ───────────────────────────────────────────── */
.energy-diagram {
  position: relative;
  width: 100%;
  height: 320px;
  cursor: crosshair;
}

.energy-diagram canvas {
  width: 100%;
  height: 100%;
  border-radius: var(--radius-md);
}

.energy-controls {
  display: flex;
  gap: var(--sp-md);
  align-items: center;
  flex-wrap: wrap;
}

.energy-toggle {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--radius-full);
  border: 2px solid var(--border-color);
  background: var(--bg-card);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
}

.energy-toggle.active {
  background: var(--clr-primary-500);
  border-color: var(--clr-primary-500);
  color: #fff;
}

.energy-toggle .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* ── Factor Graphs ────────────────────────────────────────────── */
.factor-tabs {
  display: flex;
  gap: var(--sp-xs);
  margin-bottom: var(--sp-lg);
  background: var(--clr-slate-100);
  padding: 4px;
  border-radius: var(--radius-full);
}

.dark .factor-tabs {
  background: var(--clr-slate-800);
}

.factor-tab {
  flex: 1;
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--radius-full);
  border: none;
  background: none;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
  text-align: center;
}

.factor-tab:hover { color: var(--text-primary); }

.factor-tab.active {
  background: var(--bg-card);
  color: var(--clr-primary-600);
  box-shadow: var(--shadow-sm);
}

.dark .factor-tab.active {
  background: var(--clr-slate-700);
  color: var(--clr-primary-300);
}

.graph-container {
  position: relative;
  width: 100%;
  height: 280px;
}

.graph-container canvas {
  width: 100%;
  height: 100%;
  border-radius: var(--radius-md);
}

.graph-legend {
  display: flex;
  gap: var(--sp-md);
  justify-content: center;
  flex-wrap: wrap;
  margin-top: var(--sp-md);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* Slider */
.param-slider {
  width: 100%;
  -webkit-appearance: none;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--clr-slate-200);
  outline: none;
  transition: background 0.3s;
}

.param-slider::-webkit-slider-thumb {

.specificity-card .spec-icon {
  font-size: 1.3rem;

.specificity-card p {
  font-size: 0.85rem;

.quiz-question {

  transform: translateY(-2px);
}

.dark .quiz-option:hover:not(.disabled) {

}

.quiz-option.correct {
  border-color: var(--clr-success);
  background: rgba(34,197,94,0.1);
  color: var(--clr-primary-700);
}

.quiz-option.wrong {
  border-color: var(--clr-error);
  background: rgba(239,68,68,0.08);

.quiz-option.disabled {

}

.btn-outline:hover {
  background: var(--clr-primary-50);

.btn-next {

  padding: var(--sp-md);
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-sm);
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--ease-out);
}

.drag-zone.drag-over {
  border-color: var(--clr-primary-400);
  background: var(--clr-primary-50);
}

.drag-item {
  padding: var(--sp-sm) var(--sp-md);

  background: var(--bg-card);

  font-size: 0.8rem;
  font-weight: 600;

.drag-item:active { cursor: grabbing; }

.drag-item:hover {

  box-shadow: var(--shadow-sm);
}

.drag-item.placed {

/* ── Animations ───────────────────────────────────────────────── */
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.animate-fade-in { animation: fadeIn 0.4s var(--ease-out) forwards; }
.animate-fade-up { animation: fadeInUp 0.5s var(--ease-out) forwards; }
.animate-slide-down { animation: slideDown 0.35s var(--ease-out); }
.animate-pulse { animation: pulse 2s ease-in-out infinite; }
.animate-float { animation: float 3s ease-in-out infinite; }

/* Staggered Reveals */
.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }
.stagger-5 { animation-delay: 0.25s; }
.stagger-6 { animation-delay: 0.3s; }

/* ── Tooltip ──────────────────────────────────────────────────── */
.tooltip {
  position: relative;
}

.tooltip::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  background: var(--clr-slate-800);
  color: #fff;
  font-size: 0.7rem;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s var(--ease-out);
}

.tooltip:hover::after {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* ── Responsive ───────────────────────────────────────────────── */

// ── THEME MANAGER ──────────────────────────────────────────────
const ThemeManager = {
  init() {
    let saved = null;
    try { saved = localStorage.getItem('bioApps_darkMode'); } catch(e) {}
    if (saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    this.updateBtn();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      try { if (localStorage.getItem('bioApps_darkMode') === null) {
        e.matches ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
        this.updateBtn();
      } } catch(e2) {}
    });
  },
  toggle() {
    const isDark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('bioApps_darkMode', isDark ? 'dark' : 'light'); } catch(e) {}
    this.updateBtn();
    if (App.currentChapter === 'energy') App.renderEnergy();
    if (App.currentChapter === 'factors') App.renderFactorGraph();
  },
  updateBtn() {
    const btn = document.getElementById('theme-btn');
    if (!btn) return;
    const isDark = document.documentElement.classList.contains('dark');
    btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
    btn.title = isDark ? 'Helles Design' : 'Dunkles Design';
    btn.innerHTML = isDark ? '<span class="dark-mode-icon">☀️</span>' : '<span class="dark-mode-icon">🌙</span>';
  }
};
// Shared API compatibility
window.toggleDarkMode = ThemeManager.toggle.bind(ThemeManager);

// ── PROGRESS CONTROLLER ────────────────────────────────────────
const Progress = {
  completed: new Set((() => { try { return JSON.parse(localStorage.getItem('enzyme-progress') || '[]'); } catch(e) { return []; } })()),
  markDone(id) {
    this.completed.add(id);
    try { localStorage.setItem('enzyme-progress', JSON.stringify([...this.completed])); } catch(e) {}
    this.updateUI();
  },
  getPercent() { return Math.round((this.completed.size / TOPICS_DATA.chapters.length) * 100); },
  updateUI() {
    const pct = this.getPercent();
    const bar = document.getElementById('progress-fill');
    const label = document.getElementById('progress-label');
    if (bar) bar.style.width = pct + '%';
    if (label) label.textContent = pct + '%';
    TOPICS_DATA.chapters.forEach(ch => {
      const navItem = document.getElementById('nav-' + ch.id);
      if (navItem) navItem.classList.toggle('completed', this.completed.has(ch.id));
    });
  }
};

// ── SCORING SYSTEM ─────────────────────────────────────────────
const Scoring = {
  score: (() => { try { return parseInt(localStorage.getItem('enzyme-score') || '0'); } catch(e) { return 0; } })(),
  add(pts) {
    this.score += pts;
    try { localStorage.setItem('enzyme-score', this.score); } catch(e) {}
    this.updateUI();
  },
  updateUI() {
    const el = document.getElementById('score-value');
    if (el) el.textContent = this.score;
  }
};

  // ── MECHANISM RENDER ────────────────────────────────────────
  renderMechanism() {

    content.innerHTML = `
      <div class="section-header">
        <div class="section-icon">⚙️</div>
        <div><h2 class="section-title">Wirkweise der Enzyme</h2>

        ${this.getMechSVG(0)}
      </div>

        <h3>${TOPICS_DATA.mechanismSteps[0].title}</h3>
        <p style="margin-top:var(--sp-sm);font-size:0.9rem">${TOPICS_DATA.mechanismSteps[0].desc}</p>
      </div>
      <div class="specificity-grid">
        <div class="specificity-card">
          <h4><span class="spec-icon">🔑</span> Substratspezifität</h4>
          <p>Jedes Enzym setzt nur ein bestimmtes Substrat oder eine Gruppe chemisch ähnlicher Substrate um. Die Form des aktiven Zentrums passt nur zu einem Substrat – wie ein Schlüssel nur in ein Schloss passt.</p>
        </div>
        <div class="specificity-card">
          <h4><span class="spec-icon">🎯</span> Wirkungsspezifität</h4>
          <p>Jedes Enzym katalysiert nur eine bestimmte Reaktion. Z.B. kann eine Protease Proteine spalten, aber keine Fette. Das Enzym bestimmt also nicht nur WAS, sondern auch WIE umgesetzt wird.</p>

    `;
  },

  showMechStep(idx) {
    document.querySelectorAll('#mech-controls .step-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.getElementById('mech-svg-container').innerHTML = this.getMechSVG(idx);
    const step = TOPICS_DATA.mechanismSteps[idx];
    document.getElementById('mech-desc').innerHTML = `<h3>${step.title}</h3><p style="margin-top:var(--sp-sm);font-size:0.9rem">${step.desc}</p>`;
  },

  getMechSVG(step) {
    const eC = '#166534', eFill = '#16a34a', sC = '#7c3aed', pC = '#06b6d4';
    const w = 800, h = 280;
    let svg = `<svg viewBox="0 0 ${w} ${h}" class="enzyme-svg" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${eFill}" stop-opacity="0.95"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0.75"/></linearGradient></defs>`;

    // ── GEOMETRY: enzyme = circle + V-notch on right side ──
    const cx = 300, cy = 130, R = 90;
    // Notch opening on the right – defined by 3 anchor points
    const ntY = 30;  // half-height of notch opening
    const ntD = 38;  // depth of notch (how far inward the tip goes)
    // Points on circle rim where notch begins/ends
    const nTopX = cx + Math.sqrt(R*R - ntY*ntY);
    const nTopY = cy - ntY;
    const nBotX = nTopX;
    const nBotY = cy + ntY;
    // Tip of notch (deepest point)
    const nTipX = nTopX - ntD;
    const nTipY = cy;

    // Enzyme body path: full circle except the notch wedge
    const enzymePath = [
      `M ${nTopX} ${nTopY}`,                       // start at top of notch
      `A ${R} ${R} 0 1 0 ${nBotX} ${nBotY}`,       // big arc all the way around to bottom of notch
      `L ${nTipX} ${nTipY}`,                        // line inward to notch tip
      `Z`                                           // close back to nTop
    ].join(' ');

    // Substrate path – exact complement of the notch!
    // The left tip matches nTipX/nTipY, top-left matches nTopX/nTopY, bottom-left matches nBotX/nBotY
    // Then a rectangular body extends to the right
    const subBody = 45; // width of rectangular portion to the right
    const subDocked = (dx) => [
      `M ${nTipX + dx} ${nTipY}`,                           // left tip
      `L ${nTopX + dx} ${nTopY}`,                           // top-left corner (matches notch opening)
      `L ${nTopX + dx + subBody} ${nTopY}`,                 // top-right corner
      `L ${nTopX + dx + subBody} ${nBotY}`,                 // bottom-right corner
      `L ${nBotX + dx} ${nBotY}`,                           // bottom-left corner (matches notch opening)
      `Z`                                                    // close back to tip
    ].join(' ');

    // Substrate floating (offset to the right)
    const subFloat = (fx) => [
      `M ${nTipX + fx} ${nTipY}`,
      `L ${nTopX + fx} ${nTopY}`,
      `L ${nTopX + fx + subBody} ${nTopY}`,
      `L ${nTopX + fx + subBody} ${nBotY}`,
      `L ${nBotX + fx} ${nBotY}`,
      `Z`
    ].join(' ');

    if (step === 0) {
      // Enzyme with notch, substrate floating to the right
      svg += `<path d="${enzymePath}" fill="url(#eg)" stroke="${eFill}" stroke-width="2"/>`;
      // "Enzym" label inside the body (left half)
      svg += `<text x="${cx - 25}" y="${cy + 6}" fill="${eC}" font-size="16" font-weight="700" font-family="Outfit">Enzym</text>`;
      // "Aktives Zentrum" label – with leader line pointing to notch
      svg += `<line x1="${nTipX + 5}" y1="${cy - 45}" x2="${nTipX + 2}" y2="${nTipY - 5}" stroke="${eFill}" stroke-width="1.2" stroke-dasharray="3,2"/>`;
      svg += `<text x="${nTipX + 8}" y="${cy - 52}" fill="${eC}" font-size="11" font-weight="600" font-family="Outfit">Aktives Zentrum</text>`;
      // Substrate floating 120px to the right of the notch
      const off = 120;
      svg += `<path d="${subFloat(off)}" fill="${sC}" opacity="0.88"><animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/></path>`;
      svg += `<text x="${nTopX + off + 4}" y="${cy + 5}" fill="white" font-size="12" font-weight="700" font-family="Outfit">Substrat</text>`;
      // Animated arrow showing approach
      const arrStart = nTopX + off - 8;
      const arrEnd = nTopX + 15;
      svg += `<line x1="${arrStart}" y1="${cy}" x2="${arrEnd}" y2="${cy}" stroke="${sC}" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>`;
      svg += `<polygon points="${arrEnd},${cy-5} ${arrEnd-10},${cy} ${arrEnd},${cy+5}" fill="${sC}" opacity="0.7"/>`;

    } else if (step === 1) {
      // Substrate precisely docked (dx = 1 for 1px gap)
      svg += `<path d="${enzymePath}" fill="url(#eg)" stroke="${eFill}" stroke-width="2"/>`;
      svg += `<path d="${subDocked(1)}" fill="${sC}" opacity="0.92" stroke="${sC}" stroke-width="1"/>`;
      svg += `<text x="${nTopX + 6}" y="${cy + 5}" fill="white" font-size="11" font-weight="700" font-family="Outfit">Substrat</text>`;
      svg += `<text x="${cx - 25}" y="${cy + 6}" fill="${eC}" font-size="16" font-weight="700" font-family="Outfit">Enzym</text>`;
      svg += `<text x="${cx + 10}" y="${cy + R + 30}" fill="${eFill}" font-size="14" font-weight="700" font-family="Outfit" text-anchor="middle">Enzym-Substrat-Komplex</text>`;

    } else if (step === 2) {
      // Catalysis – pulsing
      svg += `<path d="${enzymePath}" fill="url(#eg)" stroke="${eFill}" stroke-width="2"><animate attributeName="opacity" values="1;0.7;1" dur="0.8s" repeatCount="indefinite"/></path>`;
      svg += `<path d="${subDocked(1)}" fill="${sC}" opacity="0.75"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.6s" repeatCount="indefinite"/></path>`;
      svg += `<text x="${cx - 25}" y="${cy + 6}" fill="${eC}" font-size="16" font-weight="700" font-family="Outfit">Enzym</text>`;
      // Energy sparks around the notch area
      svg += `<circle cx="${nTopX+8}" cy="${nTopY-12}" r="4" fill="#fbbf24"><animate attributeName="r" values="2;7;2" dur="0.5s" repeatCount="indefinite"/></circle>`;
      svg += `<circle cx="${nBotX+12}" cy="${nBotY+8}" r="3" fill="#fbbf24"><animate attributeName="r" values="1;6;1" dur="0.7s" repeatCount="indefinite"/></circle>`;

  renderEnergy() {
    const content = document.getElementById('content-area');
    content.innerHTML = `

      <div class="card" style="margin-top:var(--sp-lg)"><h3>Was passiert?</h3><p style="font-size:0.85rem;margin-top:var(--sp-sm)">Das Enzym stabilisiert den Übergangszustand. Die <strong>Aktivierungsenergie (E<sub>A</sub>)</strong> wird gesenkt, die <strong>Reaktionsenergie (ΔE<sub>i</sub>)</strong> bleibt gleich. E<sub>i</sub>(E) = innere Energie der Edukte, E<sub>i</sub>(P) = innere Energie der Produkte.</p></div>

  },
  drawEnergyDiagram() {
    const canvas = document.getElementById('energy-canvas');
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const isDark = document.documentElement.classList.contains('dark');
    const textCol = isDark ? '#c0e0c0' : '#334155';
    const axisCol = isDark ? '#4a6a4a' : '#b0bec5';
    const bgCol   = isDark ? '#1a2e1a' : '#fafff5';

    // Background
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, W, H);

    // Layout with generous margins
    const L = 80, T = 45, R = W - 40, B = H - 55;
    const gW = R - L, gH = B - T;

    // Key Y-positions (pixel coords, lower = higher energy on screen)
    const eduktY   = B - gH * 0.28;   // Ei(E) level
    const produktY = B - gH * 0.10;   // Ei(P) level
    const peakHigh = T + gH * 0.05;   // peak without enzyme
    const peakLow  = T + gH * 0.38;   // peak with enzyme

    // ── AXES ──
    ctx.strokeStyle = axisCol; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(L, T - 10); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
    // Arrowheads on axes
    ctx.beginPath(); ctx.moveTo(L - 4, T); ctx.lineTo(L, T - 10); ctx.lineTo(L + 4, T); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R - 4, B - 4); ctx.lineTo(R, B); ctx.lineTo(R - 4, B + 4); ctx.stroke();

    // Axis labels
    ctx.fillStyle = textCol; ctx.font = '13px Outfit'; ctx.textAlign = 'center';
    ctx.fillText('Reaktionsverlauf', (L + R) / 2, H - 12);
    ctx.save(); ctx.translate(20, (T + B) / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('Energie', 0, 0); ctx.restore();

    // ── Grid Lines (Subtle solid lines) ──
    ctx.strokeStyle = isDark ? '#2a3a2a' : '#f1f5f9'; 
    ctx.lineWidth = 1; ctx.setLineDash([]);
    const gridCount = 6;
    for (let i = 0; i <= gridCount; i++) {
      let gy = T + (gH * i / gridCount);
      ctx.beginPath(); ctx.moveTo(L, gy); ctx.lineTo(R, gy); ctx.stroke();
    }

    // ── Eᵢ(E) and Eᵢ(P) solid horizontal level lines ──
    ctx.strokeStyle = isDark ? '#507050' : '#cbd5e1'; 
    ctx.lineWidth = 2; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(L, eduktY); ctx.lineTo(R, eduktY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L, produktY); ctx.lineTo(R, produktY); ctx.stroke();

    // Level Labels (Eᵢ)
    ctx.fillStyle = textCol; ctx.font = 'bold 12px Outfit'; ctx.textAlign = 'right';
    ctx.fillText('Eᵢ(E)', L - 8, eduktY + 5);
    ctx.textAlign = 'left';
    ctx.fillText('Eᵢ(P)', R + 8, produktY + 5);
    
    // States Labels (Edukte/Produkte)
    ctx.textAlign = 'left'; ctx.font = 'bold 12px Outfit';
    ctx.fillText('Edukte', L + 10, eduktY - 10);
    ctx.textAlign = 'right';
    ctx.fillText('Produkte', R - 10, produktY - 10);

    // ── Curve helper (returns exact peak coordinates) ──
    const drawCurve = (peakY, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash([]);
      ctx.beginPath();
      let best = { x: 0, y: 9999 };
      // Higher resolution for peak detection
      const steps = 500;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = L + t * gW;
        const base = eduktY + (produktY - eduktY) * t;
        const bump = Math.sin(t * Math.PI) * (eduktY - peakY);
        const y = base - bump;
        if (y < best.y) { best.y = y; best.x = x; }
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      return best;
    };

    // ── Draw curves and get their peaks ──
    const p1 = drawCurve(peakHigh, '#ef4444');  // ohne Enzym
    let p2 = null;
    if (this.energyShowEnzyme) p2 = drawCurve(peakLow, '#22c55e');

    // ── EA arrow helper ──
    const drawEA = (peakX, peakY, label, color, labelOffset) => {
      // Vertical line from base level to curve peak
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
      ctx.beginPath(); ctx.moveTo(peakX, eduktY); ctx.lineTo(peakX, peakY); ctx.stroke();
      
      // Top/Bottom ticks
      ctx.setLineDash([]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(peakX - 5, eduktY); ctx.lineTo(peakX + 5, eduktY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(peakX - 5, peakY); ctx.lineTo(peakX + 5, peakY); ctx.stroke();
      
      // Arrowhead EXACTLY at peakY
      ctx.beginPath();
      ctx.moveTo(peakX - 4, peakY + 8); ctx.lineTo(peakX, peakY); ctx.lineTo(peakX + 4, peakY + 8);
      ctx.stroke();
      
      // Label
      ctx.fillStyle = color; ctx.font = 'bold 12px Outfit'; ctx.textAlign = 'left';
      ctx.fillText(label, peakX + 10, (eduktY + peakY) / 2 + labelOffset);
    };

    // Draw EA arrows
    drawEA(p1.x, p1.y, 'Eᴀ ohne Enzym', '#ef4444', 0);
    if (this.energyShowEnzyme) {
      drawEA(p2.x, p2.y, 'Eᴀ mit Enzym', '#22c55e', 4);
    }

    // ── ΔEᵢ bracket (Reaction energy) ──
    const dX = L + gW * 0.78;
    ctx.strokeStyle = isDark ? '#7aa07a' : '#64748b'; ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 2]);
    ctx.beginPath(); ctx.moveTo(dX, eduktY); ctx.lineTo(dX, produktY); ctx.stroke();
    ctx.setLineDash([]);
    // Bracket ends
    ctx.beginPath(); ctx.moveTo(dX - 4, eduktY); ctx.lineTo(dX + 4, eduktY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dX - 4, produktY); ctx.lineTo(dX + 4, produktY); ctx.stroke();
    // Pointing down
    ctx.beginPath(); ctx.moveTo(dX - 3, produktY - 6); ctx.lineTo(dX, produktY); ctx.lineTo(dX + 3, produktY - 6); ctx.stroke();
    
    ctx.fillStyle = isDark ? '#7aa07a' : '#64748b'; ctx.font = 'bold 12px Outfit'; ctx.textAlign = 'left';
    ctx.fillText('ΔEᵢ', dX + 8, (eduktY + produktY) / 2 + 5);
  },

  currentFactor: 'temp',

  renderFactors() {

  renderFactorInfo() {

  renderFactorGraph() {
    const canvas = document.getElementById('factor-canvas');
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    const isDark = document.documentElement.classList.contains('dark');
    ctx.fillStyle = isDark ? '#1a2e1a' : '#fafff5'; ctx.fillRect(0, 0, w, h);
    const mx = 60, my = 30, bx = w - 30, by = h - 50, rw = bx - mx, rh = by - my;
    ctx.strokeStyle = isDark ? '#4a6a4a' : '#94a3b8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx, by); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = isDark ? '#a0c0a0' : '#475569'; ctx.font = '12px Outfit'; ctx.textAlign = 'center';
    const labels = { temp: ['Temperatur (°C)', '0', '20', '37', '60', '80'], ph: ['pH-Wert', '1', '3', '5', '7', '9', '11'], substrate: ['Substratkonzentration [S]', '0', '', '', '', 'hoch'] };
    const lb = labels[this.currentFactor];
    ctx.fillText(lb[0], (mx + bx) / 2, h - 10);
    ctx.save(); ctx.translate(15, (my + by) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('Reaktionsgeschwindigkeit', 0, 0); ctx.restore();
    // Draw ticks
    ctx.font = '10px DM Sans'; ctx.textAlign = 'center';
    for (let i = 1; i < lb.length; i++) {
      const x = mx + ((i - 1) / (lb.length - 2)) * rw;
      ctx.fillText(lb[i], x, by + 18);
    }
    // Draw curve
    ctx.lineWidth = 3; ctx.setLineDash([]);
    if (this.currentFactor === 'temp') {
      // Bell curve peaking at ~37°C (0.4625 of range 0-80)
      ctx.strokeStyle = '#ef4444';
      ctx.beginPath();
      for (let t = 0; t <= 1; t += 0.005) {
        const x = mx + t * rw;
        // Asymmetric bell: rises slowly, drops fast after optimum
        const opt = 0.4625;
        let y;
        if (t <= opt) { y = Math.pow(t / opt, 1.8); } else { const d = (t - opt) / (1 - opt); y = Math.exp(-4 * d * d); }
        const py = by - y * rh * 0.85;
        t === 0 ? ctx.moveTo(x, py) : ctx.lineTo(x, py);
      }
      ctx.stroke();
      // Optimum line
      const optX = mx + 0.4625 * rw;
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(optX, my); ctx.lineTo(optX, by); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = '#22c55e'; ctx.font = 'bold 11px Outfit';
      ctx.fillText('Optimum (37°C)', optX, my - 5);
      // Denaturierung zone
      ctx.fillStyle = 'rgba(239,68,68,0.08)';
      ctx.fillRect(mx + 0.6 * rw, my, rw * 0.4, rh);
      ctx.fillStyle = '#ef4444'; ctx.font = '10px Outfit';
      ctx.fillText('Denaturierung', mx + 0.8 * rw, my + 20);
    } else if (this.currentFactor === 'ph') {
      // Show 2 enzymes with different optima
      const curves = [
        { name: 'Pepsin (Magen)', opt: 0.1, color: '#ef4444', sigma: 0.08 },
        { name: 'Amylase (Speichel)', opt: 0.6, color: '#22c55e', sigma: 0.12 },
        { name: 'Trypsin (Darm)', opt: 0.8, color: '#3b82f6', sigma: 0.1 }
      ];
      curves.forEach(c => {
        ctx.strokeStyle = c.color; ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let t = 0; t <= 1; t += 0.005) {
          const x = mx + t * rw;
          const y = Math.exp(-Math.pow(t - c.opt, 2) / (2 * c.sigma * c.sigma));
          const py = by - y * rh * 0.85;
          t === 0 ? ctx.moveTo(x, py) : ctx.lineTo(x, py);
        }
        ctx.stroke();
        ctx.fillStyle = c.color; ctx.font = 'bold 10px Outfit'; ctx.textAlign = 'left';
        ctx.fillText(c.name, mx + c.opt * rw - 20, by - rh * 0.85 - 8);
      });
    } else {
      // Michaelis-Menten saturation curve
      ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let t = 0; t <= 1; t += 0.005) {
        const x = mx + t * rw;
        const y = t / (t + 0.15); // Michaelis-Menten-like
        const py = by - y * rh * 0.85;
        t === 0 ? ctx.moveTo(x, py) : ctx.lineTo(x, py);
      }
      ctx.stroke();
      // Vmax line
      const vmaxY = by - 0.85 * rh * (1 / 1.15);
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(mx, vmaxY); ctx.lineTo(bx, vmaxY); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 11px Outfit'; ctx.textAlign = 'right';
      ctx.fillText('Vmax (Sättigung)', bx - 5, vmaxY - 8);
      // Km
      const km = 0.15; const kmX = mx + km * rw; const kmY = by - (km / (km + 0.15)) * rh * 0.85;
      ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(kmX, by); ctx.lineTo(kmX, kmY); ctx.lineTo(mx, kmY); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = '#64748b'; ctx.font = '10px Outfit'; ctx.textAlign = 'center';
      ctx.fillText('Km', kmX, by + 18);
      ctx.textAlign = 'right'; ctx.fillText('½ Vmax', mx - 5, kmY + 4);
    }
  },

      <div id="quiz-feedback"></div>`;
  },
  answerQuiz(idx) {
    if (this.quizLocked) return;
    this.quizLocked = true;
    const q = TOPICS_DATA.quizQuestions[this.quizIdx];
    const isCorrect = idx === q.correct;
    this.quizAnswers.push(isCorrect);

    // Mark options
    document.querySelectorAll('.quiz-option').forEach((el, i) => {
      el.classList.add('disabled');
      if (i === q.correct) el.classList.add('correct');
      else if (i === idx && !isCorrect) el.classList.add('wrong');
    });
    const fb = document.getElementById('quiz-feedback');
    fb.innerHTML = `<div class="quiz-feedback ${isCorrect ? 'correct' : 'wrong'}">

        <div class="results-score">${correct}/${total}</div>
        <div class="results-stars">${stars}</div>
        <h3>${pct >= 90 ? 'Fantastisch!' : pct >= 70 ? 'Gut gemacht!' : pct >= 50 ? 'Nicht schlecht!' : 'Weiter üben!'}</h3>
        <p style="color:var(--text-secondary);margin-top:var(--sp-sm);font-size:0.9rem">${pct}% der Fragen richtig beantwortet</p>
        <button class="btn btn-primary" style="margin-top:var(--sp-lg)" onclick="App.renderMinigame()">🔄 Nochmal spielen</button>
      </div>`;
  }
};

// ── BOOT ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => App.init());
window.addEventListener('resize', () => {
  if (App.currentChapter === 'energy') App.drawEnergyDiagram();
  if (App.currentChapter === 'factors') App.renderFactorGraph();
});

  </script>
</body>
