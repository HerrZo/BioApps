<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzyme – Biologie Lern-App</title>
  <meta name="description" content="Interaktive Lern-App über Enzyme: Geschichte, Aufbau, Wirkweise, Energetik und Einflussfaktoren.">
  <meta name="theme-color" content="#166534">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile Menu Button -->
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menü öffnen">☰</button>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            <path d="M8 12c0-2 1-4 4-4s4 2 4 4-1 4-4 4-4-2-4-4z" fill="currentColor" opacity="0.3"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
          <span>Enzyme</span>
        </a>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Navigation items rendered by JS -->
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-btn" onclick="ThemeManager.toggle()">
          🌙 Dark
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <span class="top-bar-title" id="top-bar-title">📜 Geschichte der Enzyme</span>
        <div class="top-bar-right">
          <div class="progress-container">
            <div class="progress-bar-wrapper">
              <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <span class="progress-label" id="progress-label">0%</span>
          </div>
          <div class="score-badge">
            <span>⭐</span>
            <span id="score-value">0</span>
          </div>
        </div>
      </header>

      <!-- Dynamic Content Area -->
      <div class="content-area" id="content-area" style="transition: opacity 0.2s ease">
        <!-- Content rendered by JavaScript -->
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
