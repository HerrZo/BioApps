})=>u.jsxs("svg",{className:e,fill:"none",stroke:"currentColor",strokeWidth:"2",viewBox:"0 0 24 24",children:[u.jsx("circle",{cx:"12",cy:"12",r:"10"}),u.jsx("polyline",{points:"12 6 12 12 16 14"})]}),Dn=[{id:"antike",title:"Antike Naturphilosophie",shortTitle:"Antike",period:"~384 v. Chr. – frühes 19. Jh.",context:"Von der griechischen Antike bis zur Aufklärung versuchten Gelehrte, die Vielfalt des Lebens zu ordnen und zu erklären. Aristoteles schuf die erste systematische Klassifikation, Linné formalisierte die binäre Nomenklatur, und Cuvier begründete die vergleichende Anatomie. Gemeinsam war ihnen die Annahme der Konstanz der Arten.",color:"amber",colorLight:"bg-amber-50",colorDark:"bg-amber-700",colorBorder:"border-amber-200",coreIdeas:[{title:"Scala Naturae",desc:"Aristoteles ordnete alle Lebewesen in eine lineare Stufenleiter vom Einfachen zum Komplexen – von Mineralien über Pflanzen und Tiere bis zum Menschen."},{title:"Konstanz der Arten",desc:"Arten galten als unveränderlich und von Anfang an in ihrer heutigen Form erschaffen (Fixismus)."},{title:"Binäre Nomenklatur",desc:"Carl von Linné führte das bis heute gültige System der Doppelnamen ein (Gattung + Art), z. B. Homo sapiens."},{title:"Katastrophismus",desc:"Georges Cuvier erklärte das Aussterben von Arten durch wiederkehrende Naturkatastrophen, nach denen Neubesiedlung stattfand."},{title:"Teleologie",desc:"Die Natur wurde als zweckgerichtet betrachtet – jede Struktur hat einen von der Natur oder einem Schöpfer vorgesehenen Zweck."}],representatives:[{name:"Aristoteles",years:"384–322 v. Chr.",contribution:"Begründer der systematischen Biologie, Scala Naturae, erste vergleichende Anatomie"},{name:"Carl von Linné",years:"1707–1778",contribution:"Binäre Nomenklatur, hierarchisches Klassifikationssystem (Reich, Klasse, Ordnung, Gattung, Art)"},{name:"Georges Cuvier",years:"1769–1832",contribution:"Vergleichende Anatomie, Paläontologie, Katastrophentheorie"}],weaknesses:["Die Annahme der Artenkonstanz konnte die Fossilfunde nicht erklären – warum existieren ausgestorbene Formen?","Die Scala Naturae ist linear und kann Verwandtschaftsbeziehungen nicht darstellen.","Katastrophismus konnte die graduellen Übergänge in Fossilschichten nicht erklären.","Teleologisches Denken verhinderte die Suche nach mechanistischen Ursachen.","Das System konnte die Ähnlichkeit zwischen verschiedenen Arten (Homologien) nicht erklären."],legacy:["Linnés Klassifikationssystem wird bis heute (in erweiterter Form) weltweit verwendet.","Cuviers vergleichende Anatomie ist eine Grundlage der modernen Paläontologie.","Die Idee der systematischen Ordnung der Natur war Voraussetzung für das Erkennen evolutionärer Muster."],quiz:[{question:"Was versteht man unter der Scala Naturae?",options:["Ein Messgerät für Biodiversität","Eine lineare Stufenleiter aller Lebewesen","Ein Stammbaum der Arten","Eine geologische Zeitskala"],correct:1,explanation:"Die Scala Naturae (Stufenleiter des Seins) ordnet alle Lebewesen linear vom Einfachen zum Komplexen – von Mineralien bis zum Menschen."},{question:"Wer führte die binäre Nomenklatur ein?",options:["Aristoteles","Cuvier","Linné","Darwin"],correct:2,explanation:"Carl von Linné führte im 18. Jahrhundert die binäre Nomenklatur ein, bei der jede Art einen Doppelnamen aus Gattung und Art erhält."},{question:"Was besagt der Katastrophismus?",options:["Arten entwickeln sich langsam weiter","Naturkatastrophen führen zum Aussterben von Arten","Alle Arten existieren seit Anbeginn","Die Erde ist erst wenige tausend Jahre alt"],correct:1,explanation:"Cuvier erklärte das Aussterben von Fossilarten durch wiederkehrende Naturkatastrophen, nach denen Neubesiedlung aus anderen Regionen stattfand."}]},{id:"lamarck",title:"Lamarckismus",shortTitle:"Lamarck",period:"1809",context:'Jean-Baptiste de Lamarck veröffentlichte 1809 seine „Philosophie zoologique" und formulierte damit die erste umfassende Evolutionstheorie. Er erkannte, dass Arten sich im Laufe der Zeit verändern, erklärte den Mechanismus jedoch über die Vererbung erworbener Eigenschaften – eine Idee, die heute weitgehend widerlegt ist.',color:"orange",colorLight:"bg-orange-50",colorDark:"bg-orange-700",colorBorder:"border-orange-200",coreIdeas:[{title:"Vererbung erworbener Eigenschaften",desc:"Veränderungen, die ein Organismus während seines Lebens erwirbt (z. B. stärkere Muskeln), werden an die Nachkommen weitergegeben."},{title:"Gebrauch und Nichtgebrauch",desc:"Organe, die häufig genutzt werden, verstärken sich; nicht genutzte Organe verkümmern über Generationen (z. B. der lange Giraffenhals)."},{title:"Innerer Vervollkommnungstrieb",desc:"Lamarck nahm an, dass Organismen einen inneren Drang haben, sich von einfach zu komplex zu entwickeln."},{title:"Anpassung an die Umwelt",desc:"Organismen reagieren aktiv auf Umweltveränderungen und passen sich zielgerichtet an."},{title:"Artenwandel statt Artenkonstanz",desc:"Erstmals wurde die Veränderlichkeit der Arten als wissenschaftliches Konzept formuliert – ein revolutionärer Bruch mit dem Fixismus."}],representatives:[{name:"Jean-Baptiste de Lamarck",years:"1744–1829",contribution:"Erste zusammenhängende Evolutionstheorie, Philosophie zoologique (1809)"},{name:"Étienne Geoffroy Saint-Hilaire",years:"1772–1844",contribution:"Unterstützer Lamarcks, betonte die Einheit des Bauplans aller Wirbeltiere"}],weaknesses:["Die Vererbung erworbener Eigenschaften konnte experimentell nie bestätigt werden (z. B. Weismanns Schwanzexperiment bei Mäusen).","Der innere Vervollkommnungstrieb ist teleologisch und wissenschaftlich nicht fassbar.","Lamarck konnte nicht erklären, warum es weiterhin einfache Organismen gibt.","Die Genetik (Mendel, später Molekularbiologie) zeigte, dass nur Keimbahnmutationen vererbt werden.","Die Theorie erklärt nicht, wie neue Strukturen erstmals entstehen – nur wie bestehende sich verändern."],legacy:["Lamarck war der Erste, der eine kohärente Evolutionstheorie formulierte – ein Paradigmenwechsel.","Epigenetik zeigt heute, dass Umwelteinflüsse tatsächlich die Genexpression beeinflussen können – eine teilweise Rehabilitation.","Die Betonung der Anpassung an die Umwelt war ein richtiger Grundgedanke, nur der Mechanismus war falsch."],quiz:[{question:"Was ist die zentrale Idee des Lamarckismus?",options:["Natürliche Selektion","Vererbung erworbener Eigenschaften","Genetische Drift","Artenkonstanz"],correct:1,explanation:"Lamarck nahm an, dass Organismen Eigenschaften, die sie im Laufe ihres Lebens erwerben, an ihre Nachkommen vererben."},{question:"Wie erklärt Lamarck den langen Hals der Giraffe?",options:["Zufällige Mutation und Selektion","Ständiges Recken über Generationen führt zu längerem Hals","Giraffen mit langem Hals überleben besser","Genetische Drift in kleinen Populationen"],correct:1,explanation:"Nach Lamarck streckten Giraffen ihre Hälse, um an hohe Blätter zu gelangen, und gaben den verlängerten Hals an ihre Nachkommen weiter."},{question:"Warum gilt Lamarcks Mechanismus heute als widerlegt?",options:["Weil es keine Evolution gibt","Weil nur Keimbahnmutationen vererbt werden","Weil Giraffen kurze Hälse haben","Weil Cuvier ihn widerlegte"],correct:1,explanation:"Die moderne Genetik zeigt, dass nur Veränderungen in der DNA der Keimzellen (Keimbahnmutationen) an Nachkommen weitergegeben werden."}]},{id:"darwin",title:"Darwinismus",shortTitle:"Darwin",period:"1859",context:'Charles Darwin veröffentlichte 1859 „On the Origin of Species" und revolutionierte damit die Biologie. Basierend auf seinen Beobachtungen während der Beagle-Reise (1831–1836) formulierte er die Theorie der natürlichen Selektion als Mechanismus der Evolution. Alfred Russel Wallace entwickelte unabhängig ähnliche Ideen.',color:"green",colorLight:"bg-green-50",colorDark:"bg-green-700",colorBorder:"border-green-200",coreIdeas:[{title:"Natürliche Selektion",desc:"Individuen mit vorteilhaften Eigenschaften haben höhere Überlebens- und Fortpflanzungschancen. Diese Eigenschaften werden häufiger an die nächste Generation weitergegeben."},{title:"Variation",desc:"Innerhalb einer Population gibt es natürliche Variation. Individuen unterscheiden sich in ihren Merkmalen – Grundlage für Selektion."},{title:"Struggle for Existence",desc:"Mehr Individuen werden geboren, als überleben können. Es entsteht ein Wettbewerb um begrenzte Ressourcen."},{title:"Abstammung mit Modifikation",desc:"Alle Lebewesen stammen von gemeinsamen Vorfahren ab und haben sich durch schrittweise Veränderungen diversifiziert (Deszendenztheorie)."},{title:"Sexuelle Selektion",desc:"Neben natürlicher Selektion treiben auch Partnerwahl und Konkurrenz um Paarungspartner die Evolution an (z. B. Pfauenrad)."}],representatives:[{name:"Charles Darwin",years:"1809–1882",contribution:"Natürliche Selektion, On the Origin of Species (1859), Deszendenztheorie"},{name:"Alfred Russel Wallace",years:"1823–1913",contribution:"Unabhängige Entdeckung der natürlichen Selektion, Biogeographie"},{name:"Thomas H. Huxley",years:"1825–1895",contribution:'„Darwins Bulldogge" – wichtigster Verteidiger der Evolutionstheorie'}],weaknesses:["Darwin kannte den Mechanismus der Vererbung nicht – er wusste nicht, wie Variation entsteht und weitergegeben wird.",'Seine Theorie der „Pangenesis" (Vererbungstheorie) war falsch.',"Gradualismus konnte nicht alle Muster im Fossilbericht erklären (fehlende Übergangsformen).",`Die Frage, wie Variation aufrechterhalten wird (Jenkin's „Blending Inheritance"-Einwand), blieb ungelöst.`,"Altruismus und Kooperation zwischen Individuen waren schwer zu erklären."],legacy:["Die natürliche Selektion ist bis heute der zentrale Mechanismus der Evolutionsbiologie.","Die Deszendenztheorie (gemeinsame Abstammung) ist durch DNA-Analysen vielfach bestätigt.","Darwins Arbeitsweise – lange Datensammlung, sorgfältige Argumentation – gilt als Vorbild wissenschaftlicher Methodik.",'Die Evolutionstheorie vereint alle biologischen Disziplinen (Dobzhansky: „Nichts in der Biologie ergibt Sinn außer im Licht der Evolution").'],quiz:[{question:"Was ist natürliche Selektion?",options:["Gezielte Zucht durch den Menschen","Überleben und Fortpflanzung der am besten Angepassten","Vererbung erworbener Eigenschaften","Zufällige Veränderung der DNA"],correct:1,explanation:'Natürliche Selektion beschreibt, dass Individuen mit vorteilhaften Eigenschaften häufiger überleben und sich fortpflanzen – „Survival of the Fittest".'},{question:"Was beobachtete Darwin auf den Galápagos-Inseln?",options:["Identische Arten auf allen Inseln","Unterschiedliche Finkenarten mit angepassten Schnäbeln","Fossilien von Dinosauriern","Identische Pflanzen wie in England"],correct:1,explanation:"Darwin beobachtete, dass Finken auf verschiedenen Inseln unterschiedliche Schnabelformen hatten, angepasst an die jeweilige Nahrungsquelle."},{question:"Welches Problem hatte Darwins Theorie?",options:["Er kannte keine natürliche Selektion","Er verstand den Vererbungsmechanismus nicht","Er glaubte an Artenkonstanz","Er hatte keine Beobachtungen"],correct:1,explanation:"Darwin kannte Mendels Vererbungsgesetze nicht und konnte nicht erklären, wie Variation entsteht und erhalten bleibt."}]},{id:"synthese",title:"Synthetische Evolutionstheorie",shortTitle:"Synthese",period:"1930er–1950er",context:"Die Synthetische Evolutionstheorie (Moderne Synthese) vereinte ab den 1930er Jahren Darwins Selektionstheorie mit der Mendelschen Genetik, Populationsgenetik, Paläontologie und Systematik zu einem umfassenden Rahmenwerk. Sie ist bis heute die Grundlage der modernen Evolutionsbiologie, wird aber durch neue Erkenntnisse (Epigenetik, Evo-Devo) erweitert.",color:"blue",colorLight:"bg-blue-50",colorDark:"bg-blue-700",colorBorder:"border-blue-200",coreIdeas:[{title:"Mutation als Variationsquelle",desc:"Zufällige Mutationen in der DNA erzeugen die genetische Variation, auf der Selektion wirken kann."},{title:"Populationsdenken",desc:"Evolution findet in Populationen statt, nicht bei Einzelindividuen. Die Veränderung der Allelfrequenzen über Generationen ist Evolution."},{title:"Natürliche Selektion + Genetik",desc:"Die Verknüpfung von Darwins Selektionstheorie mit Mendels Vererbungsgesetzen erklärt, wie vorteilhafte Merkmale weitergegeben werden."},{title:"Genetische Drift",desc:"Zufällige Veränderungen der Allelfrequenzen, besonders in kleinen Populationen, sind ein weiterer Evolutionsfaktor neben Selektion."},{title:"Artbildung durch Isolation",desc:"Geografische oder reproduktive Isolation führt zur Aufspaltung von Populationen und schließlich zur Bildung neuer Arten (Speziation)."}],representatives:[{name:"Theodosius Dobzhansky",years:"1900–1975",contribution:"Genetics and the Origin of Species (1937) – Brücke zwischen Genetik und Evolution"},{name:"Ernst Mayr",years:"1904–2005",contribution:"Biologisches Artkonzept, allopatrische Artbildung, Populationsdenken"},{name:"Julian Huxley",years:"1887–1975",contribution:'Prägte den Begriff „Moderne Synthese" in Evolution: The Modern Synthesis (1942)'},{name:"Ronald Fisher / J. B. S. Haldane / Sewall Wright",years:"frühes 20. Jh.",contribution:"Mathematische Populationsgenetik – quantitative Modelle der Evolution"}],weaknesses:["Epigenetische Vererbung (Methylierung, Histonmodifikation) wurde nicht berücksichtigt.","Horizontaler Gentransfer (besonders bei Bakterien) passt nicht ins klassische Modell.","Evo-Devo zeigt, dass Veränderungen in der Genregulation wichtiger sein können als Mutationen in Strukturgenen.","Neutrale Evolution (Kimura) – viele Mutationen sind weder vorteilhaft noch nachteilig.","Die Extended Evolutionary Synthesis erweitert das Rahmenwerk um Nischenkonstruktion, Plastizität und kulturelle Evolution."],legacy:["Bildet bis heute das Fundament der Evolutionsbiologie und wird ständig durch neue Erkenntnisse erweitert.","Populationsgenetische Modelle sind Grundlage der medizinischen Genetik, Züchtung und Naturschutzbiologie.","Die Integration verschiedener Disziplinen bleibt methodisches Vorbild für interdisziplinäre Wissenschaft.","DNA-Sequenz
