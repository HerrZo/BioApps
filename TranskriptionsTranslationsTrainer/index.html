<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transkriptions & Translations Trainer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
                400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
                800: '#115e59', 900: '#134e4a',
              }
            }
          }
        }
      }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }

        @keyframes ribosomeSlide {
            from { transform: translateX(var(--from-x, 0)); }
            to   { transform: translateX(0); }
        }
        .ribosome-slide { animation: ribosomeSlide 0.4s cubic-bezier(.22,.61,.36,1) forwards; }

        @keyframes tRNADock {
            0%   { opacity: 0; transform: translateY(-18px) scale(0.8); }
            60%  { opacity: 1; transform: translateY(4px) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .trna-dock { animation: tRNADock 0.5s ease-out forwards; }

        @keyframes tRNALeave {
            0%   { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-22px) scale(0.7); }
        }
        .trna-leave { animation: tRNALeave 0.35s ease-in forwards; }

        @keyframes chainGrow {
            from { opacity: 0; transform: scaleY(0); transform-origin: top center; }
            to   { opacity: 1; transform: scaleY(1); }
        }
        .chain-grow { animation: chainGrow 0.3s ease-out forwards; }

        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }
        .timer-pulse { animation: timerPulse 0.6s ease-in-out infinite; }

        @keyframes tooltipIn {
            from { opacity: 0; transform: translateY(4px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .tooltip-in { animation: tooltipIn 0.2s ease-out forwards; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-4px); }
            40%       { transform: translateX(4px); }
            60%       { transform: translateX(-3px); }
            80%       { transform: translateX(3px); }
        }
        .shake { animation: shake 0.35s ease-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen overflow-hidden selection:bg-teal-200">

    <div id="root" class="h-full flex items-center justify-center">Lade App...</div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─────────────────────────────────────────────
        //  ICONS
        // ─────────────────────────────────────────────
        const IconDna = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 15c6.667-6 13.333 0 20-6"/>
                <path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/>
                <path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/>
                <path d="m17 6-2.5-2.5"/><path d="m14 8-1-1"/>
                <path d="m7 18 2.5 2.5"/><path d="m3.5 14.5.5.5"/>
                <path d="m20 9 .5.5"/><path d="m6.5 12.5 1 1"/>
                <path d="m16.5 10.5 1 1"/><path d="m10 16 1.5 1.5"/>
            </svg>
        );
        const IconRefresh = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
        );
        const IconTimer = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
        );
        const IconReverse = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m9 14-4-4 4-4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/>
            </svg>
        );

        // ─────────────────────────────────────────────
        //  DATA
        // ─────────────────────────────────────────────
        const CODON_TABLE = {
            'UUU': { short: 'Phe', long: 'Phenylalanin',     color: 'bg-red-200' },
            'UUC': { short: 'Phe', long: 'Phenylalanin',     color: 'bg-red-200' },
            'UUA': { short: 'Leu', long: 'Leucin',           color: 'bg-orange-200' },
            'UUG': { short: 'Leu', long: 'Leucin',           color: 'bg-orange-200' },
            'UCU': { short: 'Ser', long: 'Serin',            color: 'bg-yellow-200' },
            'UCC': { short: 'Ser', long: 'Serin',            color: 'bg-yellow-200' },
            'UCA': { short: 'Ser', long: 'Serin',            color: 'bg-yellow-200' },
            'UCG': { short: 'Ser', long: 'Serin',            color: 'bg-yellow-200' },
            'UAU': { short: 'Tyr', long: 'Tyrosin',          color: 'bg-green-200' },
            'UAC': { short: 'Tyr', long: 'Tyrosin',          color: 'bg-green-200' },
            'UGU': { short: 'Cys', long: 'Cystein',          color: 'bg-teal-200' },
            'UGC': { short: 'Cys', long: 'Cystein',          color: 'bg-teal-200' },
            'UGG': { short: 'Trp', long: 'Tryptophan',       color: 'bg-blue-200' },
            'CUU': { short: 'Leu', long: 'Leucin',           color: 'bg-orange-200' },
            'CUC': { short: 'Leu', long: 'Leucin',           color: 'bg-orange-200' },
            'CUA': { short: 'Leu', long: 'Leucin',           color: 'bg-orange-200' },
            'CUG': { short: 'Leu', long: 'Leucin',           color: 'bg-orange-200' },
            'CCU': { short: 'Pro', long: 'Prolin',           color: 'bg-indigo-200' },
            'CCC': { short: 'Pro', long: 'Prolin',           color: 'bg-indigo-200' },
            'CCA': { short: 'Pro', long: 'Prolin',           color: 'bg-indigo-200' },
            'CCG': { short: 'Pro', long: 'Prolin',           color: 'bg-indigo-200' },
            'CAU': { short: 'His', long: 'Histidin',         color: 'bg-purple-200' },
            'CAC': { short: 'His', long: 'Histidin',         color: 'bg-purple-200' },
            'CAA': { short: 'Gln', long: 'Glutamin',         color: 'bg-pink-200' },
            'CAG': { short: 'Gln', long: 'Glutamin',         color: 'bg-pink-200' },
            'CGU': { short: 'Arg', long: 'Arginin',          color: 'bg-rose-200' },
            'CGC': { short: 'Arg', long: 'Arginin',          color: 'bg-rose-200' },
            'CGA': { short: 'Arg', long: 'Arginin',          color: 'bg-rose-200' },
            'CGG': { short: 'Arg', long: 'Arginin',          color: 'bg-rose-200' },
            'AUU': { short: 'Ile', long: 'Isoleucin',        color: 'bg-lime-200' },
            'AUC': { short: 'Ile', long: 'Isoleucin',        color: 'bg-lime-200' },
            'AUA': { short: 'Ile', long: 'Isoleucin',        color: 'bg-lime-200' },
            'AUG': { short: 'Met', long: 'Methionin (Start)',color: 'bg-emerald-300' },
            'ACU': { short: 'Thr', long: 'Threonin',         color: 'bg-cyan-200' },
            'ACC': { short: 'Thr', long: 'Threonin',         color: 'bg-cyan-200' },
            'ACA': { short: 'Thr', long: 'Threonin',         color: 'bg-cyan-200' },
            'ACG': { short: 'Thr', long: 'Threonin',         color: 'bg-cyan-200' },
            'AAU': { short: 'Asn', long: 'Asparagin',        color: 'bg-sky-200' },
            'AAC': { short: 'Asn', long: 'Asparagin',        color: 'bg-sky-200' },
            'AAA': { short: 'Lys', long: 'Lysin',            color: 'bg-violet-200' },
            'AAG': { short: 'Lys', long: 'Lysin',            color: 'bg-violet-200' },
            'AGU': { short: 'Ser', long: 'Serin',            color: 'bg-yellow-200' },
            'AGC': { short: 'Ser', long: 'Serin',            color: 'bg-yellow-200' },
            'AGA': { short: 'Arg', long: 'Arginin',          color: 'bg-rose-200' },
            'AGG': { short: 'Arg', long: 'Arginin',          color: 'bg-rose-200' },
            'GUU': { short: 'Val', long: 'Valin',            color: 'bg-amber-200' },
            'GUC': { short: 'Val', long: 'Valin',            color: 'bg-amber-200' },
            'GUA': { short: 'Val', long: 'Valin',            color: 'bg-amber-200' },
            'GUG': { short: 'Val', long: 'Valin',            color: 'bg-amber-200' },
            'GCU': { short: 'Ala', long: 'Alanin',           color: 'bg-fuchsia-200' },
            'GCC': { short: 'Ala', long: 'Alanin',           color: 'bg-fuchsia-200' },
            'GCA': { short: 'Ala', long: 'Alanin',           color: 'bg-fuchsia-200' },
            'GCG': { short: 'Ala', long: 'Alanin',           color: 'bg-fuchsia-200' },
            'GAU': { short: 'Asp', long: 'Asparaginsäure',   color: 'bg-stone-200' },
            'GAC': { short: 'Asp', long: 'Asparaginsäure',   color: 'bg-stone-200' },
            'GAA': { short: 'Glu', long: 'Glutaminsäure',    color: 'bg-gray-200' },
            'GAG': { short: 'Glu', long: 'Glutaminsäure',    color: 'bg-gray-200' },
            'GGU': { short: 'Gly', long: 'Glycin',           color: 'bg-slate-200' },
            'GGC': { short: 'Gly', long: 'Glycin',           color: 'bg-slate-200' },
            'GGA': { short: 'Gly', long: 'Glycin',           color: 'bg-slate-200' },
            'GGG': { short: 'Gly', long: 'Glycin',           color: 'bg-slate-200' },
            'UAA': { short: 'STOP', long: 'Stop-Codon',      color: 'bg-red-400' },
            'UAG': { short: 'STOP', long: 'Stop-Codon',      color: 'bg-red-400' },
            'UGA': { short: 'STOP', long: 'Stop-Codon',      color: 'bg-red-400' },
        };

        // Build reverse: amino short -> list of codons
        const AMINO_TO_CODONS = {};
        Object.entries(CODON_TABLE).forEach(([codon, info]) => {
            if (!AMINO_TO_CODONS[info.short]) AMINO_TO_CODONS[info.short] = [];
            AMINO_TO_CODONS[info.short].push(codon);
        });

        // Rückwärts exercises: protein sequences (with STOP)
        const BACKWARD_EXERCISES = [
            ['Met', 'Phe', 'Lys', 'STOP'],
            ['Met', 'Val', 'Ser', 'Leu', 'STOP'],
            ['Met', 'Arg', 'Tyr', 'STOP'],
            ['Met', 'Gly', 'Pro', 'Ala', 'STOP'],
            ['Met', 'Ile', 'Gln', 'Trp', 'STOP'],
        ];

        // Helper: complementary RNA base for DNA
        const dnaToRna = (b) => ({ A:'U', T:'A', G:'C', C:'G' }[b] || '?');

        // Helper: generate DNA sequence
        const generateDna = () => {
            const bases = ['A', 'T', 'G', 'C'];
            const start = ['T', 'A', 'C'];
            const chunks = 3;
            let seq = [...start];
            for (let i = 0; i < chunks * 3; i++) {
                seq.push(bases[Math.floor(Math.random() * bases.length)]);
            }
            seq.push('A', 'C', 'T'); // TGA -> UGA stop
            return seq;
        };

        // Base-pair tooltips
        const BASE_PAIR_TIPS = {
            A: 'A (DNA) paart sich mit U (RNA) – merke: A-U Basenpaarung',
            T: 'T (DNA) paart sich mit A (RNA) – merke: T-A Basenpaarung',
            G: 'G (DNA) paart sich mit C (RNA) – merke: G-C Basenpaarung',
            C: 'C (DNA) paart sich mit G (RNA) – merke: C-G Basenpaarung',
        };

        // ─────────────────────────────────────────────
        //  CODON SUN
        // ─────────────────────────────────────────────
        const CodonSun = () => {
            const polarToCartesian = (cx, cy, r, angleDeg) => {
                const rad = (angleDeg - 90) * Math.PI / 180;
                return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
            };
            const createSector = (index, total, innerR, outerR, label, fill) => {
                const sa = (index * 360) / total;
                const ea = ((index + 1) * 360) / total;
                const s  = polarToCartesian(200, 200, outerR, ea);
                const e  = polarToCartesian(200, 200, outerR, sa);
                const is = polarToCartesian(200, 200, innerR, ea);
                const ie = polarToCartesian(200, 200, innerR, sa);
                const d  = `M ${s.x} ${s.y} A ${outerR} ${outerR} 0 0 0 ${e.x} ${e.y} L ${ie.x} ${ie.y} A ${innerR} ${innerR} 0 0 1 ${is.x} ${is.y} Z`;
                const mid = sa + (ea - sa) / 2;
                const tr = innerR + (outerR - innerR) / 2;
                const tp = polarToCartesian(200, 200, tr, mid);
                const rot = innerR > 130 ? `rotate(${mid > 180 ? mid + 90 : mid - 90}, ${tp.x}, ${tp.y})` : '';
                return (
                    <g key={`${innerR}-${index}`}>
                        <path d={d} fill={fill} stroke="white" strokeWidth="1" />
                        <text x={tp.x} y={tp.y} fill={innerR > 100 ? '#333' : 'white'}
                            fontSize={innerR > 140 ? '8' : '12'} fontWeight="bold"
                            textAnchor="middle" alignmentBaseline="middle" transform={rot}>
                            {label}
                        </text>
                    </g>
                );
            };
            const bases = ['G','A','C','U'];
            const colors = { G:'#f59e0b', A:'#ef4444', C:'#3b82f6', U:'#10b981' };
            const rings = [];
            bases.forEach((b, i) => rings.push(createSector(i, 4, 30, 80, b, colors[b])));
            const r2 = [];
            for(let i=0;i<4;i++) bases.forEach(b=>r2.push(b));
            r2.forEach((b,i) => rings.push(createSector(i,16,80,130,b,colors[b])));
            const r3 = [];
            for(let i=0;i<16;i++) bases.forEach(b=>r3.push(b));
            r3.forEach((b,i) => rings.push(createSector(i,64,130,160,b,'#f3f4f6')));
            r3.forEach((_,i) => {
                const b1=bases[Math.floor(i/16)], b2=bases[Math.floor((i%16)/4)], b3=bases[i%4];
                const codon=b1+b2+b3, amino=CODON_TABLE[codon]?.short||'';
                rings.push(createSector(i,64,160,195,amino,'white'));
            });
            return (
                <div className="flex flex-col items-center">
                    <h4 className="text-sm font-bold text-gray-500 mb-2">Codesonne (Innen → Außen: 1. → 2. → 3. Base)</h4>
                    <svg width="380" height="380" viewBox="0 0 400 400" className="max-w-full h-auto drop-shadow-md">
                        <circle cx="200" cy="200" r="198" fill="white" stroke="#e5e7eb" strokeWidth="1"/>
                        {rings}
                        <circle cx="200" cy="200" r="30" fill="white"/>
                        <text x="200" y="200" textAnchor="middle" alignmentBaseline="middle" fontSize="10" fontWeight="bold" fill="#9ca3af">Start</text>
                    </svg>
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  RIBOSOME ANIMATION SVG
        // ─────────────────────────────────────────────
        const RibosomeAnimation = ({ mrna, currentCodonIdx, aminoChain, showTrna }) => {
            // Show 5 codons at a time around the current position
            const visibleStart = Math.max(0, currentCodonIdx - 1);
            const totalCodons = mrna.length / 3;
            const codonWidth = 66; // px per codon slot
            const ribosomeX = 160; // center of ribosome viewport

            // The polypeptide chain
            const placedAminos = aminoChain.filter(Boolean);

            // tRNA anticodon for current codon
            const currentCodon = mrna.slice(currentCodonIdx * 3, currentCodonIdx * 3 + 3).join('');
            const currentAmino = CODON_TABLE[currentCodon];

            return (
                <div className="w-full overflow-hidden rounded-xl border border-teal-100 bg-gradient-to-b from-teal-50 to-white p-3">
                    <p className="text-xs font-bold text-teal-700 mb-2 text-center tracking-wide">RIBOSOM-ANIMATION</p>
                    <svg width="100%" viewBox="0 0 380 200" className="overflow-visible">

                        {/* mRNA backbone */}
                        <rect x="0" y="148" width="380" height="8" rx="4" fill="#818cf8" opacity="0.25"/>

                        {/* mRNA codons – scrolling */}
                        {Array.from({ length: totalCodons }).map((_, ci) => {
                            const x = 20 + (ci - visibleStart) * codonWidth;
                            if (x < -10 || x > 380) return null;
                            const codon = mrna.slice(ci * 3, ci * 3 + 3).join('');
                            const isActive = ci === currentCodonIdx;
                            const isPast  = ci < currentCodonIdx;
                            return (
                                <g key={ci}>
                                    <rect x={x} y="136" width="54" height="24" rx="5"
                                        fill={isActive ? '#6366f1' : isPast ? '#a5b4fc' : '#e0e7ff'}
                                        opacity={isActive ? 1 : 0.7}/>
                                    <text x={x+27} y="152" textAnchor="middle" fontSize="10"
                                        fontFamily="monospace" fontWeight="bold"
                                        fill={isActive ? 'white' : isPast ? '#4338ca' : '#6366f1'}>
                                        {codon}
                                    </text>
                                    {/* codon number */}
                                    <text x={x+27} y="170" textAnchor="middle" fontSize="7" fill="#94a3b8">
                                        {ci+1}
                                    </text>
                                </g>
                            );
                        })}

                        {/* 5' label */}
                        <text x="4" y="152" fontSize="9" fontWeight="bold" fill="#6366f1" opacity="0.7">5'</text>
                        {/* 3' label */}
                        <text x="363" y="152" fontSize="9" fontWeight="bold" fill="#6366f1" opacity="0.7">3'</text>

                        {/* Site labels */}
                        <text x="90"  y="88" textAnchor="middle" fontSize="8" fontWeight="bold" fill="#94a3b8">E-Site</text>
                        <text x="156" y="88" textAnchor="middle" fontSize="8" fontWeight="bold" fill="#0d9488">P-Site</text>
                        <text x="222" y="88" textAnchor="middle" fontSize="8" fontWeight="bold" fill="#7c3aed">A-Site</text>

                        {/* Ribosome large subunit (top, dome) */}
                        <ellipse cx="158" cy="110" rx="95" ry="32" fill="#0d9488" opacity="0.85"/>
                        <ellipse cx="158" cy="108" rx="88" ry="26" fill="#14b8a6" opacity="0.7"/>
                        <text x="158" y="112" textAnchor="middle" fontSize="9" fontWeight="bold" fill="white" opacity="0.9">Große Untereinheit (60S)</text>

                        {/* Ribosome small subunit (below mRNA) */}
                        <ellipse cx="158" cy="174" rx="88" ry="18" fill="#0f766e" opacity="0.8"/>
                        <ellipse cx="158" cy="173" rx="80" ry="13" fill="#14b8a6" opacity="0.55"/>
                        <text x="158" y="176" textAnchor="middle" fontSize="8" fontWeight="bold" fill="white" opacity="0.9">Kleine Untereinheit (40S)</text>

                        {/* Site separators */}
                        <line x1="122" y1="92" x2="122" y2="140" stroke="white" strokeWidth="0.8" strokeDasharray="2,2" opacity="0.6"/>
                        <line x1="190" y1="92" x2="190" y2="140" stroke="white" strokeWidth="0.8" strokeDasharray="2,2" opacity="0.6"/>

                        {/* tRNA at A-site (shows briefly when showTrna) */}
                        {showTrna && currentAmino && (
                            <g className="trna-dock">
                                {/* tRNA body – L-shape simplified */}
                                <rect x="206" y="55" width="32" height="28" rx="6" fill="#7c3aed" opacity="0.9"/>
                                <text x="222" y="74" textAnchor="middle" fontSize="7" fontWeight="bold" fill="white">
                                    tRNA
                                </text>
                                {/* anticodon arm */}
                                <rect x="213" y="83" width="18" height="16" rx="3" fill="#6d28d9" opacity="0.9"/>
                                <text x="222" y="94" textAnchor="middle" fontSize="6" fontWeight="bold" fill="#ddd6fe">
                                    {currentCodon}
                                </text>
                                {/* amino acid bubble */}
                                <circle cx="222" cy="48" r="10" fill="#f59e0b"/>
                                <text x="222" y="51" textAnchor="middle" fontSize="6" fontWeight="bold" fill="white">
                                    {currentAmino.short}
                                </text>
                            </g>
                        )}

                        {/* Polypeptide chain hanging below ribosome */}
                        {placedAminos.length > 0 && (
                            <g>
                                {/* chain line */}
                                <line x1="156" y1="142" x2="156" y2={142 + placedAminos.length * 18}
                                    stroke="#14b8a6" strokeWidth="2" strokeDasharray="3,2" opacity="0.5"/>
                                {placedAminos.map((a, i) => (
                                    <g key={i} className="chain-grow">
                                        <circle cx="156" cy={142 + (i + 1) * 18} r="8"
                                            fill={i === placedAminos.length - 1 ? '#0d9488' : '#99f6e4'}
                                            stroke="#0d9488" strokeWidth="1.5"/>
                                        <text x="156" y={145 + (i + 1) * 18} textAnchor="middle"
                                            fontSize="5" fontWeight="bold"
                                            fill={i === placedAminos.length - 1 ? 'white' : '#0f766e'}>
                                            {a.short}
                                        </text>
                                    </g>
                                ))}
                                <text x="167" y={148 + placedAminos.length * 18} fontSize="7" fill="#0d9488" fontWeight="bold">
                                    ← Polypeptid
                                </text>
                            </g>
                        )}
                    </svg>
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  TIMER BAR
        // ─────────────────────────────────────────────
        const TimerBar = ({ secondsLeft, totalSeconds }) => {
            const pct = Math.max(0, (secondsLeft / totalSeconds) * 100);
            const color = pct > 50 ? 'bg-teal-500' : pct > 20 ? 'bg-yellow-400' : 'bg-red-500';
            return (
                <div className="w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
                    <div
                        className={`h-4 rounded-full transition-all duration-1000 ${color} ${pct < 15 ? 'timer-pulse' : ''}`}
                        style={{ width: `${pct}%` }}
                    />
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  TOOLTIP COMPONENT
        // ─────────────────────────────────────────────
        const Tooltip = ({ text, onClose }) => (
            <div className="tooltip-in absolute z-50 bottom-full left-1/2 -translate-x-1/2 mb-2 w-56 bg-gray-900 text-white text-xs rounded-lg px-3 py-2 shadow-lg pointer-events-none">
                <div className="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-full w-0 h-0 border-l-4 border-r-4 border-t-4 border-transparent border-t-gray-900"/>
                {text}
            </div>
        );

        // ─────────────────────────────────────────────
        //  STANDARD GAME LOGIC (Normal + Timed)
        // ─────────────────────────────────────────────
        const useGame = (onScoreUpdate) => {
            const [dna, setDna] = useState([]);
            const [mrna, setMrna] = useState([]);
            const [aminoChain, setAminoChain] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [stage, setStage] = useState('transcription');
            const [feedback, setFeedback] = useState('');
            const [isCorrect, setIsCorrect] = useState(null);
            const [showSun, setShowSun] = useState(false);
            const [score, setScore] = useState(0);
            const [showTrna, setShowTrna] = useState(false);
            const [tooltip, setTooltip] = useState(null);  // { text, target }
            const [hintUsed, setHintUsed] = useState(false);
            const [shakingBase, setShakingBase] = useState(null);

            const initGame = useCallback((dnaSeq) => {
                const seq = dnaSeq || generateDna();
                setDna(seq);
                setMrna(new Array(seq.length).fill(null));
                setAminoChain(new Array(seq.length / 3).fill(null));
                setStage('transcription');
                setCurrentIdx(0);
                setFeedback('Transkribiere die DNA in mRNA. Welche Base passt zu ' + seq[0] + '?');
                setIsCorrect(null);
                setShowSun(false);
                setScore(0);
                setShowTrna(false);
                setTooltip(null);
                setHintUsed(false);
            }, []);

            useEffect(() => { initGame(); }, []);

            const handleBaseClick = (base) => {
                if (stage !== 'transcription') return;
                const templateBase = dna[currentIdx];
                const correctMatch = dnaToRna(templateBase);

                if (base === correctMatch) {
                    const newMrna = [...mrna];
                    newMrna[currentIdx] = base;
                    setMrna(newMrna);
                    setIsCorrect(true);
                    setTooltip(null);
                    const newScore = score + 1;
                    setScore(newScore);
                    if (onScoreUpdate) onScoreUpdate(newScore);

                    if (currentIdx + 1 < dna.length) {
                        setCurrentIdx(prev => prev + 1);
                        setFeedback('Richtig! Nächste Base.');
                    } else {
                        setTimeout(() => {
                            setStage('translation');
                            setCurrentIdx(0);
                            setFeedback('Super! Die mRNA ist fertig. Jetzt zur Translation. Nutze die Codesonne!');
                            setIsCorrect(null);
                            setShowSun(true);
                            setShowTrna(true);
                            setTimeout(() => setShowTrna(false), 1200);
                        }, 800);
                    }
                } else {
                    setIsCorrect(false);
                    setShakingBase(base);
                    setTimeout(() => setShakingBase(null), 400);
                    const tip = `"${base}" passt nicht. ${BASE_PAIR_TIPS[templateBase]}`;
                    setTooltip({ text: tip, target: base });
                    setFeedback(`Falsch. ${templateBase} paart sich in der RNA mit ${correctMatch}.`);
                    setTimeout(() => setTooltip(null), 3000);
                }
            };

            const handleAminoSelection = (code3) => {
                if (stage !== 'translation') return;
                const codonStart = currentIdx * 3;
                const codon = mrna.slice(codonStart, codonStart + 3).join('');
                const correctAmino = CODON_TABLE[codon];

                if (correctAmino && correctAmino.short === code3) {
                    const newChain = [...aminoChain];
                    newChain[currentIdx] = correctAmino;
                    setAminoChain(newChain);
                    setIsCorrect(true);
                    const newScore = score + 1;
                    setScore(newScore);
                    if (onScoreUpdate) onScoreUpdate(newScore);
                    setFeedback(`Korrekt! ${codon} codiert für ${correctAmino.long}.`);
                    setTooltip(null);

                    // Show tRNA docking briefly
                    setShowTrna(true);
                    setTimeout(() => setShowTrna(false), 1000);

                    if (currentIdx + 1 < aminoChain.length) {
                        setCurrentIdx(prev => prev + 1);
                    } else {
                        setStage('done');
                        setFeedback('Glückwunsch! Protein erfolgreich synthetisiert!');
                    }
                } else {
                    setIsCorrect(false);
                    const tip = correctAmino
                        ? `Das Codon "${codon}" codiert für ${correctAmino.long} (${correctAmino.short}), nicht für ${code3}.`
                        : `Das Codon "${codon}" ist ein Stop-Codon – es codiert keine Aminosäure.`;
                    setTooltip({ text: tip, target: code3 });
                    setFeedback(`Nicht korrekt. Suche "${codon}" in der Codesonne.`);
                    setTimeout(() => setTooltip(null), 4000);
                }
            };

            const useHint = () => {
                if (hintUsed) return;
                setHintUsed(true);
                if (stage === 'transcription') {
                    const correct = dnaToRna(dna[currentIdx]);
                    setFeedback(`Hilfe: Die korrekte Base ist "${correct}". (-1 Stern)`);
                } else if (stage === 'translation') {
                    const codon = mrna.slice(currentIdx * 3, currentIdx * 3 + 3).join('');
                    const a = CODON_TABLE[codon];
                    setFeedback(a ? `Hilfe: Das Codon "${codon}" codiert für ${a.long} (${a.short}). (-1 Stern)` : '');
                }
                setScore(s => Math.max(0, s - 1));
            };

            const filteredAminos = Object.entries(CODON_TABLE)
                .reduce((acc, [, amino]) => {
                    if (!acc.find(a => a.short === amino.short)) acc.push(amino);
                    return acc;
                }, [])
                .sort((a, b) => a.short.localeCompare(b.short));

            return {
                dna, mrna, aminoChain, currentIdx, stage, feedback, isCorrect,
                showSun, score, showTrna, tooltip, hintUsed, shakingBase,
                initGame, handleBaseClick, handleAminoSelection, useHint, filteredAminos
            };
        };

        // ─────────────────────────────────────────────
        //  NORMAL MODE
        // ─────────────────────────────────────────────
        const NormalMode = () => {
            const g = useGame();

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-6 flex flex-col gap-5">
                    {/* Status Bar */}
                    <div className="w-full bg-white rounded-xl p-3 shadow-sm border border-gray-200 flex flex-col md:flex-row items-center justify-between gap-3">
                        <div className="flex gap-2 text-sm font-semibold">
                            <span className={`px-3 py-1 rounded-full transition-all ${g.stage === 'transcription' ? 'bg-teal-100 text-teal-700 ring-2 ring-teal-500' : 'bg-gray-100 text-gray-400'}`}>1. Transkription</span>
                            <span className={`px-3 py-1 rounded-full transition-all ${g.stage === 'translation' ? 'bg-teal-100 text-teal-700 ring-2 ring-teal-500' : 'bg-gray-100 text-gray-400'}`}>2. Translation</span>
                            {g.stage === 'done' && <span className="px-3 py-1 rounded-full bg-green-100 text-green-700 ring-2 ring-green-400">Fertig!</span>}
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-xs text-gray-400 font-semibold">Punkte: <span className="text-teal-600 font-bold text-base">{g.score}</span></span>
                            <button onClick={g.useHint} disabled={g.hintUsed || g.stage === 'done'}
                                className="text-xs px-3 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-700 hover:bg-amber-100 disabled:opacity-40 transition-all">
                                Hilfe (-1★)
                            </button>
                        </div>
                        <div className={`text-sm font-medium px-4 py-2 rounded-lg max-w-sm text-center ${g.isCorrect === true ? 'bg-green-100 text-green-700' : g.isCorrect === false ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'}`}>
                            {g.feedback}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        {/* Left: Strands + Controls */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col items-center gap-6">
                            {/* DNA/mRNA strands */}
                            <div className="w-full overflow-x-auto pb-24">
                                <div className="flex gap-2 justify-center min-w-max items-start">
                                    <div className="mr-3 flex flex-col items-end gap-2 text-xs font-bold text-gray-400 uppercase tracking-widest pt-[2px]">
                                        <div className="h-10 flex items-center">DNA</div>
                                        <div className="h-4"></div>
                                        <div className="h-10 flex items-center">mRNA</div>
                                        <div className="h-8"></div>
                                        <div className="h-10 flex items-center">Protein</div>
                                    </div>
                                    {g.dna.map((base, idx) => {
                                        const isCurrent = g.stage === 'transcription' && idx === g.currentIdx;
                                        const codonIdx = Math.floor(idx / 3);
                                        const isCodonCurrent = g.stage === 'translation' && codonIdx === g.currentIdx;
                                        const gapClass = idx % 3 === 0 && idx !== 0 ? 'ml-3' : '';
                                        return (
                                            <div key={idx} className={`relative flex flex-col gap-2 items-center ${gapClass}`}>
                                                <div className={`w-10 h-10 flex items-center justify-center rounded-lg border-2 font-mono font-bold text-lg transition-all
                                                    ${isCurrent ? 'border-teal-500 bg-teal-50 scale-110 shadow-md ring-2 ring-teal-200 z-10' : 'border-gray-200 bg-gray-50 text-gray-400'}`}>
                                                    {base}
                                                </div>
                                                <div className="h-4 w-0.5 bg-gray-200"/>
                                                <div className={`w-10 h-10 flex items-center justify-center rounded-lg border-2 font-mono font-bold text-lg transition-all
                                                    ${g.mrna[idx] ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-gray-100 border-dashed border-gray-300'}
                                                    ${isCurrent ? 'ring-2 ring-teal-400 ring-offset-2 z-10' : ''}
                                                    ${isCodonCurrent ? 'bg-indigo-100 border-indigo-400' : ''}`}>
                                                    {g.mrna[idx] || '?'}
                                                </div>
                                                {idx % 3 === 1 ? (
                                                    <React.Fragment>
                                                        <div className="h-8 w-0.5 bg-gray-200"/>
                                                        <div className={`absolute top-[9.5rem] w-32 h-10 flex items-center justify-center rounded-full text-xs font-bold shadow-sm transition-all z-20 left-1/2 -translate-x-1/2
                                                            ${g.aminoChain[codonIdx] ? g.aminoChain[codonIdx]?.color : 'bg-gray-100 text-gray-300 border border-gray-200'}
                                                            ${isCodonCurrent ? 'ring-2 ring-teal-400 scale-105 shadow-md' : ''}`}>
                                                            {g.aminoChain[codonIdx]?.long || '...'}
                                                        </div>
                                                    </React.Fragment>
                                                ) : (
                                                    <div className="h-8 w-0.5 bg-transparent"/>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="w-full border-t border-gray-100 pt-5">
                                {g.stage === 'transcription' ? (
                                    <div className="flex flex-col items-center gap-3">
                                        <p className="text-sm text-gray-500">Wähle die passende RNA-Base für <span className="font-bold text-teal-700">{g.dna[g.currentIdx]}</span>:</p>
                                        <div className="flex gap-3">
                                            {['A','U','G','C'].map(nuc => (
                                                <div key={nuc} className="relative">
                                                    {g.tooltip?.target === nuc && <Tooltip text={g.tooltip.text}/>}
                                                    <button
                                                        onClick={() => g.handleBaseClick(nuc)}
                                                        className={`w-16 h-16 rounded-2xl bg-white border-2 border-b-4 border-gray-200 active:border-b-2 hover:bg-gray-50 active:translate-y-0.5 text-xl font-bold text-gray-700 shadow-sm transition-all ${g.shakingBase === nuc ? 'shake border-red-400' : ''}`}>
                                                        {nuc}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : g.stage === 'translation' ? (
                                    <div className="flex flex-col items-center gap-3 animate-fade-in">
                                        <p className="text-sm text-gray-500">Aminosäure für Codon: <span className="font-mono font-bold text-indigo-600 text-lg">{g.mrna.slice(g.currentIdx*3, g.currentIdx*3+3).join('')}</span></p>
                                        <div className="w-full flex gap-1.5 flex-wrap justify-center max-h-32 overflow-y-auto">
                                            {g.filteredAminos.map(amino => (
                                                <div key={amino.short} className="relative">
                                                    {g.tooltip?.target === amino.short && <Tooltip text={g.tooltip.text}/>}
                                                    <button
                                                        onClick={() => g.handleAminoSelection(amino.short)}
                                                        className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border border-b-2 transition-all hover:scale-105 ${amino.color} border-gray-300/50 hover:brightness-95`}>
                                                        {amino.short}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center gap-3">
                                        <p className="text-green-600 font-bold text-lg">Protein synthetisiert!</p>
                                        <button onClick={() => g.initGame()} className="px-6 py-2 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition-all">
                                            Neue Sequenz
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Right: Ribosome (translation) or Codon Sun */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col items-center justify-start gap-4">
                            {g.stage === 'translation' || g.stage === 'done' ? (
                                <React.Fragment>
                                    <RibosomeAnimation
                                        mrna={g.mrna}
                                        currentCodonIdx={g.stage === 'done' ? g.aminoChain.length : g.currentIdx}
                                        aminoChain={g.aminoChain}
                                        showTrna={g.showTrna}
                                    />
                                    <div className={`transition-all duration-500 w-full ${g.showSun ? 'opacity-100' : 'opacity-40'}`}>
                                        <CodonSun />
                                    </div>
                                </React.Fragment>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full gap-4">
                                    <div className="text-center text-gray-400 text-sm mb-2">Die Codesonne wird in der Translations-Phase benötigt.</div>
                                    <div className="opacity-30 blur-[2px] pointer-events-none">
                                        <CodonSun />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  TIMED MODE
        // ─────────────────────────────────────────────
        const TimedMode = () => {
            const DIFFICULTY = { easy: 90, normal: 60, hard: 45 };
            const [difficulty, setDifficulty] = useState('normal');
            const [timerActive, setTimerActive] = useState(false);
            const [secondsLeft, setSecondsLeft] = useState(60);
            const [finalScore, setFinalScore] = useState(null);
            const [score, setScore] = useState(0);
            const [finalStage, setFinalStage] = useState('transcription');
            const timerRef = useRef(null);

            const g = useGame((newScore) => {
                setScore(newScore);
            });

            const startTimer = (diff) => {
                const total = DIFFICULTY[diff];
                setSecondsLeft(total);
                setFinalScore(null);
                setScore(0);
                setTimerActive(true);
                g.initGame();
            };

            useEffect(() => {
                if (!timerActive) return;
                if (secondsLeft <= 0) {
                    setTimerActive(false);
                    setFinalScore(score);
                    setFinalStage(g.stage);
                    return;
                }
                timerRef.current = setTimeout(() => setSecondsLeft(s => s - 1), 1000);
                return () => clearTimeout(timerRef.current);
            }, [timerActive, secondsLeft]);

            // Auto-regenerate when done
            useEffect(() => {
                if (g.stage === 'done' && timerActive) {
                    setTimeout(() => g.initGame(generateDna()), 600);
                }
            }, [g.stage]);

            const total = DIFFICULTY[difficulty];

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50 p-4 flex flex-col gap-4">
                    {/* Difficulty + Timer Header */}
                    <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-200 flex flex-col gap-3">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <div className="flex gap-2">
                                {Object.entries(DIFFICULTY).map(([key, secs]) => (
                                    <button key={key}
                                        onClick={() => { setDifficulty(key); }}
                                        disabled={timerActive}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-bold border transition-all disabled:opacity-50
                                            ${difficulty === key ? 'bg-teal-600 text-white border-teal-700' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
                                        {key === 'easy' ? 'Leicht (90s)' : key === 'normal' ? 'Normal (60s)' : 'Schwer (45s)'}
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center gap-3">
                                <div className={`text-2xl font-mono font-bold ${secondsLeft <= 10 && timerActive ? 'text-red-500 timer-pulse' : 'text-teal-700'}`}>
                                    {secondsLeft}s
                                </div>
                                <span className="text-sm text-gray-400">Punkte: <span className="text-teal-700 font-bold">{score}</span></span>
                                {!timerActive ? (
                                    <button onClick={() => startTimer(difficulty)}
                                        className="px-5 py-2 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition-all shadow">
                                        {finalScore !== null ? 'Nochmal' : 'Start'}
                                    </button>
                                ) : (
                                    <button onClick={() => { setTimerActive(false); setFinalScore(score); setFinalStage(g.stage); }}
                                        className="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 transition-all">
                                        Stop
                                    </button>
                                )}
                            </div>
                        </div>
                        <TimerBar secondsLeft={secondsLeft} totalSeconds={total} />
                    </div>

                    {/* Result Overlay */}
                    {finalScore !== null && !timerActive && (
                        <div className="animate-fade-in bg-teal-50 border-2 border-teal-400 rounded-xl p-6 text-center shadow-lg">
                            <div className="text-5xl mb-2">🎉</div>
                            <div className="text-xl font-bold text-teal-800 mb-1">Zeit abgelaufen!</div>
                            <div className="text-lg text-teal-700">
                                {finalStage === 'transcription'
                                    ? `Du hast ${finalScore} Nukleotide in ${DIFFICULTY[difficulty]} Sekunden transkribiert!`
                                    : `Du hast ${finalScore} Aminosäuren in ${DIFFICULTY[difficulty]} Sekunden translatiert!`}
                            </div>
                            <button onClick={() => startTimer(difficulty)}
                                className="mt-4 px-6 py-2 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700">
                                Nochmal spielen
                            </button>
                        </div>
                    )}

                    {/* Game (only active during timer) */}
                    {timerActive && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {/* Strands */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col items-center gap-4">
                                <div className="w-full overflow-x-auto pb-24">
                                    <div className="flex gap-2 justify-center min-w-max items-start">
                                        <div className="mr-3 flex flex-col items-end gap-2 text-xs font-bold text-gray-400 uppercase tracking-widest pt-[2px]">
                                            <div className="h-10 flex items-center">DNA</div>
                                            <div className="h-4"/>
                                            <div className="h-10 flex items-center">mRNA</div>
                                            <div className="h-8"/>
                                            <div className="h-10 flex items-center">Protein</div>
                                        </div>
                                        {g.dna.map((base, idx) => {
                                            const isCurrent = g.stage === 'transcription' && idx === g.currentIdx;
                                            const codonIdx = Math.floor(idx / 3);
                                            const isCodonCurrent = g.stage === 'translation' && codonIdx === g.currentIdx;
                                            const gapClass = idx % 3 === 0 && idx !== 0 ? 'ml-3' : '';
                                            return (
                                                <div key={idx} className={`relative flex flex-col gap-2 items-center ${gapClass}`}>
                                                    <div className={`w-10 h-10 flex items-center justify-center rounded-lg border-2 font-mono font-bold text-lg transition-all
                                                        ${isCurrent ? 'border-teal-500 bg-teal-50 scale-110 shadow-md ring-2 ring-teal-200 z-10' : 'border-gray-200 bg-gray-50 text-gray-400'}`}>
                                                        {base}
                                                    </div>
                                                    <div className="h-4 w-0.5 bg-gray-200"/>
                                                    <div className={`w-10 h-10 flex items-center justify-center rounded-lg border-2 font-mono font-bold text-lg transition-all
                                                        ${g.mrna[idx] ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-gray-100 border-dashed border-gray-300'}
                                                        ${isCurrent ? 'ring-2 ring-teal-400 ring-offset-2' : ''}
                                                        ${isCodonCurrent ? 'bg-indigo-100 border-indigo-400' : ''}`}>
                                                        {g.mrna[idx] || '?'}
                                                    </div>
                                                    {idx % 3 === 1 ? (
                                                        <React.Fragment>
                                                            <div className="h-8 w-0.5 bg-gray-200"/>
                                                            <div className={`absolute top-[9.5rem] w-32 h-10 flex items-center justify-center rounded-full text-xs font-bold shadow-sm z-20 left-1/2 -translate-x-1/2
                                                                ${g.aminoChain[codonIdx] ? g.aminoChain[codonIdx]?.color : 'bg-gray-100 text-gray-300 border border-gray-200'}
                                                                ${isCodonCurrent ? 'ring-2 ring-teal-400 scale-105' : ''}`}>
                                                                {g.aminoChain[codonIdx]?.long || '...'}
                                                            </div>
                                                        </React.Fragment>
                                                    ) : <div className="h-8 w-0.5 bg-transparent"/>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="w-full border-t border-gray-100 pt-4">
                                    {g.stage === 'transcription' ? (
                                        <div className="flex flex-col items-center gap-3">
                                            <p className="text-sm text-gray-500">RNA-Base für <span className="font-bold text-teal-700">{g.dna[g.currentIdx]}</span>:</p>
                                            <div className="flex gap-3">
                                                {['A','U','G','C'].map(nuc => (
                                                    <div key={nuc} className="relative">
                                                        {g.tooltip?.target === nuc && <Tooltip text={g.tooltip.text}/>}
                                                        <button onClick={() => g.handleBaseClick(nuc)}
                                                            className={`w-16 h-16 rounded-2xl bg-white border-2 border-b-4 border-gray-200 active:border-b-2 hover:bg-gray-50 active:translate-y-0.5 text-xl font-bold text-gray-700 shadow-sm transition-all ${g.shakingBase === nuc ? 'shake border-red-400' : ''}`}>
                                                            {nuc}
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center gap-3 animate-fade-in">
                                            <p className="text-sm text-gray-500">Codon: <span className="font-mono font-bold text-indigo-600">{g.mrna.slice(g.currentIdx*3, g.currentIdx*3+3).join('')}</span></p>
                                            <div className="flex gap-1.5 flex-wrap justify-center max-h-28 overflow-y-auto">
                                                {g.filteredAminos.map(amino => (
                                                    <div key={amino.short} className="relative">
                                                        {g.tooltip?.target === amino.short && <Tooltip text={g.tooltip.text}/>}
                                                        <button onClick={() => g.handleAminoSelection(amino.short)}
                                                            className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border border-b-2 transition-all hover:scale-105 ${amino.color} border-gray-300/50`}>
                                                            {amino.short}
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Ribosome / Sun */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col items-center gap-3">
                                {g.stage === 'translation' ? (
                                    <React.Fragment>
                                        <RibosomeAnimation mrna={g.mrna} currentCodonIdx={g.currentIdx} aminoChain={g.aminoChain} showTrna={g.showTrna}/>
                                        <div className="w-full"><CodonSun /></div>
                                    </React.Fragment>
                                ) : (
                                    <div className="opacity-30 blur-[1px] pointer-events-none w-full flex flex-col items-center">
                                        <CodonSun />
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {!timerActive && finalScore === null && (
                        <div className="flex flex-col items-center justify-center flex-1 gap-4 text-gray-400">
                            <IconTimer className="w-16 h-16 opacity-30"/>
                            <p className="text-lg font-semibold">Wähle eine Schwierigkeitsstufe und drücke Start!</p>
                        </div>
                    )}
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  RÜCKWÄRTS MODE
        // ─────────────────────────────────────────────
        const BackwardMode = () => {
            const [exerciseIdx, setExerciseIdx] = useState(0);
            const [selections, setSelections] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [showSun, setShowSun] = useState(false);

            const exercise = BACKWARD_EXERCISES[exerciseIdx];

            const handleSelect = (aminoIdx, codon) => {
                if (submitted) return;
                setSelections(prev => ({ ...prev, [aminoIdx]: codon }));
            };

            const allSelected = exercise.every((_, i) => selections[i]);

            const handleSubmit = () => {
                if (!allSelected) return;
                setSubmitted(true);
            };

            const reset = (newIdx) => {
                setExerciseIdx(newIdx);
                setSelections({});
                setSubmitted(false);
            };

            // Compute all possible mRNA sequences
            const allCombinations = (() => {
                const codonsPerPos = exercise.map(amino => AMINO_TO_CODONS[amino] || []);
                const result = [];
                const recurse = (idx, current) => {
                    if (idx === codonsPerPos.length) { result.push(current.join('-')); return; }
                    codonsPerPos[idx].forEach(c => recurse(idx + 1, [...current, c]));
                };
                recurse(0, []);
                return result;
            })();

            // User's chosen sequence
            const chosenSeq = exercise.map((_, i) => selections[i] || '???').join('-');

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50 p-4 flex flex-col gap-4">
                    {/* Exercise picker */}
                    <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-200 flex flex-col gap-3">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <h3 className="font-bold text-gray-700">Übung wählen:</h3>
                            <div className="flex gap-2 flex-wrap">
                                {BACKWARD_EXERCISES.map((ex, i) => (
                                    <button key={i} onClick={() => reset(i)}
                                        className={`px-3 py-1.5 text-sm font-bold rounded-lg border transition-all
                                            ${exerciseIdx === i ? 'bg-teal-600 text-white border-teal-700' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
                                        Übung {i+1}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="text-sm text-gray-500">
                            <span className="font-semibold text-teal-700">Aufgabe:</span> Finde eine gültige mRNA-Sequenz für dieses Protein. Mehrere Antworten sind möglich!
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {/* Left: exercise */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col gap-5">
                            <h4 className="font-bold text-gray-700 text-sm uppercase tracking-wide">Proteinsequenz → mRNA-Codons</h4>

                            {/* Protein chain display */}
                            <div className="flex flex-wrap gap-2 items-center">
                                {exercise.map((amino, i) => {
                                    const info = Object.values(CODON_TABLE).find(a => a.short === amino);
                                    return (
                                        <React.Fragment key={i}>
                                            <div className={`px-3 py-2 rounded-full text-sm font-bold shadow-sm ${info?.color || 'bg-red-200'}`}>
                                                {amino}
                                            </div>
                                            {i < exercise.length - 1 && <span className="text-gray-300 font-bold">→</span>}
                                        </React.Fragment>
                                    );
                                })}
                            </div>

                            {/* Codon selectors */}
                            <div className="flex flex-col gap-4">
                                {exercise.map((amino, i) => {
                                    const validCodons = AMINO_TO_CODONS[amino] || [];
                                    const info = Object.values(CODON_TABLE).find(a => a.short === amino);
                                    const isCorrect = submitted && validCodons.includes(selections[i]);
                                    return (
                                        <div key={i} className={`flex items-center gap-3 p-3 rounded-xl border transition-all
                                            ${submitted ? (isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300') : 'bg-gray-50 border-gray-200'}`}>
                                            <div className={`w-20 text-center px-2 py-1 rounded-full text-xs font-bold ${info?.color || 'bg-gray-200'}`}>
                                                {amino}
                                            </div>
                                            <div className="text-gray-400 text-sm">→</div>
                                            <select
                                                value={selections[i] || ''}
                                                onChange={e => handleSelect(i, e.target.value)}
                                                disabled={submitted}
                                                className={`flex-1 rounded-lg border px-3 py-2 text-sm font-mono font-bold bg-white transition-all
                                                    ${selections[i] ? 'border-teal-400 text-teal-700' : 'border-gray-200 text-gray-400'}
                                                    ${submitted && isCorrect ? 'border-green-400 text-green-700' : ''}
                                                    ${submitted && !isCorrect ? 'border-red-400 text-red-700' : ''}`}>
                                                <option value="">— Codon wählen —</option>
                                                {validCodons.map(c => (
                                                    <option key={c} value={c}>{c}</option>
                                                ))}
                                            </select>
                                            {submitted && (
                                                <span className={`text-lg ${isCorrect ? 'text-green-500' : 'text-red-500'}`}>
                                                    {isCorrect ? '✓' : '✗'}
                                                </span>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Submit */}
                            {!submitted ? (
                                <button onClick={handleSubmit} disabled={!allSelected}
                                    className="w-full py-3 bg-teal-600 text-white rounded-xl font-bold text-lg hover:bg-teal-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow">
                                    Überprüfen
                                </button>
                            ) : (
                                <div className="flex flex-col gap-3">
                                    {/* Result */}
                                    <div className="bg-teal-50 border border-teal-200 rounded-xl p-4">
                                        <p className="font-bold text-teal-800 mb-1">Deine Sequenz:</p>
                                        <p className="font-mono text-teal-700 text-lg">{chosenSeq}</p>
                                        <p className="text-xs text-teal-600 mt-1">Alle gewählten Codons sind gültig – gut gemacht!</p>
                                    </div>

                                    {/* All possible combinations */}
                                    <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4">
                                        <p className="font-bold text-indigo-800 mb-2 text-sm">
                                            Alle {allCombinations.length} möglichen mRNA-Sequenzen für dieses Protein:
                                        </p>
                                        <div className="flex flex-wrap gap-1 max-h-40 overflow-y-auto">
                                            {allCombinations.map((combo, ci) => (
                                                <span key={ci}
                                                    className={`px-2 py-0.5 rounded text-xs font-mono font-bold transition-all
                                                        ${combo === chosenSeq ? 'bg-teal-500 text-white' : 'bg-white border border-indigo-200 text-indigo-700'}`}>
                                                    {combo}
                                                </span>
                                            ))}
                                        </div>
                                        <p className="text-xs text-indigo-500 mt-2">
                                            Das ist der <strong>degenerierte genetische Code</strong> – viele Aminosäuren haben mehrere Codons!
                                        </p>
                                    </div>

                                    <button onClick={() => reset((exerciseIdx + 1) % BACKWARD_EXERCISES.length)}
                                        className="w-full py-2 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition-all">
                                        Nächste Übung
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Right: Codon Sun */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col gap-3">
                            <div className="flex items-center justify-between">
                                <h4 className="font-bold text-gray-600 text-sm">Codesonne zur Referenz</h4>
                                <button onClick={() => setShowSun(s => !s)}
                                    className="text-xs px-3 py-1 rounded-lg bg-teal-50 border border-teal-200 text-teal-700 hover:bg-teal-100 transition-all">
                                    {showSun ? 'Verbergen' : 'Anzeigen'}
                                </button>
                            </div>
                            <div className={`transition-all duration-300 ${showSun ? 'opacity-100' : 'opacity-20 blur-[2px]'}`}>
                                <CodonSun />
                            </div>
                            {!showSun && (
                                <p className="text-center text-xs text-gray-400">Klicke "Anzeigen" um die Codesonne zu sehen</p>
                            )}

                            {/* Info box */}
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800">
                                <p className="font-bold mb-1">Tipp: Degenerierter Code</p>
                                <p>Viele Aminosäuren können durch mehrere verschiedene Codons codiert werden. Z.B. codieren <span className="font-mono font-bold">UUU</span> und <span className="font-mono font-bold">UUC</span> beide für Phenylalanin (Phe). Das schützt vor Mutationen!</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  MAIN APP
        // ─────────────────────────────────────────────
        const App = () => {
            const [tab, setTab] = useState('normal');

            const tabs = [
                { id: 'normal', label: 'Normal', icon: <IconDna className="w-4 h-4"/> },
                { id: 'timed',  label: '⏱ Timed',  icon: <IconTimer className="w-4 h-4"/> },
                { id: 'backward', label: 'Rückwärts', icon: <IconReverse className="w-4 h-4"/> },
            ];

            return (
                <div className="flex flex-col h-full bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                    {/* Header */}
                    <div className="p-4 bg-teal-600 text-white flex items-center gap-3 shadow-sm justify-between flex-shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-white/20 rounded-lg">
                                <IconDna className="text-white"/>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold">Transkriptions & Translations Trainer</h2>
                                <p className="text-teal-100 text-sm">Proteinbiosynthese Schritt für Schritt</p>
                            </div>
                        </div>
                        {/* Tabs */}
                        <div className="flex gap-1">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)}
                                    className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-bold transition-all
                                        ${tab === t.id ? 'bg-white text-teal-700 shadow' : 'bg-white/10 text-white hover:bg-white/20'}`}>
                                    {t.icon}
                                    <span className="hidden sm:inline">{t.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Content */}
                    <div className="flex-1 overflow-hidden flex flex-col">
                        {tab === 'normal'   && <NormalMode key="normal"/>}
                        {tab === 'timed'    && <TimedMode key="timed"/>}
                        {tab === 'backward' && <BackwardMode key="backward"/>}
                    </div>
                </div>
            );
        };

        // ─────────────────────────────────────────────
        //  RENDER
        // ─────────────────────────────────────────────
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(
            <React.StrictMode>
                <div className="p-4 h-full">
                    <App />
                </div>
            </React.StrictMode>
        );
    </script>
</body>
</html>
