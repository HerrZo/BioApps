r Schlote am Meeresboden entstehen die ersten einfachen Zellen – Prokaryoten. Diese winzigen Organismen ohne Zellkern sind die Urväter allen Lebens auf der Erde.",icon:"🦠"},{id:"photosynthesis",timeHours:F(3500),yearsAgo:3500,title:"Erste Photosynthese",period:"Paläoarchaikum",eon:"Archaikum",description:'Cyanobakterien entwickeln die Fähigkeit zur Photosynthese. Sie nutzen Sonnenlicht, um aus Wasser und CO₂ Energie zu gewinnen – und produzieren dabei Sauerstoff als „Abfallprodukt". Dies wird die Atmosphäre für immer verändern.',icon:"☀️"},{id:"great-oxidation",timeHours:F(2400),yearsAgo:2400,title:"Große Sauerstoffkatastrophe",period:"Siderium",eon:"Proterozoikum",description:"Der von Cyanobakterien produzierte Sauerstoff reichert sich in der Atmosphäre an. Für die meisten anaeroben Organismen ist dies tödlich – das größte Massenaussterben der Erdgeschichte. Gleichzeitig ermöglicht der Sauerstoff komplexeres Leben.",icon:"💨"},{id:"eukaryotes",timeHours:F(2100),yearsAgo:2100,title:"Erste Eukaryoten",period:"Rhyacium",eon:"Proterozoikum",description:"Durch Endosymbiose – ein Bakterium wird von einem anderen verschluckt, aber nicht verdaut – entstehen die ersten Zellen mit Zellkern. Mitochondrien und später Chloroplasten sind die Überreste dieser uralten Partnerschaft.",icon:"🔬"},{id:"multicellular",timeHours:F(1200),yearsAgo:1200,title:"Erste Mehrzeller",period:"Stenium",eon:"Proterozoikum",description:"Einzellige Organismen beginnen, dauerhafte Zellverbände zu bilden. Die Bangiomorpha-Rotalge ist einer der ältesten bekannten Mehrzeller und zeigt sogar bereits sexuelle Fortpflanzung.",icon:"🧬"},{id:"fossils",timeHours:F(600),yearsAgo:600,title:"Ediacara-Fauna",period:"Ediacarium",eon:"Proterozoikum",description:"Die ersten großen, komplexen Lebewesen erscheinen: bizarre, farnähnliche und kissenförmige Organismen. Die Ediacara-Fauna umfasst Formen, die keiner heutigen Tiergruppe zugeordnet werden können – ein einzigartiges Experiment der Evolution.",icon:"🪸"},{id:"cambrian-explosion",timeHours:F(541),yearsAgo:541,title:"Kambrische Explosion",period:"Kambrium",eon:"Phanerozoikum",description:"In einem geologischen Wimpernschlag entstehen fast alle heutigen Tierstämme. Trilobiten, erste Räuber mit Augen, und bizarre Formen wie Anomalocaris bevölkern die Meere. Die Evolution der Hartteile (Schalen, Skelette) revolutioniert das Leben.",icon:"🐚"},{id:"first-vertebrates",timeHours:F(500),yearsAgo:500,title:"Erste Wirbeltiere (Fische)",period:"Ordovizium",eon:"Phanerozoikum",description:"Kieferlose, gepanzerte Fische sind die ersten Wirbeltiere. Mit ihrer inneren Skelettstruktur aus Knorpel und später Knochen legen sie den Grundstein für alle späteren Wirbeltiere – einschließlich uns Menschen.",icon:"🐟"},{id:"land-plants",timeHours:F(470),yearsAgo:470,title:"Erste Landpflanzen",period:"Ordovizium",eon:"Phanerozoikum",description:"Moosähnliche Pflanzen erobern das Festland. Ohne Wurzeln und Leitgefäße bleiben sie klein, aber sie verändern die Landschaften fundamental und bereiten den Boden für die spätere Besiedlung durch Tiere vor.",icon:"🌿"},{id:"land-animals",timeHours:F(375),yearsAgo:375,title:"Erste Landwirbeltiere",period:"Devon",eon:"Phanerozoikum",description:"Tiktaalik und andere Übergangsformen wagen den Schritt ans Land. Mit kräftigen Flossen, die fast schon Beine sind, und primitiven Lungen erobern die ersten Amphibien das Festland – einer der bedeutendsten Übergänge der Evolution.",icon:"🐸"},{id:"reptiles",timeHours:F(312),yearsAgo:312,title:"Erste Reptilien",period:"Karbon",eon:"Phanerozoikum",description:"Das amniotische Ei befreit die Wirbeltiere vom Wasser. Reptilien können nun ihre Eier an Land legen und sich von Gewässern unabhängig machen. Riesige Wälder aus Farnen und Schachtelhalmen dominieren die Landschaft.",icon:"🦎"},{id:"mass-extinction-permian",timeHours:F(252),yearsAgo:252,title:"Großes Sterben (Perm)",period:"Perm/Trias-Grenze",eon:"Phanerozoikum",description:"Das schlimmste Massenaussterben der Erdgeschichte: 96 % aller Meeresarten und 70 % der Landwirbeltiere sterben aus. Vulkanismus in Sibirien vergiftet Atmosphäre und Ozeane. Das Leben braucht Millionen Jahre, um sich zu erholen.",icon:"💀"},{id:"dinosaurs",timeHours:F(230),yearsAgo:230,title:"Erste Dinosaurier & Säugetiere",period:"Trias",eon:"Phanerozoikum",description:"Nach dem großen Sterben erobern Dinosaurier und die ersten kleinen Säugetiere die frei gewordenen ökologischen Nischen. Die Dinosaurier werden für über 160 Millionen Jahre die dominierenden Landtiere sein.",icon:"🦕"},{id:"first-birds",timeHours:F(150),yearsAgo:150,title:"Erste Vögel (Archaeopteryx)",period:"Jura",eon:"Phanerozoikum",description:"Archaeopteryx, ein gefiederter Dinosaurier, zeigt den Übergang von Reptil zu Vogel. Mit Zähnen, Krallen an den Flügeln und einem langen Knochenschwanz ist er eine perfekte Übergangsform – Beweis, dass Vögel lebende Dinosaurier sind.",icon:"🐦"},{id:"first-flowers",timeHours:F(130),yearsAgo:130,title:"Erste Blütenpflanzen",period:"Kreide",eon:"Phanerozoikum",description:"Blütenpflanzen (Angiospermen) revolutionieren die Pflanzenwelt. Ihre Co-Evolution mit bestäubenden Insekten führt zu einer explosionsartigen Diversifizierung und sie verdrängen nach und nach die Nadelbäume und Farne.",icon:"🌸"},{id:"dino-extinction",timeHours:F(66),yearsAgo:66,title:"Aussterben der Dinosaurier",period:"Kreide/Paläogen-Grenze",eon:"Phanerozoikum",description:"Ein 10 km großer Asteroid schlägt im heutigen Mexiko (Chicxulub) ein. Der Impact-Winter und seine Folgen löschen 75 % aller Arten aus, darunter alle Nicht-Vogel-Dinosaurier. Für die kleinen Säugetiere öffnet sich eine Welt voller Möglichkeiten.",icon:"☄️"},{id:"primates",timeHours:F(55),yearsAgo:55,title:"Erste Primaten",period:"Eozän",eon:"Phanerozoikum",description:"Kleine, nachtaktive Baumbewohner mit Greifhänden und nach vorne gerichteten Augen – die ersten Primaten. Das Stereosehen und die Geschicklichkeit ihrer Hände legen den Grundstein für die spätere Entwicklung zum Menschen.",icon:"🐒"},{id:"grasslands",timeHours:F(25),yearsAgo:25,title:"Graslandschaften entstehen",period:"Oligozän/Miozän",eon:"Phanerozoikum",description:"Weite Graslandschaften ersetzen Wälder. Diese neue Umgebung fördert die Evolution von Huftieren, Raubtieren und schließlich aufrecht gehenden Menschenaffen, die die offene Savanne besiedeln.",icon:"🌾"},{id:"homo-sapiens",timeHours:F(.3),yearsAgo:.3,title:"Homo sapiens",period:"Quartär",eon:"Phanerozoikum",description:"Erst in der allerletzten Sekunde des 24-Stunden-Tages erscheint der moderne Mensch. Unsere gesamte Geschichte – von den Höhlenmalereien bis zur Raumfahrt – spielt sich in einem Wimpernschlag der Erdgeschichte ab.",icon:"👤"}];function Wi(e){const t=Math.floor(e),n=Math.floor((e-t)*60),r=Math.floor(((e-t)*60-n)*60);return`${t.toString().padStart(2,"0")}:${n.toString().padStart(2,"0")}:${r.toString().padStart(2,"0")}`}function Ux(e){return(24-e)/Am}function Bx(e){if(e>=1e3)return`${(e/1e3).toFixed(1)} Milliarden Jahren`;if(e>=1)return`${Math.round(e)} Millionen Jahren`;const t=Math.round(e*1e6);return t>=1e3?`${t.toLocaleString("de-DE")} Jahren`:t>0?`${t} Jahren`:"der Gegenwart"}function an(e){return Fn.find(t=>e>=t.startHours&&e<t.endHours)??Fn[Fn.length-1]}function Nm(e){let t=null,n=1/0;for(const r of mu){const i=Math.abs(r.timeHours-e);i<n&&(n=i,t=r)}return t}function Hx({currentHours:e,onHoursChange:t,onMilestoneClick:n}){const r=T.useRef(null),i=T.useRef(!1),a=500,o=a/2,s=a/2,l=210,u=y=>y/24*360-90,c=y=>(y+90+360)%360/360*24,d=T.useCallback(y=>{const w=r.current;if(!w)return 0;const E=w.getBoundingClientRect(),k=a/E.width,N=a/E.height;let L,O;"touches"in y?(L=y.touches[0].clientX,O=y.touches[0].clientY):(L=y.clientX,O=y.clientY);const de=(L-E.left)*k-o,Te=(O-E.top)*N-s;return Math.atan2(Te,de)*180/Math.PI},[o,s]),f=T.useCallback(y=>{i.current=!0;const w=d(y);t(c(w))},[d,t]);T.useEffect(()=>{const y=E=>{if(!i.current)return;E.preventDefault();const k=d(E);t(c(k))},w=()=>{i.current=!1};retur
