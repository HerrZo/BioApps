Correct:!1,feedback:"Falsch. Sauerstoff wird weiterhin mit maximaler Rate transportiert; nur reicht die aerobe Kapazität nicht mehr allein aus."},{text:"Den Zustand bei absolutem Ruhepuls im Schlaf.",isCorrect:!1,feedback:"Falsch. In Ruhe liegt der Laktatspiegel bei ca. 1,0 mmol/l."}],misconceptionAlert:"Anaerobe Schwelle (4 mmol/l) = Kipppunkt zwischen Gleichgewicht und unaufhaltsamer Übersäuerung!",curriculumBadge:"Laktatschwellen"},{id:3,question:"Welcher Energiespeicher liefert in den ersten 5 bis 8 Sekunden eines explosiven 100-Meter-Sprints die Hauptmenge an ATP?",context:"Energiebereitstellungs-Phasen",options:[{text:"Die Verbrennung von Unterhautfettgewebe (Lipolyse).",isCorrect:!1,feedback:"Falsch. Lipolyse läuft viel zu träge an und liefert viel zu wenig ATP pro Sekunde für einen Sprint."},{text:"Vollständige aerobe Glukoseveratmung in den Mitochondrien.",isCorrect:!1,feedback:"Falsch. Die Sauerstoffzufuhr und aerobe Zellatmung benötigen mindestens 1–2 Minuten Anlaufzeit."},{text:"Eiweißabbau aus Muskelproteinen.",isCorrect:!1,feedback:"Falsch. Proteine werden im Muskel nur bei extremer Hungersnot zur Energiegewinnung herangezogen."},{text:"Kreatinphosphat (anaerob-alaktazide Energiebereitstellung): Es überträgt seine Phosphatgruppe blitzschnell auf ADP, ohne dass Laktat oder Sauerstoff nötig sind.",isCorrect:!0,feedback:"Brillant! Kreatinphosphat ist die zelleigene Schnellfeuer-Batterie. Seine Spaltung läuft sofort ohne Sauerstoff und ohne Laktatbildung ab, ist aber nach ca. 8–10 Sekunden erschöpft."}],misconceptionAlert:"Reihenfolge: 1. Kreatinphosphat (0–10 s) → 2. Anaerobe Glykolyse (10–60 s) → 3. Aerobe Glykolyse (ab 1 min) → 4. Fette (Dauer).",curriculumBadge:"Energiephasen"},{id:4,question:"Warum atmet ein Sportler nach einem 400-Meter-Lauf im Ziel noch minutenlang schwer und schnell weiter, obwohl die mechanische Leistung bereits 0 Watt beträgt (Sauerstoffschuld / EPOC)?",context:"Sauerstoffdefizit und Nachbelastungsphase",options:[{text:"Weil das Gehirn vergessen hat, wie man die Lunge anhält.",isCorrect:!1,feedback:"Falsch. Die Atmung wird über Chemosensoren durch CO₂ und pH-Wert gesteuert."},{text:"Zur Begleichung der Sauerstoffschuld: Auffüllen der entleerten Kreatinphosphat- und Myoglobinspeicher sowie energieaufwendiger Abbau des akkumulierten Laktats in Leber und Herz.",isCorrect:!0,feedback:"Exakt! Zu Beginn entstand ein Sauerstoffdefizit, da der O₂-Transport hinterherhinkte. Nach Belastungsende bleibt die O₂-Aufnahme erhöht (EPOC = Excess Post-exercise Oxygen Consumption), um ATP/KP zu resynthetisieren und Laktat über Glukoneogenese abzubauen."},{text:"Weil die Lunge beim Sprint gerissen ist und repariert werden muss.",isCorrect:!1,feedback:"Falsch. Ein gesunder Sportler erleidet beim Sprint keinen Lungenriss."},{text:"Weil der Körper nach dem Laufen die gesamte Luft aus der Atmosphäre absaugen will.",isCorrect:!1,feedback:"Unsinn."}],misconceptionAlert:"Sauerstoffdefizit beim Start = Sauerstoffschuld im Ziel! Nachatmen ist biologische Schuldentilgung.",curriculumBadge:"Sauerstoffschuld"},{id:5,question:"Warum greift der Körper bei maximaler Belastung (> 85 % der VO2max) fast ausschließlich auf Kohlenhydrate und nicht mehr auf Fette zurück?",context:"Ökonomie der Substratverbrennung",options:[{text:"Weil der Abbau von Fetten (β-Oxidation) ca. 10 % mehr Sauerstoff pro gebildetem Mol ATP benötigt und die maximale Flussrate (ATP pro Zeiteinheit) bei Fett viel zu gering ist.",isCorrect:!0,feedback:"Meisterhaft! Kohlenhydrate sind der Sauerstoff-effizientere Brennstoff: Aus 1 Liter O₂ gewinnt der Körper bei Glukose ca. 21,1 kJ, bei Fett nur 19,6 kJ. Zudem läuft die Glykolyse doppelt so schnell ab wie die Lipolyse."},{text:"Weil Fette im Körper nur zum Wärmen da sind und gar keine Energie enthalten.",isCorrect:!1,feedback:"Falsch. Fett enthält mit ca. 39 kJ/g mehr als doppelt so viel Energie wie Kohlenhydrate (17 kJ/g)."},{text:"Weil die Muskeln Fettmoleküle für Steine halten und abstoßen.",isCorrect:!1,feedback:"Unsinn."},{text:"Weil das Blut bei hoher Belastung so sauer wird, dass Fettflüssigkeit verdampft.",isCorrect:!1,feedback:"Falsch. Fette verdampfen nicht im Blut."}],misconceptionAlert:"Kohlenhydrate liefern pro Liter O₂ mehr Energie als Fett und brennen deutlich schneller ab!",curriculumBadge:"Brennstoff-Wahl"},{id:6,question:"Ein Mitschüler behauptet: „Muskelkater entsteht, weil sich Laktat-Kristalle wie Glasscherben in den Muskelfasern ablagern.“ Wie widerlegst du diesen Mythos fachlich?",context:"Laktat-Abbau vs. Muskelkater-Pathogenese",options:[{text:"Die Aussage stimmt; man kann Laktatkristalle mit einer Lupe unter der Haut glitzern sehen.",isCorrect:!1,feedback:"Falsch. Laktat kristallisiert im Körper niemals; es ist ein gelöstes Anion der Milchsäure."},{text:"Laktat entsteht gar nicht bei Muskelarbeit, sondern nur beim Käsen.",isCorrect:!1,feedback:"Falsch. Laktat ist das physiologische Stoffwechselprodukt der anaeroben Glykolyse im menschlichen Muskel."},{text:"Laktat hat eine Halbwertszeit von nur 15–20 Minuten und ist 1–2 Stunden nach Belastung komplett abgebaut. Muskelkater tritt erst nach 24–48 Stunden auf und beruht auf Mikrotraumata (mechanischen Rissen) in den Z-Scheiben der Sarkomere mit nachfolgender Entzündung.",isCorrect:!0,feedback:"Hervorragend entlarvt! Dieser Mythos hält sich hartnäckig. Wenn Laktat Muskelkater verursachen würde, hätten 400m-Läufer ihren stärksten Muskelkater direkt nach dem Rennen, nicht 2 Tage später!"},{text:"Muskelkater entsteht ausschließlich durch zu viel Kohlensäure im Mineralwasser.",isCorrect:!1,feedback:"Falsch. Kohlensäure im Magen hat mit Muskelkater nichts zu tun."}],misconceptionAlert:"Muskelkater ≠ Laktat! Laktat ist nach 90 min weg. Muskelkater = Mikrorisse in den Sarkomer-Z-Scheiben!",curriculumBadge:"Mythen-Check"}],Qs=[{term:"Aerobe Schwelle",definition:"Belastungsintensität (meist bei ca. 2,0 mmol/l Blutlaktat), bei der die rein oxidative Energiegewinnung nicht mehr ausreicht und die Laktatbildung ollast bis zu 35–40 l/min."},{term:"Kreatinphosphat (KP)",definition:"Hochenergetische Phosphatverbindung in der Muskelzelle zur anaerob-alaktaziden Sofort-Resynthese von ATP in den ersten 5–10 Belastungssekunden.",curriculumContext:"Energiebereitstellung",example:"Ein Gewichtheber oder 60m-Sprinter schöpft seine Maximalleistung fast vollständig aus Kreatinphosphat."},{term:"Laktat",pronunciation:"[lakˈtaːt]",definition:"Das Anion der Milchsäure, das beim anaeroben Abbau von Glukose zur Regeneration von NAD⁺ entsteht.",curriculumContext:"Glykolyse",example:"Laktat ist kein Abfall, sondern ein wertvoller Brennstoff, der im Herzmuskel veratmet und in der Leber zu Glukose recycliert wird (Cori-Zyklus)."},{term:"Lipolyse (β-Oxidation)",pronunciation:"[lipoˈlyːzə]",definition:"Spaltung von Triglyzeriden in Glycerin und freie Fettsäuren sowie deren aerober Abbau in den Mitochondrien zur Bildung von Acetyl-CoA und ATP.",curriculumContext:"Fettstoffwechsel",example:"Grundlage für Ultraläufe und lange Wanderungen, da die körpereigenen Fettdepots zehntausende Kilokalorien speichern."},{term:"Schlagvolumen (SV)",definition:"Die Blutmenge, die die linke Herzkammer bei einer einzigen Kontraktion (Systole) in die Aorta auswirft.",curriculumContext:"Herzfunktion",example:"Beim Untrainierten ca. 70 ml in Ruhe, beim Ausdauersportler bis zu 180 ml unter maximaler Belastung."},{term:"Sportherz (Cor athleticum)",definition:"Harmonische, physiologische Vergrößerung des Herzens (Muskelwandverdickung und Herzhöhlenerweiterung) als Anpassung an jahrelanges Ausdauertraining.",curriculumContext:"Sportbiologie 10",example:"Das Herzvolumen steigt von normal 700–800 ml auf über 1.200–1.400 ml bei Elitesportlern."}];function Df(){const[e,t]=q.useState("ergometer"),[n,r]=q.useState("untrained"),[l,i]=q.useState(0),[o,s]=q.useState(180),u=q.useMemo(()=>jr.find(w=>w.id===n)||jr[0],[n]),d=q.useMemo(()=>{const w=u.id==="untrained",m=l/u.maxWatt,Z=Math.round(u.restingHR+m*(u.maxHR-u.restingHR)),K=Math
