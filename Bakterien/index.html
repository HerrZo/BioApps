ch 12, nicht 12 mal 2."},{text:"240 Bakterien",isCorrect:!1,feedback:"Falsch. Du unterschätzt die gewaltige Dynamik des exponentiellen Anstiegs."},{text:"4.096 Bakterien (N = 1 · 2¹² = 4.096)",isCorrect:!0,feedback:"Hervorragend gerechnet! Nach der Formel N(t) = N₀ · 2ⁿ mit n = 12 Verdopplungen ergibt sich 2¹² = 4.096 Keime. Nach 8 Stunden wären es bereits über 16 Millionen!"},{text:"Genau 12 Bakterien, weil pro Stunde nur 3 Teilungen stattfinden.",isCorrect:!1,feedback:"Falsch. Bei jeder Teilung verdoppelt sich die GESAMTE vorhandene Population."}],misconceptionAlert:"Merksatz: Bei der Zweiteilung wächst die Zahl mit Potenzen: 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096!",curriculumBadge:"Wachstumskinetik"},{id:2,question:"Warum überwuchern Bakterien trotz ihres exponentiellen Wachstums nicht innerhalb weniger Tage die gesamte Erde? Welche Phase folgt auf die Log-Phase?",context:"Begrenzungsfaktoren & Stationäre Phase",options:[{text:"Die stationäre Phase: Nährstofferschöpfung, toxische Stoffwechselprodukte und Platzmangel bremsen das Wachstum, sodass Geburtenrate = Sterberate wird.",isCorrect:!0,feedback:"Absolut richtig! In jedem echten Lebensraum greifen Umweltkapazität und Dichteabhängigkeit: Sobald Glukose oder Sauerstoff knapp werden oder Säuren ansteigen, stoppt die Vermehrung."},{text:"Bakterien hören nach 100 Teilungen freiwillig auf, um ihren Nachkommen Platz zu machen.",isCorrect:!1,feedback:"Falsch. Bakterien handeln nicht altruistisch; das Stoppen ist eine rein physikochemische Folge von Ressourcenmangel."},{text:"Die Schwerkraft der Erde zerquetscht Bakterienkolonien, sobald sie zu hoch werden.",isCorrect:!1,feedback:"Unsinn."},{text:"Es folgt sofort die Lag-Phase, in der sich alle Zellen zurück ins Ei verwandeln.",isCorrect:!1,feedback:"Falsch. Die Lag-Phase liegt am Anfang des Wachstums, nicht nach der Log-Phase."}],misconceptionAlert:"Wachstumskurve im geschlossenen System: 1. Lag → 2. Log → 3. Stationär → 4. Absterben.",curriculumBadge:"Wachstumsphasen"},{id:3,question:"Auf welchem biophysikalischen Prinzip beruht die Haltbarmachung von Früchten durch das Einkochen mit viel Zucker zu Marmelade?",context:"Lebensmittelkonservierung: Osmose & Plasmolyse",options:[{text:"Zucker ist ein chemisches Gift, das die DNA der Bakterien sofort zersetzt.",isCorrect:!1,feedback:"Falsch. Zucker ist an sich ein Nährstoff, kein Zellgift."},{text:"Zucker kühlt die Marmelade dauerhaft auf unter 0 °C ab.",isCorrect:!1,feedback:"Falsch. Zucker kühlt nicht."},{text:"Zucker verklebt die Geißeln der Bakterien, sodass sie sich nicht mehr bewegen können.",isCorrect:!1,feedback:"Falsch. Die Bewegung ist für das Überleben nicht entscheidend."},{text:"Hoher osmotischer Druck: Die extrem hohe Zuckerkonzentration entzieht den Bakterien- und Schimmelpilzzellen durch Osmose das Wasser (Plasmolyse), wodurch ihr Stoffwechsel lahmgelegt wird.",isCorrect:!0,feedback:"Perfekt! Wasser strömt immer zur höheren Konzentration gelöster Teilchen. In 50 %iger Zuckerlösung dehydrieren Mikroorganismen völlig und können sich nicht mehr vermehren."}],misconceptionAlert:"Gleiches Prinzip wie beim Pökeln von Schinken mit Salz: Osmotische Dehydrierung (Plasmolyse)!",curriculumBadge:"Konservierung"},{id:4,question:"Was geschieht mit Bakterien bei einer Pasteurisierung (z. B. Erhitzen auf 75 °C für 15 bis 30 Sekunden)?",context:"Temperatureinfluss & Enzymdenaturierung",options:[{text:"Die Bakterien vermehren sich bei 75 °C doppelt so schnell wie bei 37 °C.",isCorrect:!1,feedback:"Falsch. Bei 75 °C ist die Hitzetoleranz mesophiler Bakterien weit überschritten."},{text:"Die lebensnotwendigen Proteine und Enzyme der Bakterien denaturieren irreversibel (Verlust der Tertiärstruktur), wodurch vegetative Keime absterben.",isCorrect:!0,feedback:"Hervorragend! Die thermische Energie zerstört Wasserstoffbrücken und Ionenbindungen der Enzyme. Das Bakterium kann keinen Stoffwechsel mehr durchführen und stirbt."},{text:"Alle Bakterien verwandeln sich in gasförmigen
