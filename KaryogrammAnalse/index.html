ikanthusfalte), flaches Profil, vergrößerte Zunge, Vierfingerfurche, Muskelschwäche (Hypotonie), Herzfehler, unterschiedliche Grade der geistigen Beeinträchtigung.",warum:"Ein zusätzliches Chromosom 21 → ca. 300 Gene werden 1,5× überexprimiert → Entwicklungsstörungen in Gehirn, Herz und Immunsystem. Die Gen-Dosis-Überexpression betrifft u. a. das APP-Gen (Alzheimer-Risiko) und SOD1 (oxidativer Stress)."},trisomy13:{title:"Trisomie 13 (Pätau-Syndrom)",desc:"Das Chromosom 13 liegt dreifach vor. Es handelt sich um eine sehr schwere Entwicklungsstörung mit stark verkürzter Lebenserwartung.",symptoms:"Lippen-Kiefer-Gaumenspalte, Polydaktylie (Vielfingrigkeit), kleine Augen (Mikrophthalmie), Fehlbildungen des Vorderhirns, Herzfehler, Nierenfehlbildungen.",warum:"Trisomie 13 führt zur Überexpression von Genen auf Chromosom 13, darunter ZIC2 (Vorderhirnentwicklung) und EDNRB (Herz-/Darmentwicklung). Die massive Gen-Dosis-Störung beeinträchtigt grundlegende Entwicklungsprozesse der Embryogenese."},trisomy18:{title:"Trisomie 18 (Edwards-Syndrom)",desc:"Das Chromosom 18 liegt dreifach vor. Es ist nach der Trisomie 21 die zweithäufigste autosomale Trisomie bei Neugeborenen.",symptoms:"Typische Fingerstellung (Überlagerung der Finger), Wiegenkufenfüße, tiefsitzende Ohren, kleiner Unterkiefer, schwerer Wachstumsrückstand, Herzfehler.",warum:"Überexpression von Genen auf Chromosom 18 stört die Signalwege der Embryogenese. Das TGIF1-Gen und weitere Transkriptionsfaktoren auf Chr. 18 sind dosierungssensitiv – ein drittes Allel verursacht schwere Fehlbildungen der Organsysteme."},turner:{title:"Turner-Syndrom (45, X)",desc:"Monosomie X: Es ist nur ein X-Chromosom vorhanden. Dies ist die einzige lebensfähige Monosomie beim Menschen. Betrifft phänotypisch weibliche Personen.",symptoms:"Kleinwuchs, Ausbleiben der Pubertät (Unfruchtbarkeit), Pterygium colli (seitliche Halsfalten), tiefer Haaransatz, lymphatische Ödeme, meist normale Intelligenz.",warum:"Nur ein X-Chromosom → wichtige Gene auf dem 2. X fehlen → Gonadenentwicklung gestört. Normalerweise entgehen einige Gene der X-Inaktivierung (PAR-Gene); ohne das 2. X sind diese Genprodukte halbiert, was Kleinwuchs und Gonadendysgenesie verursacht."},klinefelter:{title:"Klinefelter-Syndrom (47, XXY)",desc:"Männer mit einem zusätzlichen X-Chromosom. Die Ursache ist eine Nondisjunction der Gonosomen bei einem Elternteil.",symptoms:"Hochwuchs mit langen Extremitäten, Hodenunterfunktion (Hypogonadismus), verminderte Testosteronproduktion, oft Unfruchtbarkeit, eventuell Brustentwicklung (Gynäkomastie).",warum:"Zusätzliches X bei Männern → XIST-Gen inaktiviert es → aber einige Gene entkommen der Inaktivierung. Diese 'escapees' (z. B. KDM6A, SHOX) werden doppelt exprimiert. Der gestörte Hormonspiegel entsteht durch Atrophie der Leydig-Zellen im Hoden."},triplex:{title:"Triple-X-Syndrom (47, XXX)",desc:"Frauen mit einem zusätzlichen X-Chromosom. In den Zellen finden sich zwei Barr-Körperchen.",symptoms:"Oft klinisch unauffällig. Mögliche Merkmale: Hochwuchs, leichte Verzögerung der motorischen und sprachlichen Entwicklung, normale Fertilität.",warum:"Zwei der drei X-Chromosomen werden durch XIST inaktiviert, jedoch entkommen ~15 % der Gene der Inaktivierung. Diese leichte Überexpression von PAR- und anderen Escape-Genen erklärt die meist milden Phänotypmerkmale."},diploy:{title:"Diplo-Y-Syndrom (47, XYY)",desc:"Männer mit einem zusätzlichen Y-Chromosom. Entsteht durch Nondisjunction in der Spermatogenese.",symptoms:"Überdurchschnittlicher Hochwuchs, normale sexuelle Entwicklung und Fertilität. Keine erhöhte Aggressivität, evtl. leichte Lernschwierigkeiten.",warum:"Das Y-Chromosom enthält nur ~70 Gene; das zweite Y erhöht deren Dosis. Das SHOX-Gen auf dem Y erklärt den Hochwuchs. Da das Y-Chromosom keine Inaktivierung kennt, werden alle Gene auf dem zusätzlichen Y exprimiert."}},oc=[{value:"healthy",label:"Unauffällig / Gesund"},{value:"trisomy21",label:"Trisomie 21"},{value:"trisomy13",label:"Trisomie 13"},
