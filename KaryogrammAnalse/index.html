<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyo-Labor</title>
    <meta name="theme-color" content="#166534">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        * { box-sizing: border-box; }
    </style>
</head>
<body class="bg-green-50 min-h-screen text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SYNDROME_INFO = {
            "healthy": { title: "Unauffälliger Karyotyp", desc: "Es liegen 46 Chromosomen vor. Die Autosomen 1-22 liegen als homologe Paare vor. Die Gonosomen entsprechen dem phänotypischen Geschlecht (46,XX oder 46,XY).", symptoms: "Keine genetischen Auffälligkeiten im Karyogramm." },
            "trisomy21": { title: "Trisomie 21 (Down-Syndrom)", desc: "Das Chromosom 21 liegt dreifach vor (freie Trisomie). Dies entsteht meist durch eine Fehlverteilung (Nondisjunction) während der Meiose. Das Risiko für eine Trisomie 21 steigt mit dem Alter der Mutter.", symptoms: "Charakteristische Gesichtszüge (schräge Lidachsen, Epikanthusfalte), flaches Profil, vergrößerte Zunge, Vierfingerfurche in der Handinnenfläche, Muskelschwäche (Hypotonie), Herzfehler, unterschiedliche Grade der geistigen Beeinträchtigung." },
            "trisomy13": { title: "Trisomie 13 (Pätau-Syndrom)", desc: "Das Chromosom 13 liegt dreifach vor. Es handelt sich um eine sehr schwere Entwicklungsstörung. Die Lebenserwartung ist meist stark verkürzt.", symptoms: "Lippen-Kiefer-Gaumenspalte, Polydaktylie (Vielfingrigkeit), kleine Augen (Mikrophthalmie), Fehlbildungen des Vorderhirns, Herzfehler, Nierenfehlbildungen." },
            "trisomy18": { title: "Trisomie 18 (Edwards-Syndrom)", desc: "Das Chromosom 18 liegt dreifach vor. Es ist nach der Trisomie 21 die zweithäufigste autosomale Trisomie bei Neugeborenen.", symptoms: "Typische Fingerstellung (Überlagerung der Finger), Wiegenkufenfüße, tiefsitzende Ohren, kleiner Unterkiefer, schwerer Wachstumsrückstand, Herzfehler." },
            "turner": { title: "Turner-Syndrom (45, X)", desc: "Monosomie X: Es ist nur ein X-Chromosom vorhanden. Dies ist die einzige lebensfähige Monosomie beim Menschen. Betrifft phänotypisch weibliche Personen.", symptoms: "Kleinwuchs, Ausbleiben der Pubertät (Unfruchtbarkeit), Pterygium colli (seitliche Halsfalten), tiefer Haaransatz, lymphatische Ödeme, meist normale Intelligenz." },
            "klinefelter": { title: "Klinefelter-Syndrom (47, XXY)", desc: "Männer mit einem zusätzlichen X-Chromosom. Die Ursache ist eine Nondisjunction der Gonosomen bei einem Elternteil.", symptoms: "Hochwuchs mit langen Extremitäten, Hodenunterfunktion (Hypogonadismus), verminderte Testosteronproduktion, oft Unfruchtbarkeit, eventuell Brustentwicklung (Gynäkomastie)." },
            "triplex": { title: "Triple-X-Syndrom (47, XXX)", desc: "Frauen mit einem zusätzlichen X-Chromosom ('Super-Female'). In den Zellen finden sich zwei Barr-Körperchen.", symptoms: "Oft klinisch unauffällig. Mögliche Merkmale: Hochwuchs, leichte Verzögerung der motorischen und sprachlichen Entwicklung, normale Fertilität." },
            "diploy": { title: "Diplo-Y-Syndrom (47, XYY)", desc: "Männer mit einem zusätzlichen Y-Chromosom. Entsteht durch Nondisjunction in der Spermatogenese.", symptoms: "Überdurchschnittlicher Hochwuchs, normale sexuelle Entwicklung und Fertilität. Keine erhöhte Aggressivität, evtl. leichte Lernschwierigkeiten." }
        };

        const DIAGNOSIS_OPTIONS = [
            { value: 'healthy', label: 'Unauffällig / Gesund' },
            { value: 'trisomy21', label: 'Trisomie 21' },
            { value: 'trisomy13', label: 'Trisomie 13' },
            { value: 'trisomy18', label: 'Trisomie 18' },
            { value: 'turner', label: 'Turner-Syndrom (45,X)' },
            { value: 'klinefelter', label: 'Klinefelter-Syndrom (47,XXY)' },
            { value: 'triplex', label: 'Triple-X-Syndrom (47,XXX)' },
            { value: 'diploy', label: 'Diplo-Y-Syndrom (47,XYY)' },
        ];

        const generateChromosomes = (syndrome) => {
            const chromosomes = [];
            let sex = Math.random() > 0.5 ? 'XX' : 'XY';
            let trisomyPair = -1;

            switch (syndrome) {
                case 'healthy': break;
                case 'trisomy21': trisomyPair = 21; break;
                case 'trisomy13': trisomyPair = 13; break;
                case 'trisomy18': trisomyPair = 18; break;
                case 'turner': sex = 'X0'; break;
                case 'klinefelter': sex = 'XXY'; break;
                case 'triplex': sex = 'XXX'; break;
                case 'diploy': sex = 'XYY'; break;
            }

            for (let i = 1; i <= 22; i++) {
                const count = (i === trisomyPair) ? 3 : 2;
                for (let c = 0; c < count; c++) {
                    chromosomes.push({ id: `auto-${i}-${c}`, pairNum: i, type: 'autosome', rotation: Math.random() * 10 - 5, variant: Math.floor(Math.random() * 5) });
                }
            }

            const xCount = (sex.match(/X/g) || []).length;
            const yCount = (sex.match(/Y/g) || []).length;

            for (let x = 0; x < xCount; x++) {
                chromosomes.push({ id: `sex-x-${x}`, pairNum: 23, type: 'sex', rotation: Math.random() * 10 - 5, variant: Math.floor(Math.random() * 5) });
            }
            for (let y = 0; y < yCount; y++) {
                chromosomes.push({ id: `sex-y-${y}`, pairNum: 24, type: 'sex', rotation: Math.random() * 15 - 7, variant: Math.floor(Math.random() * 5) });
            }

            const totalCount = chromosomes.length;
            let genderLabel = sex.includes('Y') ? 'Männlich' : 'Weiblich';
            chromosomes.sort((a, b) => a.pairNum - b.pairNum);

            return { chromosomes, diagnosisKey: syndrome, totalCount, sex, genderLabel };
        };

        const getRandomCase = () => {
            const syndromes = ['healthy', 'healthy', 'healthy', 'trisomy21', 'trisomy21', 'turner', 'klinefelter', 'trisomy13', 'trisomy18', 'triplex', 'diploy'];
            return generateChromosomes(syndromes[Math.floor(Math.random() * syndromes.length)]);
        };

        const Chromosome = ({ pairNum, rotation = 0, variant = 1 }) => {
            let scale = 1;
            if (pairNum <= 22) scale = 1 - ((pairNum - 1) * 0.035);
            else if (pairNum === 23) scale = 0.8;
            else if (pairNum === 24) scale = 0.35;
            scale = Math.max(0.3, scale);

            const baseW = 16;
            const baseH = 90;
            const w = baseW * Math.max(0.75, scale);
            const h = baseH * scale;

            let pArmRatio = 0.35;
            if ([1, 3, 16, 19, 20].includes(pairNum)) pArmRatio = 0.46;
            else if ([13, 14, 15, 21, 22, 24].includes(pairNum)) pArmRatio = 0.13;

            const centromereY = h * pArmRatio;
            const constriction = 3;

            const bands = useMemo(() => {
                const b = [];
                const numBands = Math.floor(h / 3);
                for (let i = 0; i < numBands; i++) {
                    const y = i * 3;
                    if (y > centromereY - constriction - 4 && y < centromereY + constriction + 4) continue;
                    const seed = (pairNum * 1337 + i * 31 + variant * 7) % 100;
                    if (seed > 65) {
                        const bandHeight = (seed % 3) + 1.5;
                        b.push(<rect key={`d-${i}`} x={0} y={y} width={w} height={bandHeight} fill="rgba(15, 118, 110, 0.6)" />);
                    } else if (seed < 25) {
                        b.push(<rect key={`l-${i}`} x={0} y={y} width={w} height={1} fill="rgba(255,255,255,0.4)" />);
                    }
                }
                return b;
            }, [h, w, centromereY, pairNum, variant]);

            const pHeight = Math.max(0, centromereY - (constriction / 2));
            const qY = centromereY + (constriction / 2);
            const qHeight = Math.max(0, h - qY);
            const radius = w / 2;
            const gradId = `grad-${pairNum}-${variant}`;
            const clipId = `clip-${pairNum}-${variant}`;

            return (
                <div className="relative flex items-center justify-center transition-transform duration-300 hover:scale-110 cursor-pointer group"
                    style={{ width: baseW * 2.5, height: baseH + 20, transform: `rotate(${rotation}deg)` }}>
                    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="overflow-visible drop-shadow-sm">
                        <defs>
                            <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#5eead4" />
                                <stop offset="20%" stopColor="#2dd4bf" />
                                <stop offset="50%" stopColor="#0f766e" />
                                <stop offset="80%" stopColor="#2dd4bf" />
                                <stop offset="100%" stopColor="#14b8a6" />
                            </linearGradient>
                        </defs>
                        <clipPath id={clipId}>
                            {pArmRatio > 0.15 ? (
                                <rect x="0" y="0" width={w} height={pHeight} rx={radius} />
                            ) : (
                                <rect x={w / 4} y={0} width={w / 2} height={pHeight} />
                            )}
                            <rect x="0" y={qY} width={w} height={qHeight} rx={radius} />
                        </clipPath>

                        {pArmRatio > 0.15 ? (
                            <path d={`M 0 ${radius} A ${radius} ${radius} 0 0 1 ${w} ${radius} V ${pHeight - 2} Q ${w / 2} ${pHeight + 3} 0 ${pHeight - 2} Z`}
                                fill={`url(#${gradId})`} stroke="#0f766e" strokeWidth="0.5" />
                        ) : (
                            <g>
                                <line x1={w / 3} y1={pHeight} x2={w / 3} y2={pHeight / 2} stroke="#115e59" strokeWidth="1.5" />
                                <line x1={w * 2 / 3} y1={pHeight} x2={w * 2 / 3} y2={pHeight / 2} stroke="#115e59" strokeWidth="1.5" />
                                <circle cx={w / 3} cy={pHeight / 3} r={w / 4} fill={`url(#${gradId})`} stroke="#0f766e" strokeWidth="0.5" />
                                <circle cx={w * 2 / 3} cy={pHeight / 3} r={w / 4} fill={`url(#${gradId})`} stroke="#0f766e" strokeWidth="0.5" />
                            </g>
                        )}

                        <path d={`M 0 ${qY + 2} Q ${w / 2} ${qY - 3} ${w} ${qY + 2} V ${h - radius} A ${radius} ${radius} 0 0 1 0 ${h - radius} Z`}
                            fill={`url(#${gradId})`} stroke="#0f766e" strokeWidth="0.5" />

                        <g clipPath={`url(#${clipId})`} style={{ mixBlendMode: 'multiply' }}>{bands}</g>

                        <ellipse cx={w / 2} cy={centromereY} rx={w / 2.5} ry={constriction} fill="#134e4a" opacity="0.3" />

                        <path d={`M ${w * 0.3} ${radius} V ${h - radius}`} stroke="white" strokeWidth="2" strokeOpacity="0.15" strokeLinecap="round" fill="none" style={{ filter: 'blur(1px)' }} />
                    </svg>
                </div>
            );
        };

        const Karyogram = ({ chromosomes }) => {
            const pairs = {};
            for (let i = 1; i <= 24; i++) pairs[i] = [];
            chromosomes.forEach(c => { if (pairs[c.pairNum]) pairs[c.pairNum].push(c); });

            const renderPair = (num, label) => {
                const pairChromos = pairs[num] || [];
                return (
                    <div key={num} className="flex flex-col items-center p-1 bg-white/50 rounded-lg border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                        <div className="flex items-end justify-center gap-1 min-h-[90px] w-full">
                            {pairChromos.map(c => (
                                <Chromosome key={c.id} pairNum={c.pairNum} rotation={c.rotation} variant={c.variant} />
                            ))}
                            {pairChromos.length === 0 && <div className="text-xs text-slate-300 italic self-center">Fehlt</div>}
                        </div>
                        <span className="text-xs font-bold text-slate-500 mt-1">{label}</span>
                    </div>
                );
            };

            return (
                <div className="bg-white rounded-xl shadow-inner p-4 border border-slate-200">
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
                        {Array.from({ length: 22 }, (_, i) => i + 1).map(num => renderPair(num, num.toString()))}
                        <div className="col-span-2 md:col-span-2 flex justify-center gap-4 bg-green-50/50 rounded-xl border-2 border-dashed border-green-100 p-2">
                            {renderPair(23, 'X')}
                            {renderPair(24, 'Y')}
                        </div>
                    </div>
                </div>
            );
        };

        const InfoModal = ({ content, onClose }) => {
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-green-400 to-green-600"></div>
                        <button onClick={onClose} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-red-500 hover:bg-slate-100 rounded-full transition-colors">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        <div className="mt-2">
                            <h3 className="text-2xl font-bold text-slate-800 mb-1">{content.title}</h3>
                            <div className="h-1 w-16 bg-green-500 rounded-full mb-4"></div>
                            <div className="space-y-4 overflow-y-auto pr-2">
                                <div>
                                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Beschreibung</h4>
                                    <p className="text-slate-700 leading-relaxed text-lg">{content.desc}</p>
                                </div>
                                {content.symptoms && (
                                    <div className="bg-green-50 p-4 rounded-xl border border-green-100">
                                        <strong className="text-green-800 block mb-2 text-sm uppercase tracking-wide flex items-center gap-2">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            Klinische Merkmale
                                        </strong>
                                        <span className="text-slate-700">{content.symptoms}</span>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="mt-8 pt-4 border-t border-slate-100">
                            <button onClick={onClose} className="w-full bg-slate-800 text-white font-medium py-3 rounded-lg hover:bg-slate-700 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                Verstanden
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentCase, setCurrentCase] = useState(null);
            const [userAnswer, setUserAnswer] = useState({ count: '', gender: '', diagnosis: '' });
            const [feedback, setFeedback] = useState({ type: null, msg: '' });
            const [showInfo, setShowInfo] = useState(false);
            const [showLexicon, setShowLexicon] = useState(false);
            const [lexiconKey, setLexiconKey] = useState(null);

            useEffect(() => { generateNewCase(); }, []);

            const generateNewCase = () => {
                const newCase = getRandomCase();
                setCurrentCase(newCase);
                setUserAnswer({ count: '', gender: '', diagnosis: '' });
                setFeedback({ type: null, msg: '' });
                setShowInfo(false);
            };

            const checkAnswer = () => {
                if (!currentCase) return;
                const countCorrect = parseInt(userAnswer.count) === currentCase.totalCount;
                const genderCorrect = userAnswer.gender === currentCase.genderLabel;
                const diagnosisCorrect = userAnswer.diagnosis === currentCase.diagnosisKey;

                if (countCorrect && genderCorrect && diagnosisCorrect) {
                    setFeedback({ type: 'success', msg: 'Perfekt! Deine Analyse ist vollständig korrekt.' });
                } else {
                    let errors = [];
                    if (!countCorrect) errors.push('Chromosomenzahl');
                    if (!genderCorrect) errors.push('Geschlecht');
                    if (!diagnosisCorrect) errors.push('Diagnose');
                    setFeedback({ type: 'error', msg: `Nicht ganz. Überprüfe: ${errors.join(', ')}.` });
                }
            };

            const handleLexiconOpen = (key) => {
                setLexiconKey(key);
                setShowLexicon(true);
            };

            if (!currentCase) return <div className="flex items-center justify-center h-screen text-green-600">Lade Labor...</div>;

            return (
                <div className="min-h-screen bg-green-50 font-sans text-slate-900 pb-12">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <span className="text-3xl">🧬</span>
                                <h1 className="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-600 to-green-600">Karyo-Labor</h1>
                            </div>
                            <div className="flex gap-2">
                                {feedback.type === 'success' && (
                                    <button onClick={() => setShowInfo(true)} className="hidden md:flex items-center gap-2 bg-green-100 text-green-800 px-4 py-2 rounded-full text-sm font-medium hover:bg-green-200 transition">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        Infos zum Fall
                                    </button>
                                )}
                                <button onClick={() => handleLexiconOpen('healthy')} className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-700 transition shadow-md">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                    Lexikon
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                            <section className="lg:col-span-8 space-y-4">
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-1">
                                    <div className="bg-green-50 rounded-xl p-4 border-b border-green-100 mb-2 flex justify-between items-center">
                                        <h2 className="font-semibold text-slate-700 flex items-center gap-2">
                                            <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                            Karyogramm Ansicht
                                        </h2>
                                        <span className="text-xs font-mono text-slate-400 bg-slate-100 px-2 py-1 rounded">Fall-ID: {currentCase && Math.random().toString(36).substr(2, 6).toUpperCase()}</span>
                                    </div>
                                    <div className="p-2">
                                        <Karyogram chromosomes={currentCase.chromosomes} />
                                    </div>
                                </div>
                            </section>

                            <section className="lg:col-span-4 space-y-6">
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden sticky top-24">
                                    <div className="bg-gradient-to-r from-slate-800 to-slate-900 px-6 py-4">
                                        <h2 className="text-white font-bold text-lg flex items-center gap-2">
                                            <svg className="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                            Analyse & Diagnose
                                        </h2>
                                    </div>

                                    <div className="p-6 space-y-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">1. Chromosomenzahl zählen</label>
                                            <input type="number" className="w-full bg-white text-slate-900 border-2 border-slate-200 rounded-lg p-3 text-lg focus:ring-4 focus:ring-green-500/20 focus:border-green-500 transition outline-none" placeholder="z.B. 46"
                                                value={userAnswer.count} onChange={(e) => setUserAnswer({ ...userAnswer, count: e.target.value })} />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">2. Genetisches Geschlecht</label>
                                            <div className="grid grid-cols-2 gap-3">
                                                {['Weiblich', 'Männlich'].map(g => (
                                                    <button key={g} onClick={() => setUserAnswer({ ...userAnswer, gender: g })}
                                                        className={`py-3 rounded-lg border-2 font-medium transition ${userAnswer.gender === g ? 'border-green-500 bg-green-50 text-green-800' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                                                        {g}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">3. Klinischer Befund</label>
                                            <select className="w-full border-2 border-slate-200 rounded-lg p-3 bg-white focus:ring-4 focus:ring-green-500/20 focus:border-green-500 transition outline-none text-slate-700"
                                                value={userAnswer.diagnosis} onChange={(e) => setUserAnswer({ ...userAnswer, diagnosis: e.target.value })}>
                                                <option value="">-- Diagnose wählen --</option>
                                                {DIAGNOSIS_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>

                                        {feedback.msg && (
                                            <div className={`p-4 rounded-xl flex items-start gap-3 ${feedback.type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'}`}>
                                                <span className="text-xl">{feedback.type === 'success' ? '🎉' : '⚠️'}</span>
                                                <div>
                                                    <strong className="block mb-1">{feedback.type === 'success' ? 'Richtig!' : 'Fehler gefunden'}</strong>
                                                    <p className="text-sm opacity-90">{feedback.msg}</p>
                                                </div>
                                            </div>
                                        )}

                                        <div className="pt-2 space-y-3">
                                            {feedback.type !== 'success' ? (
                                                <button onClick={checkAnswer} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all active:scale-95">Auswerten</button>
                                            ) : (
                                                <div className="space-y-3 animate-in">
                                                    <button onClick={() => setShowInfo(true)} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">ℹ️ Infos zum Syndrom lesen</button>
                                                    <button onClick={generateNewCase} className="w-full bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-50 transition-all flex justify-center items-center gap-2">Nächster Fall ➡️</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </main>

                    {showInfo && currentCase && <InfoModal content={SYNDROME_INFO[currentCase.diagnosisKey]} onClose={() => setShowInfo(false)} />}

                    {showLexicon && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in">
                            <div className="bg-white w-full max-w-4xl h-[80vh] rounded-2xl overflow-hidden flex shadow-2xl">
                                <div className="w-1/3 bg-green-50 border-r border-slate-200 overflow-y-auto">
                                    <div className="p-4 bg-green-100 border-b border-green-200 sticky top-0"><h3 className="font-bold text-green-700">📚 Syndrome</h3></div>
                                    {DIAGNOSIS_OPTIONS.map(opt => (
                                        <button key={opt.value} onClick={() => setLexiconKey(opt.value)}
                                            className={`w-full text-left p-4 border-b border-slate-100 transition hover:bg-green-50 ${lexiconKey === opt.value ? 'bg-green-50 text-green-800 font-bold border-l-4 border-l-green-500' : 'text-slate-600'}`}>
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="w-2/3 p-8 overflow-y-auto relative">
                                    <button onClick={() => setShowLexicon(false)} className="absolute top-4 right-4 p-2 bg-slate-100 rounded-full hover:bg-red-100 hover:text-red-500 transition"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    {lexiconKey && (
                                        <div>
                                            <h2 className="text-3xl font-bold text-green-700 mb-4">{SYNDROME_INFO[lexiconKey].title}</h2>
                                            <p className="text-xl text-slate-800 leading-relaxed mb-8">{SYNDROME_INFO[lexiconKey].desc}</p>
                                            {SYNDROME_INFO[lexiconKey].symptoms && (
                                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                                                    <h4 className="font-bold text-slate-900 uppercase tracking-wider mb-2 text-sm">Symptome & Merkmale</h4>
                                                    <p className="text-slate-600">{SYNDROME_INFO[lexiconKey].symptoms}</p>
                                                </div>
                                            )}
                                            <div className="mt-8 flex gap-2">
                                                <span className="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full uppercase tracking-wide font-bold">Genetik</span>
                                                <span className="inline-block bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full uppercase tracking-wide font-bold">Medizin</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-white border-t py-4 text-center text-xs md:text-sm text-gray-500 mt-8">
                        <p>Johannes-Scharrer-Gymnasium • Zollfrank • &copy; {new Date().getFullYear()}</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
